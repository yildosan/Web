<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFind AI - Akıllı İçerik Dedektifi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Puter.js SDK -->
    <script src="https://js.puter.com/v2/puter.js"></script>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-orange-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-dark-900/80 border-b border-gray-800">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i class="fa-solid fa-clapperboard text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent">CineFind AI</h1>
                    <p class="text-xs text-gray-400">Yapay Zeka & Web Destekli İçerik Dedektifi</p>
                </div>
            </div>

            <!-- Puter Status Button -->
            <button id="puterAuthBtn" onclick="togglePuterAuth()" class="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full border border-orange-500/40 bg-orange-500/10 text-orange-400 hover:bg-orange-500/20 transition-all shadow-sm">
                <span id="authDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="authText">Puter Bağlanıyor...</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 pb-20">
        
        <!-- Hero Intro -->
        <div class="mb-6 bg-gradient-to-r from-dark-800 to-dark-700 p-5 rounded-2xl border border-gray-800 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-orange-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <h2 class="text-base font-semibold text-orange-400 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Adını Unuttuğun İçeriği Bul!
            </h2>
            <p class="text-xs text-gray-300 leading-relaxed">
                Hatırladığınız karakterleri, sahneleri veya ipuçlarını aşağıya yazın; yapay zeka web araması yaparak en doğru filmi, diziyi veya animeyi sizin için bulsun.
            </p>
        </div>

        <!-- Form Section -->
        <form id="searchForm" onsubmit="handleSearch(event)" class="space-y-4">
            
            <!-- İçerik Türü -->
            <div class="bg-dark-800/60 p-4 rounded-xl border border-gray-800/80 focus-within:border-orange-500/60 transition-all">
                <label class="block text-xs font-medium text-gray-300 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-film text-orange-500"></i> İçerik Türü
                </label>
                <select id="contentType" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500/50">
                    <option value="Fark Etmez">Tümü / Fark Etmez</option>
                    <option value="Film">Film</option>
                    <option value="Dizi">Dizi</option>
                    <option value="Anime">Anime</option>
                    <option value="Çizgi Film">Çizgi Film</option>
                </select>
            </div>

            <!-- Kategori / Tür -->
            <div class="bg-dark-800/60 p-4 rounded-xl border border-gray-800/80 focus-within:border-orange-500/60 transition-all">
                <label class="block text-xs font-medium text-gray-300 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-masks-theater text-orange-500"></i> Kategori / Tür
                </label>
                <input type="text" id="genre" placeholder="Örn: Bilim Kurgu, Komedi, Aksiyon, Korku..." class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50">
            </div>

            <!-- Yayınlanma Yılı / Aralığı -->
            <div class="bg-dark-800/60 p-4 rounded-xl border border-gray-800/80 focus-within:border-orange-500/60 transition-all">
                <label class="block text-xs font-medium text-gray-300 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-days text-orange-500"></i> Yayınlanma Yılı / Aralığı
                </label>
                <input type="text" id="releaseYear" placeholder="Örn: 2010-2015 arası, 2018 veya tam hatırlamıyorum" class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50">
            </div>

            <!-- Oyuncular, Yönetmen veya İpuçları -->
            <div class="bg-dark-800/60 p-4 rounded-xl border border-gray-800/80 focus-within:border-orange-500/60 transition-all">
                <label class="block text-xs font-medium text-gray-300 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-orange-500"></i> Oyuncular, Yönetmen veya İpuçları
                </label>
                <input type="text" id="hints" placeholder="Örn: Leonardo DiCaprio, uzayda geçen, robotlar var..." class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50">
            </div>

            <!-- Hatırlanan Konu / Sahne Açıklaması -->
            <div class="bg-dark-800/60 p-4 rounded-xl border border-gray-800/80 focus-within:border-orange-500/60 transition-all">
                <label class="block text-xs font-medium text-gray-300 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-align-left text-orange-500"></i> Hatırlanan Konu / Sahne Açıklaması <span class="text-orange-500">*</span>
                </label>
                <textarea id="description" rows="4" required placeholder="Örn: Adam rüya içinde rüya görüyordu ve sonunda bir topaç dönüyordu..." class="w-full bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50 resize-y"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-orange-600 to-amber-500 text-white font-semibold shadow-lg shadow-orange-600/30 hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-wand-magic text-base"></i> İçeriği Bul
            </button>
        </form>

        <!-- Results Section Container -->
        <div id="resultsContainer" class="mt-8 hidden space-y-4">
            <h3 class="text-sm font-semibold text-gray-300 flex items-center gap-2 border-b border-gray-800 pb-2">
                <i class="fa-solid fa-bullseye text-orange-500"></i> Arama Sonuçları & Tahminler
            </h3>
            <div id="resultsContent" class="bg-dark-800/80 p-5 rounded-2xl border border-gray-800 text-sm leading-relaxed text-gray-200 space-y-3">
                <!-- AI Output goes here -->
            </div>
        </div>
    </main>

    <!-- Footer Script -->
    <script>
        // Puter SDK'nın yüklenmesi için küçük bir gecikmeli kontrol (1 saniye)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkPuterConnection, 1000);
        });

        function checkPuterConnection() {
            const authDot = document.getElementById('authDot');
            const authText = document.getElementById('authText');
            
            try {
                if (typeof puter !== 'undefined' && puter.auth) {
                    if (puter.auth.isSignedIn()) {
                        authDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                        authText.textContent = "Puter Bağlı";
                    } else {
                        authDot.className = "w-2 h-2 rounded-full bg-amber-400";
                        authText.textContent = "Giriş Yap / Bağlan";
                    }
                } else {
                    // Eğer script hala yüklenmediyse 1 saniye sonra tekrar dene
                    setTimeout(checkPuterConnection, 1500);
                }
            } catch (e) {
                console.error("Bağlantı kontrol hatası:", e);
                authDot.className = "w-2 h-2 rounded-full bg-red-500";
                authText.textContent = "Çevrimdışı Mod";
            }
        }

        async function togglePuterAuth() {
            try {
                if (typeof puter !== 'undefined' && puter.auth) {
                    document.getElementById('authText').textContent = "Bağlanıyor...";
                    await puter.auth.signIn();
                    checkPuterConnection();
                } else {
                    alert("Puter.js kütüphanesi yüklenemedi. Lütfen sayfayı yenileyin.");
                }
            } catch (err) {
                console.error("Giriş hatası:", err);
                checkPuterConnection();
            }
        }

        // Form Gönderimi ve Yapay Zeka Sorgusu
        async function handleSearch(event) {
            event.preventDefault();

            const contentType = document.getElementById('contentType').value;
            const genre = document.getElementById('genre').value.trim();
            const releaseYear = document.getElementById('releaseYear').value.trim();
            const hints = document.getElementById('hints').value.trim();
            const description = document.getElementById('description').value.trim();

            const resultsContainer = document.getElementById('resultsContainer');
            const resultsContent = document.getElementById('resultsContent');
            const submitBtn = document.getElementById('submitBtn');

            resultsContainer.classList.remove('hidden');
            resultsContent.innerHTML = `
                <div class="flex items-center justify-center py-8 space-x-3 text-orange-400">
                    <i class="fa-solid fa-spinner fa-spin text-xl"></i>
                    <span class="text-sm font-medium">Yapay zeka veritabanı ve web kaynakları taranıyor...</span>
                </div>
            `;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');

            const prompt = `Sen uzman bir sinema, dizi, anime ve çizgi film dedektifisin. Kullanıcının verdiği eksik veya dağınık ipuçlarını analiz ederek en olası eşleşmeleri bulmalısın. Web araması yeteneklerini kullanarak güncel bilgileri tara.

Kullanıcının Verdiği Bilgiler:
- İçerik Türü: ${contentType}
- Kategori/Tür: ${genre || 'Belirtilmedi'}
- Yayın Yılı/Aralığı: ${releaseYear || 'Belirtilmedi'}
- Oyuncu/Yönetmen/Özel İpuçları: ${hints || 'Belirtilmedi'}
- Sahne/Konu Açıklaması: ${description}

Lütfen bu bilgilere en uygun en güçlü 2 veya 3 içeriği şu formatta listele:
1. **Orijinal ve Türkçe Adı** (Yayın Yılı - Türü)
2. **Benzerlik Nedeni / Neden Eşleşti?**
3. **Konu Özeti** (Kısa)
4. **Oyuncular / Yapımcı**

Yanıtı şık, mobil uyumlu, temiz Markdown/HTML formatında ve Türkçe olarak ver.`;

            try {
                if (typeof puter === 'undefined' || !puter.ai) {
                    throw new Error("Puter AI kütüphanesi aktif değil.");
                }

                // Oturum açık değilse otomatik giriş tetiklemeyi dene
                if (puter.auth && !puter.auth.isSignedIn()) {
                    try {
                        await puter.auth.signIn();
                    } catch (e) {
                        console.log("Oturum açma atlandı.");
                    }
                }

                const response = await puter.ai.chat(prompt);
                
                let responseText = "";
                if (typeof response === 'string') {
                    responseText = response;
                } else if (response && response.message && response.message.content) {
                    responseText = response.message.content;
                } else if (response && response.text) {
                    responseText = response.text;
                } else {
                    responseText = JSON.stringify(response);
                }

                let formattedHtml = responseText
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="text-orange-400 font-semibold">$1</strong>')
                    .replace(/\n/g, '<br>');

                resultsContent.innerHTML = `
                    <div class="space-y-4">
                        <div class="text-xs text-emerald-400 flex items-center gap-1.5 bg-emerald-500/10 p-2.5 rounded-lg border border-emerald-500/20">
                            <i class="fa-solid fa-circle-check"></i> En olası içerikler başarıyla bulundu:
                        </div>
                        <div class="text-gray-200 leading-relaxed">${formattedHtml}</div>
                    </div>
                `;

            } catch (error) {
                console.error("Yapay zeka hata:", error);
                resultsContent.innerHTML = `
                    <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs space-y-2">
                        <p class="font-semibold flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation"></i> İçerik aranırken bir sorun oluştu.</p>
                        <p>Detay: ${error.message || 'Bilinmeyen hata'}</p>
                        <p class="text-gray-300">Lütfen üst kısımdaki <span class="text-orange-400 font-medium">"Giriş Yap / Bağlan"</span> butonuna dokunarak Puter oturumunu onaylayın ve tekrar deneyin.</p>
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
