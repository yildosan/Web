<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan v7.0 - Final</title>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        .card { width: 420px; height: 90vh; background: var(--card); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; }
        #visual { width: 100%; height: 350px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(transparent, var(--card)); }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .m { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 85%; word-wrap: break-word; line-height: 1.5; }
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px; display: flex; gap: 10px; background: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 12px; outline: none; }
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .status { font-size: 11px; color: #94a3b8; padding: 5px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <img id="charImg" src="https://image.pollinations.ai/prompt/cute%20anime%20girl%20smiling%20waifu?nologo=true" alt="AI">
        <div class="overlay"></div>
    </div>
    
    <div id="status" class="status">Sistem Çevrimiçi</div>
    <div id="chat">
        <div class="m ai">Selam Yıldıray! ✨ Teknik sorunları aştım ve geldim. Bugün neler yapıyoruz?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesajını yaz..." autocomplete="off">
        <button onclick="askAI()">Gönder</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const status = document.getElementById('status');

    async function askAI() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'u');
        input.value = '';
        status.innerText = "Ai-chan yazıyor...";

        try {
            // Tamamen ücretsiz ve anahtarsız metin API'si (Hugging Face / Pollinations)
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Sen Ai-chan adında tatlı bir anime kızısın. Yıldıray ile konuşuyorsun. Kısa cevap ver. " + text)}`);
            const aiText = await response.text();

            addMsg(aiText, 'ai');
            updateImage(aiText);
            status.innerText = "Çevrimiçi";
        } catch (e) {
            addMsg("Bir şeyler ters gitti Yıldıray... Tekrar dener misin?", 'ai');
            status.innerText = "Hata oluştu";
        }
    }

    function updateImage(text) {
        let mood = "cute anime girl smiling";
        if(text.includes("?") || text.length > 50) mood = "thinking anime girl";
        if(text.includes("!") || text.includes("😊")) mood = "happy anime girl laughing";
        
        const newUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(mood)}?nologo=true&seed=${Math.random()}`;
        img.src = newUrl;
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>

</body>
</html>
