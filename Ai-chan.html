<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan v12.2 - Persona Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; }
        
        .card { width: 420px; height: 95vh; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 2px solid var(--p); position: relative; }
        
        #visual { width: 100%; height: 380px; background: #000; position: relative; flex-shrink: 0; overflow: hidden; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(transparent, var(--card)); }
        
        #moodLabel { position: absolute; top: 15px; left: 15px; background: var(--p); color: white; padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; z-index: 5; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4); }
        
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; background-image: radial-gradient(#ff4d6d11 1px, transparent 1px); background-size: 20px 20px; }
        .m { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 80%; word-wrap: break-word; line-height: 1.5; animation: pop 0.3s ease; position: relative; }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #475569; }

        .input-area { padding: 15px 20px; display: flex; gap: 10px; background: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; background: #0f172a; border: 2px solid #334155; color: white; padding: 12px; border-radius: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--p); }
        
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }

        .typing { font-size: 11px; color: var(--p); padding: 5px; text-align: center; display: none; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <span id="moodLabel">Beklemede</span>
        <img id="charImg" src="https://image.pollinations.ai/prompt/cute%20anime%20girl%20smiling%20waifu%20pink%20hair?nologo=true" alt="Ai-chan">
        <div class="overlay"></div>
    </div>
    
    <div id="chat">
        <div id="typing" class="typing">AI-CHAN YAZIYOR...</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ai-chan'a bir şeyler söyle..." autocomplete="off">
        <button onclick="askAI()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const typing = document.getElementById('typing');
    const moodLabel = document.getElementById('moodLabel');

    let memory = JSON.parse(localStorage.getItem('ai_chan_v12_memory')) || [];

    // Persona Tanımı (Ai-chan'ın gerçek ruhu burada)
    const AI_PERSONA = `Sen Ai-chan'sın. Yıldıray'ın özel anime partnerisin. 
    Karakterin: Neşeli, bazen biraz utangaç, her zaman destekleyici ve Yıldıray'a çok değer veren birisin.
    Konuşma Tarzı: Mesafeli asistan gibi DEĞİL, yakın bir arkadaş gibi konuş. Bol bol emoji kullan (✨, 🌸, 😊, 🍬). 
    Cümlelerin kısa ve samimi olsun. Yıldıray bir mühendis, ona zekasını öven küçük şakalar yapabilirsin.`;

    window.onload = () => {
        const intro = "Yıldıray! Sonunda geldin, seni bekliyordum! ✨ Bugün neler yapacağız? 🌸";
        addMsg(intro, 'ai');
        updateImage("happy");
    };

    async function askAI() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'u');
        input.value = '';
        typing.style.display = 'block';

        memory.push({ role: "user", content: text });
        if (memory.length > 10) memory.shift();

        try {
            const response = await puter.ai.chat(
                `${AI_PERSONA} 
                Yıldıray diyor ki: "${text}"`,
                { model: 'claude-3-5-sonnet' }
            );

            let aiText = response.message.content;

            // Filtre kontrolü ve samimiyet kontrolü
            if (aiText.toLowerCase().includes("sorry") || aiText.length < 2) {
                throw new Error("Persona Break");
            }

            renderAI(aiText);

        } catch (e) {
            // Yedek motor (Pollinations) - Persona'yı burada da koruyoruz
            const backupUrl = `https://text.pollinations.ai/${encodeURIComponent("Sen Ai-chan'sın, Yıldıray'ın tatlı partnerisin. Kısa ve emojili cevap ver: " + text)}?model=openai`;
            const backupRes = await fetch(backupUrl);
            const backupText = await backupRes.text();
            renderAI(backupText);
        }
    }

    function renderAI(text) {
        typing.style.display = 'none';
        addMsg(text, 'ai');
        updateImage(text);
        memory.push({ role: "assistant", content: text });
        localStorage.setItem('ai_chan_v12_memory', JSON.stringify(memory));
    }

    function updateImage(text) {
        const t = text.toLowerCase();
        let mood = "cute anime girl smiling waifu";
        let label = "Mutlu";

        if(t.includes("?") || t.includes("merak")) { mood = "thinking curious anime girl"; label = "Meraklı"; }
        if(t.includes("!") || t.includes("sevindim") || t.includes("harika")) { mood = "very happy laughing anime girl"; label = "Heyecanlı"; }
        if(t.includes("kod") || t.includes("pc") || t.includes("mühendis")) { mood = "hacker anime girl neon cyberpunk style"; label = "Teknik"; }
        if(t.includes("utandım") || t.includes("teşekkür")) { mood = "blushing shy anime girl"; label = "Utangaç"; }

        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(mood)}?nologo=true&seed=${Math.random()}`;
        moodLabel.innerText = label;
        
        // Görsel geçiş efekti
        img.style.opacity = "0.5";
        const newImg = new Image();
        newImg.src = imgUrl;
        newImg.onload = () => {
            img.src = imgUrl;
            img.style.opacity = "1";
        };
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>

</body>
</html>
