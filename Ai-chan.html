<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan v10.2 - Ultimate Edition</title>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; }
        
        .card { width: 420px; height: 95vh; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; }
        
        #visual { width: 100%; height: 380px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: 0.8s ease; }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(transparent, var(--card)); }
        
        #moodLabel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: var(--p); padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; z-index: 5; }
        #timeDisplay { position: absolute; top: 15px; right: 15px; font-size: 10px; color: #94a3b8; font-weight: bold; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 10px; }

        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .m { padding: 12px 16px; border-radius: 20px; font-size: 14px; max-width: 80%; word-wrap: break-word; line-height: 1.5; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 4px 12px rgba(255, 77, 109, 0.2); }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }

        .input-area { padding: 15px 20px; display: flex; gap: 10px; background: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--p); }
        
        button { background: var(--p); border: none; color: white; padding: 0 18px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { transform: scale(1.05); }

        .typing { font-size: 11px; color: var(--p); padding: 5px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <span id="moodLabel">Nötr</span>
        <div id="timeDisplay">00:00</div>
        <img id="charImg" src="https://image.pollinations.ai/prompt/cute%20anime%20girl%20smiling%20waifu?nologo=true" alt="Ai-chan">
        <div class="overlay"></div>
    </div>
    
    <div id="chat">
        <div id="typing" class="typing">AI-CHAN DÜŞÜNÜYOR...</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ai-chan ile konuş..." autocomplete="off">
        <button onclick="askAI()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const typing = document.getElementById('typing');
    const moodLabel = document.getElementById('moodLabel');
    const timeDisplay = document.getElementById('timeDisplay');

    // --- HAFIZA VE SAAT ---
    let memory = JSON.parse(localStorage.getItem('ai_chan_v10_memory')) || [];

    function updateTime() {
        const now = new Date();
        timeDisplay.innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        return now.getHours();
    }
    setInterval(updateTime, 1000);

    // Açılış Karşılaması
    window.onload = () => {
        const hr = updateTime();
        let greet = "Merhaba Yıldıray! ✨";
        if (hr >= 5 && hr < 12) greet = "Günaydın Yıldıray! ✨ Harika bir gün olsun!";
        else if (hr >= 18 && hr < 22) greet = "İyi akşamlar Yıldıray! ✨ Günün nasıl geçti?";
        else if (hr >= 22 || hr < 5) greet = "İyi geceler Yıldıray... ✨ Hala projelerle mi uğraşıyorsun?";

        addMsg(greet, 'ai');
        if (memory.length > 0) addMsg("(Hafızamdaki her şeyi hatırlıyorum!)", 'ai');
        
        // Tarayıcılar etkileşim olmadan ses çalmadığı için kullanıcı tıklandığında konuşması sağlanır
        document.body.addEventListener('click', () => speak(greet), { once: true });
    };

    // --- EMOJİSİZ SESLENDİRME ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            
            // Regex ile emojileri temizle
            const cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();
            
            if (cleanText.length === 0) return;

            const msg = new SpeechSynthesisUtterance(cleanText);
            msg.lang = 'tr-TR';
            msg.rate = 1.15;
            msg.pitch = 1.3;

            const voices = window.speechSynthesis.getVoices();
            const trVoice = voices.find(v => v.lang.includes('tr') && v.name.includes('Google')) || voices.find(v => v.lang.includes('tr'));
            if (trVoice) msg.voice = trVoice;

            window.speechSynthesis.speak(msg);
        }
    }

    async function askAI() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'u');
        input.value = '';
        typing.style.display = 'block';

        // Hafızaya kaydet
        memory.push({ u: text });
        if (memory.length > 10) memory.shift();
        localStorage.setItem('ai_chan_v10_memory', JSON.stringify(memory));

        try {
            const historyText = memory.map(m => m.u || m.a).join(" | ");
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Sen Ai-chan'sın, Yıldıray'ın anime partnerisin. Tatlı ve kısa cevap ver. Hafıza: " + historyText + " -> " + text)}`);
            let aiText = await response.text();

            // Teknik hata kontrolü
            if (aiText.includes("{") || aiText.includes("error")) {
                aiText = "Buradayım Yıldıray! Seni dinliyorum. ✨";
            }

            typing.style.display = 'none';
            addMsg(aiText, 'ai');
            speak(aiText);
            updateImage(aiText);

            memory.push({ a: aiText });
            localStorage.setItem('ai_chan_v10_memory', JSON.stringify(memory));
        } catch (e) {
            typing.style.display = 'none';
            addMsg("Bağlantıda bir parazit var ama gitmiyorum! 🌸", 'ai');
        }
    }

    function updateImage(text) {
        const t = text.toLowerCase();
        const hr = new Date().getHours();
        let mood = "cute anime girl smiling";
        let label = "Nötr";

        // Duygu Mantığı
        if (hr >= 22 || hr < 5) { mood = "sleepy anime girl, pajamas"; label = "Uykulu"; }
        if(t.includes("?") || text.length > 55) { mood = "thinking anime girl, curious"; label = "Düşünceli"; }
        if(t.includes("!") || t.includes("😊") || t.includes("harika")) { mood = "very happy anime girl, laughing"; label = "Heyecanlı"; }
        if(t.includes("üzgün") || t.includes("malesef")) { mood = "sad anime girl, melancholic"; label = "Üzgün"; }
        if(t.includes("utandım") || t.includes("teşekkür")) { mood = "blushing shy anime girl"; label = "Utangaç"; }
        if(t.includes("kod") || t.includes("pc") || t.includes("mühendis")) { mood = "hacker anime girl neon lights"; label = "Teknik"; }

        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(mood)}?nologo=true&seed=${Math.random()}`;
        moodLabel.innerText = label;
        
        const tempImg = new Image();
        tempImg.src = imgUrl;
        tempImg.onload = () => { img.src = imgUrl; };
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>

</body>
</html>
