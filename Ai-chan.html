<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan v6.0 - Stable</title>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }
        
        #setup-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .setup-card { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; width: 340px; border: 1px solid #334155; }
        input[type="password"], input[type="text"] { width: 90%; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 12px; outline: none; margin-bottom: 10px; }
        
        .card { width: 420px; height: 90vh; background: var(--card); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); overflow: hidden; display: none; flex-direction: column; border: 1px solid #334155; }
        #visual { width: 100%; height: 350px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(transparent, var(--card)); }

        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .m { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 85%; word-wrap: break-word; line-height: 1.5; }
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }

        .input-area { padding: 15px; display: flex; gap: 10px; background: #1e293b; border-top: 1px solid #334155; }
        .loading { font-size: 11px; color: var(--p); padding: 5px 20px; display: none; font-weight: bold; }
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .btn-reset { font-size: 10px; background: none; border: none; color: #64748b; cursor: pointer; text-decoration: underline; margin: 10px 0; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="setup-card">
        <h2 style="color:var(--p)">Gemini AI Setup</h2>
        <p style="font-size: 13px; color: #94a3b8;">API Key'ini gir ve Ai-chan ile tanış!</p>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
        <button onclick="saveKey()" style="width: 100%; padding: 12px; margin-top: 10px;">Bağlan</button>
    </div>
</div>

<div class="card" id="mainCard">
    <div id="visual">
        <img id="charImg" src="https://image.pollinations.ai/prompt/cute%20anime%20girl%20smiling%20waifu?nologo=true" alt="AI">
        <div class="overlay"></div>
    </div>
    
    <div id="loading" class="loading">Ai-chan düşünüyor...</div>
    <div id="chat">
        <div class="m ai">Merhaba Yıldıray! ✨ Sonunda bağlanabildik. Bugün neler yapacağız?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şey yaz..." autocomplete="off">
        <button onclick="askGemini()">Gönder</button>
    </div>
    <center><button class="btn-reset" onclick="clearKey()">Anahtarı Sıfırla</button></center>
</div>

<script>
    let API_KEY = localStorage.getItem('gemini_key_v6');
    const overlay = document.getElementById('setup-overlay');
    const mainCard = document.getElementById('mainCard');

    if (API_KEY) {
        overlay.style.display = 'none';
        mainCard.style.display = 'flex';
    }

    function saveKey() {
        const val = document.getElementById('apiKeyInput').value.trim();
        if(val.startsWith("AIza")) {
            localStorage.setItem('gemini_key_v6', val);
            location.reload();
        } else {
            alert("Hatalı Key!");
        }
    }

    function clearKey() {
        localStorage.removeItem('gemini_key_v6');
        location.reload();
    }

    let history = [
        { role: "user", parts: [{ text: "Senin adın Ai-chan. Neşeli bir anime kızısın. Kullanıcı Yıldıray. Kısa ve tatlı cevaplar ver." }]},
        { role: "model", parts: [{ text: "Tamamdır! ✨" }]}
    ];

    async function askGemini() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'u');
        input.value = '';
        document.getElementById('loading').style.display = 'block';

        history.push({ role: "user", parts: [{ text: text }] });

        // DENENECEK MODELLER LİSTESİ
        const models = ['gemini-1.5-flash', 'gemini-pro'];
        let success = false;

        for (let model of models) {
            if (success) break;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: history })
                });

                const data = await response.json();
                
                if(!data.error) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    document.getElementById('loading').style.display = 'none';
                    addMsg(aiText, 'ai');
                    history.push({ role: "model", parts: [{ text: aiText }] });
                    updateImage(aiText);
                    success = true;
                }
            } catch (e) {
                console.log(model + " başarısız, diğeri deneniyor...");
            }
        }

        if (!success) {
            document.getElementById('loading').style.display = 'none';
            addMsg("Üzgünüm Yıldıray, Google modellerine şu an erişemiyorum. Key'ini kontrol eder misin?", 'ai');
        }
    }

    function updateImage(text) {
        let mood = "cute anime girl smiling";
        if(text.includes("?") || text.includes("ne")) mood = "thinking anime girl";
        if(text.includes("!") || text.includes("😊")) mood = "happy anime girl laughing";

        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(mood)}?nologo=true&seed=${Math.random()}`;
        document.getElementById('charImg').src = imgUrl;
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        const chat = document.getElementById('chat');
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') askGemini(); };
</script>

</body>
</html>
