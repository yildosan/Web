<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Anime AI v4.0</title>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        .card { width: 420px; background: var(--card); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #334155; }
        
        #visual { width: 100%; height: 350px; background: #000; position: relative; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(transparent, var(--card)); }

        #chat { height: 250px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .m { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 85%; line-height: 1.5; }
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }

        .input-area { padding: 20px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 12px; outline: none; }
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .loading { font-size: 12px; color: #94a3b8; padding: 0 20px 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <img id="charImg" src="https://image.pollinations.ai/prompt/cute%20anime%20girl%20waifu%20smiling?nologo=true" alt="AI">
        <div class="overlay"></div>
    </div>
    
    <div id="chat">
        <div class="m ai">Selam! Gemini motoruyla artık çok daha zekiyim. 🌸 Bugün ne yapıyoruz?</div>
    </div>
    <div id="loading" class="loading">Gemini yanıt yazıyor...</div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şey yaz..." autocomplete="off">
        <button onclick="askGemini()">Gönder</button>
    </div>
</div>

<script>
    // --- AYARLAR ---
    const API_KEY = 'BURAYA_API_KEY_GELECEK'; // Buraya kendi anahtarını yapıştır
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const loading = document.getElementById('loading');

    let history = [
        { role: "user", parts: [{ text: "Sen nazik, neşeli ve teknoloji meraklısı bir anime kızısın. Cevapların kısa ve samimi olsun. Türkçeyi mükemmel konuş." }]},
        { role: "model", parts: [{ text: "Anlaşıldı! Ben senin tatlı ve zeki AI partnerinim. Hadi konuşalım! ✨" }]}
    ];

    async function askGemini() {
        const text = input.value.trim();
        if (!text || API_KEY === 'AIzaSyDRE2_n-2pD4kPaAz7mLBUrsUh_c7Z9ATE ') {
            if (API_KEY.includes('BURAYA')) alert("Lütfen önce bir API KEY ekleyin!");
            return;
        }

        addMsg(text, 'u');
        input.value = '';
        loading.style.display = 'block';

        history.push({ role: "user", parts: [{ text: text }] });

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: history })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            loading.style.display = 'none';
            addMsg(aiText, 'ai');
            history.push({ role: "model", parts: [{ text: aiText }] });

            updateImage(aiText);

        } catch (e) {
            loading.style.display = 'none';
            addMsg("Hata oluştu. API anahtarını kontrol eder misin? 🌸", 'ai');
        }
    }

    function updateImage(text) {
        // Karakterin ruh haline göre basit görsel tetikleyici
        let prompt = "cute anime girl smiling";
        if(text.length > 50) prompt = "anime girl talking explain";
        if(text.includes("?") || text.includes("ne")) prompt = "thinking anime girl";
        if(text.includes("kod") || text.includes("pc")) prompt = "hacker anime girl with tech glow";

        const newSrc = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?nologo=true&seed=${Math.random()}`;
        
        const temp = new Image();
        temp.src = newSrc;
        temp.onload = () => img.src = newSrc;
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askGemini(); };
</script>

</body>
</html>
