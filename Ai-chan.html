<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan v8.0 - Emotion Engine</title>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --sub: #94a3b8; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; }
        
        .card { width: 420px; height: 90vh; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; }
        
        #visual { width: 100%; height: 380px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.6s ease, filter 0.3s ease; filter: brightness(1); }
        .overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(transparent, var(--card)); }
        #moodLabel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: var(--p); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        #chat { flex-grow: 1; overflow-y: auto; padding: 25px 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .m { padding: 14px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; word-wrap: break-word; line-height: 1.6; position: relative; animation: pop 0.4s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3); }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 4px; }

        .input-area { padding: 18px 20px; display: flex; gap: 12px; background: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 14px; border-radius: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.15); }
        button { background: var(--p); border: none; color: white; padding: 0 24px; border-radius: 14px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .typing { font-size: 11px; color: var(--p); padding: 0 20px 8px; text-align: center; display: none; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <span id="moodLabel">Nötr</span>
        <img id="charImg" src="https://image.pollinations.ai/prompt/cute%20anime%20girl%20smiling%20waifu,%20softly?nologo=true" alt="Ai-chan">
        <div class="overlay"></div>
    </div>
    
    <div id="chatbox">
        <div id="typing" class="typing">AI-CHAN DÜŞÜNÜYOR...</div>
        <div id="chat">
            <div class="m ai">Merhaba Yıldıray! ✨ Ben Ai-chan. Duygu motorum tamamen güncellendi, seninle konuşmak için sabırsızlanıyorum! Nelerden bahsedelim?</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir mesaj yaz..." autocomplete="off">
        <button onclick="askAI()">Gönder</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const typing = document.getElementById('typing');
    const moodLabel = document.getElementById('moodLabel');

    async function askAI() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'u');
        input.value = '';
        typing.style.display = 'block';
        img.style.filter = "brightness(0.7) blur(1px)";

        try {
            // Tamamen ücretsiz ve anahtarsız metin API'si (Hugging Face / Pollinations altyapısı)
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Sen Ai-chan adında neşeli, tatlı ve duygusal bir anime kızısın. Yıldıray ile konuşuyorsun. Kısa, doğal ve emojili cevaplar ver. " + text)}`);
            if (!response.ok) throw new Error("Ağ hatası");
            const aiText = await response.text();

            typing.style.display = 'none';
            img.style.filter = "brightness(1) blur(0)";
            addMsg(aiText, 'ai');
            updateImage(aiText);
        } catch (e) {
            console.error(e);
            typing.style.display = 'none';
            img.style.filter = "brightness(1) blur(0)";
            addMsg("Bir şeyler ters gitti Yıldıray... Tekrar dener misin?", 'ai');
        }
    }

    function updateImage(text) {
        const t = text.toLowerCase();
        
        // DUYGU HARİTASI (MOOD MAP)
        const moodMap = [
            { key: ["harika", "süper", "muhteşem", "yaşasın", "😊", "😁", "🎉"], mood: "very happy anime girl, laughing, sparkle", label: "Heyecanlı" },
            { key: ["?", "nasıl", "neden", "kim", "nerede"], mood: "thinking anime girl, looking up, curious", label: "Meraklı" },
            { key: ["utandım", "teşekkür", "sağ ol", "naziksin", "😳", "😊"], mood: "blushing shy anime girl, looking away, cute", label: "Utangaç" },
            { key: ["üzgün", "kötü", "maalesef", "malesef", "yalnız", "😔", "😢"], mood: "sad anime girl, looking down, melancholic", label: "Üzgün" },
            { key: ["kızdım", "sinir", "bıktım", "yeter", "😠", "😡"], mood: "angry anime girl, pouting, annoyed, sharp eyes", label: "Kızgın" },
            { key: ["uyku", "yorgun", "gece", "yatıyorum", "💤", "😴"], mood: "sleepy anime girl in pajamas, yawning, soft", label: "Uykulu" },
            { key: ["vaaov", "inanılmaz", "şok", "nasıl yani", "😮", "😱"], mood: "surprised anime girl, wide eyes, shocked", label: "Şaşkın" },
            { key: ["kod", "pc", "bilgisayar", "yazılım", "mühendis", "💻"], mood: "hacker anime girl with neon lights and code flow", label: "Hacker" },
            { key: ["korktum", "karanlık", "endişe", "eyvah", "😨", "😰"], mood: "scared anime girl, trembling, anxious, dark aura", label: "Korkmuş" },
            { key: ["başardım", "kolay", "hazırım", "tamam", "😎", "😏"], mood: "cool anime girl with sunglasses, confident smile", label: "Havalı" }
        ];

        // Varsayılan Nötr Duygu
        let selectedMood = { mood: "cute anime girl smiling, softly", label: "Nötr" };

        // Özel kontrol: Eğer cevap 60 karakterden uzunsa varsayılanı 'Meraklı' yap (Düşünceli mod)
        if(text.length > 60) {
            selectedMood = { mood: "thinking anime girl, looking up, curious", label: "Düşünceli" };
        }

        // Anahtar kelime kontrolü
        for (const item of moodMap) {
            if (item.key.some(k => t.includes(k))) {
                selectedMood = item;
                break; // İlk eşleşen duyguyu al
            }
        }

        // Görseli güncelle (Yumuşak geçiş için Image pre-load)
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(selectedMood.mood)}?nologo=true&seed=${Math.random()}`;
        moodLabel.innerText = selectedMood.label;
        
        const tempImg = new Image();
        tempImg.src = imgUrl;
        tempImg.onload = () => {
            img.style.opacity = 0.4; // Hafifçe karart
            setTimeout(() => {
                img.src = imgUrl;
                img.style.opacity = 1; // Geri aç
            }, 300);
        };
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>

</body>
</html>
