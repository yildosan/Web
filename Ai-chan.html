<script>
    // ... diğer kısımlar aynı ...

    async function askAI() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'u');
        input.value = '';
        typing.style.display = 'block';

        try {
            // "model=mistral" ekleyerek daha doğrudan ve temiz cevaplar almasını sağlıyoruz
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Kullanıcı adı: Yıldıray. Sen tatlı bir anime kızısın. Sadece kısa cevap ver, teknik detay yazma: " + text)}?model=mistral`);
            
            let aiText = await response.text();

            // Eğer gelen metin JSON formatındaysa (nadiren olur), sadece mesaj kısmını ayıkla
            if (aiText.includes('"role"')) {
                try {
                    const parsed = JSON.parse(aiText);
                    aiText = parsed.content || "Bir hata oluştu ama buradayım! ✨";
                } catch(e) {
                    // JSON değilse ama parça içeriyorsa temizle
                    aiText = aiText.split('"').pop().split('}')[0];
                }
            }

            typing.style.display = 'none';
            addMsg(aiText, 'ai');
            updateImage(aiText);
        } catch (e) {
            typing.style.display = 'none';
            addMsg("Sistemde küçük bir parazit oldu Yıldıray, tekrar yazar mısın? 🌸", 'ai');
        }
    }
    // ... geri kalan fonksiyonlar aynı ...
</script>
