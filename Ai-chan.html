<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        .cyber-mode { --bg: #050505; --card: #000000; --text: #00ffcc; --p: #ff00ff; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; transition: 0.5s; }
        .card { width: 420px; height: 95vh; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; transition: all 0.5s ease; }
        #visual { width: 100%; height: 380px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; }
        #moodLabel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: var(--p); padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; z-index: 5; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .m { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 80%; line-height: 1.5; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px 20px; display: flex; gap: 10px; background: var(--card); border-top: 1px solid #334155; }
        input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid #475569; color: white; padding: 12px; border-radius: 15px; outline: none; }
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
        :fullscreen .card { width: 100vw; height: 100vh; border-radius: 0; border: none; }
        .typing { font-size: 11px; color: var(--p); padding: 5px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="visual">
        <span id="moodLabel">Aktif</span>
        <img id="charImg" src="https://media.tenor.com/bubrSzgxcTMAAAAM/rias.gif" alt="Ai-chan">
    </div>
    <div id="chat"><div id="typing" class="typing">...</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesaj yaz..." autocomplete="off">
        <button onclick="askAI()">></button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const typing = document.getElementById('typing');
    const app = document.getElementById('app');

    const emotions = {
        angry: "https://media.tenor.com/d50EH_7IpgQAAAAM/rias-huh.gif",
        happy: "https://media.tenor.com/bubrSzgxcTMAAAAM/rias.gif",
        sad: "https://gifdb.com/images/high/red-hair-anime-rias-gremory-high-school-dxd-bzpd8p6e83okozcb.gif",
        knowledge: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrUm6Exy5JGlswSmUwFOsQXyHfF7LTdsQ_-s8DB6ylfA&s=10"
    };

    window.onload = () => addMsg("Selam Yıldıray! ✨ Tekrar buradayım.", 'ai');

    function toggleFS() { if (!document.fullscreenElement) app.requestFullscreen(); else document.exitFullscreen(); }
    document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f' && document.activeElement !== input) toggleFS(); });

    async function askAI() {
        const val = input.value.trim();
        if (!val) return;

        if (val === '/tam') { input.value = ''; toggleFS(); return; }
        if (val === '/gece') { input.value = ''; document.body.classList.toggle('cyber-mode'); return; }
        if (val === '/temizle') { input.value = ''; chatBox.innerHTML = '<div id="typing" class="typing">...</div>'; return; }

        addMsg(val, 'u');
        input.value = '';
        typing.style.display = 'block';

        try {
            // Ana Motor (Puter)
            const res = await puter.ai.chat(`Sen neşeli Ai-chan'sın. Kısa cevap ver: ${val}`, { model: 'gpt-4o' });
            processAIResponse(res.message.content);
        } catch (e) {
            // Yedek Motor (Pollinations - Puter bozulduğunda devreye girer)
            try {
                const backup = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Sen Ai-chan'sın, Yıldıray'a samimi cevap ver: " + val)}?model=openai`);
                const backupText = await backup.text();
                processAIResponse(backupText);
            } catch (err) {
                typing.style.display = 'none';
                addMsg("Bağlantı hatası Yıldıray, sayfayı yeniler misin? 🌸", 'ai');
            }
        }
    }

    function processAIResponse(aiText) {
        typing.style.display = 'none';
        addMsg(aiText, 'ai');
        
        let mood = "happy";
        const t = aiText.toLowerCase();
        if (t.includes("üzgün") || t.includes("kötü")) mood = "sad";
        else if (t.includes("kızgın") || t.includes("hayır")) mood = "angry";
        else if (t.includes("bilgi") || t.includes("kod") || aiText.length > 80) mood = "knowledge";

        img.src = emotions[mood];
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>
</body>
</html>
