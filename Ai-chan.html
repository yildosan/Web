<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan - GIF Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        .cyber-mode { --bg: #050505; --card: #000000; --text: #00ffcc; --p: #ff00ff; }
        
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; transition: 0.5s; }
        .card { width: 420px; height: 95vh; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; transition: all 0.5s ease; }
        
        #visual { width: 100%; height: 380px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; opacity: 1; }
        .img-loading { opacity: 0.3 !important; }

        #moodLabel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: var(--p); padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; z-index: 5; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        
        .m { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 80%; line-height: 1.5; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }

        .input-area { padding: 15px 20px; display: flex; gap: 10px; background: var(--card); border-top: 1px solid #334155; }
        input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid #475569; color: white; padding: 12px; border-radius: 15px; outline: none; }
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }

        :fullscreen .card { width: 100vw; height: 100vh; border-radius: 0; border: none; }
        .typing { font-size: 11px; color: var(--p); padding: 5px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="visual">
        <span id="moodLabel">Online</span>
        <img id="charImg" src="https://media.giphy.com/media/3o7TKubA2h3uP9ySJW/giphy.gif" alt="Ai-chan"> </div>
    <div id="chat">
        <div id="typing" class="typing">...</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesaj yaz..." autocomplete="off">
        <button onclick="askAI()">></button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const typing = document.getElementById('typing');
    const moodLabel = document.getElementById('moodLabel');
    const app = document.getElementById('app');

    // GIF URL'leri (Duyguya göre güncelle)
    const gifs = {
        happy: "https://media.giphy.com/media/3o7TKubA2h3uP9ySJW/giphy.gif",
        sad: "https://media.giphy.com/media/3o6gb59I5v7wYyO04E/giphy.gif",
        angry: "https://media.giphy.com/media/l41YmQj5A1S30048U/giphy.gif",
        blush: "https://media.giphy.com/media/3o7TKr6573O1yD0V9y/giphy.gif",
        excited: "https://media.giphy.com/media/3o7TKubA2h3uP9ySJW/giphy.gif"
    };

    let memory = JSON.parse(localStorage.getItem('ai_chan_v15_memory')) || [];

    window.onload = () => {
        addMsg("Selam Yıldıray. ✨ Neler yapıyoruz bugün?", 'ai');
    };

    // --- GIF ÖN YÜKLEME VE GEÇİŞ SİSTEMİ ---
    function updateCharGif(mood) {
        const newUrl = gifs[mood];
        
        img.classList.add('img-loading'); // Mevcut GIF'i hafif karart
        
        const tempImg = new Image();
        tempImg.src = newUrl;
        tempImg.onload = () => {
            img.src = newUrl;
            img.classList.remove('img-loading'); // Yeni GIF tam yüklendiğinde göster
        };
    }

    function toggleFS() {
        if (!document.fullscreenElement) app.requestFullscreen();
        else document.exitFullscreen();
    }

    // F tuşu tam ekran (Easter Egg)
    document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'f' && document.activeElement !== input) toggleFS();
    });

    async function askAI() {
        const val = input.value.trim();
        if (!val) return;

        // GİZLİ KODLAR (Görünmez Mantık)
        if (val === '/tam') { input.value = ''; toggleFS(); return; }
        if (val === '/gece') { input.value = ''; document.body.classList.toggle('cyber-mode'); return; }
        if (val === '/temizle') { 
            input.value = ''; chatBox.innerHTML = '<div id="typing" class="typing">...</div>';
            memory = []; localStorage.removeItem('ai_chan_v15_memory'); return; 
        }

        addMsg(val, 'u');
        input.value = '';
        typing.style.display = 'block';
        memory.push({ role: "user", content: val });

        try {
            const res = await puter.ai.chat(
                `Sen Ai-chan'sın, Yıldıray'ın samimi anime partnerisin. Kısa ve samimi cevap ver: ${val}`,
                { model: 'claude-3-5-sonnet' }
            );
            const aiText = res.message.content;
            
            typing.style.display = 'none';
            addMsg(aiText, 'ai');
            
            // Cevabın içeriğine göre duyguyu belirle ve GIF'i güncelle
            let mood = "happy";
            if (aiText.includes("üzgün") || aiText.includes("malesef")) { mood = "sad"; }
            if (aiText.includes("kızgın") || aiText.includes("sinirli")) { mood = "angry"; }
            if (aiText.includes("utandım") || aiText.includes("teşekkür")) { mood = "blush"; }
            if (aiText.includes("harika") || aiText.includes("muhteşem")) { mood = "excited"; }
            updateCharGif(mood);
            
            memory.push({ role: "assistant", content: aiText });
            localStorage.setItem('ai_chan_v15_memory', JSON.stringify(memory));
        } catch (e) {
            typing.style.display = 'none';
            addMsg("Bir saniye, hemen geliyorum... ✨", 'ai');
        }
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>
</body>
</html>
