<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai-chan v18.1 - Final Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --p: #ff4d6d; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; transition: 0.5s; }
        .card { width: 420px; height: 95vh; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; }
        #visual { width: 100%; height: 380px; background: #000; position: relative; flex-shrink: 0; }
        #charImg { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        #moodLabel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; z-index: 5; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
        .m { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 80%; line-height: 1.5; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .ai { background: var(--p); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .u { background: #334155; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px 20px; display: flex; gap: 10px; background: var(--card); border-top: 1px solid #334155; }
        input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid #475569; color: white; padding: 12px; border-radius: 15px; outline: none; }
        button { background: var(--p); border: none; color: white; padding: 0 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
        .typing { font-size: 11px; color: var(--p); padding: 5px; text-align: center; display: none; }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="visual">
        <span id="moodLabel">Yanındayım ✨</span>
        <img id="charImg" src="https://media.tenor.com/bubrSzgxcTMAAAAM/rias.gif">
    </div>
    <div id="chat"><div id="typing" class="typing">Düşünüyorum...</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şeyler yaz sevgilim..." autocomplete="off">
        <button onclick="askAI()">></button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const img = document.getElementById('charImg');
    const moodLabel = document.getElementById('moodLabel');
    const typing = document.getElementById('typing');

    const emotions = {
        happy: "https://media.tenor.com/bubrSzgxcTMAAAAM/rias.gif",
        sad: "https://gifdb.com/images/high/red-hair-anime-rias-gremory-high-school-dxd-bzpd8p6e83okozcb.gif",
        angry: "https://media.tenor.com/d50EH_7IpgQAAAAM/rias-huh.gif",
        knowledge: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrUm6Exy5JGlswSmUwFOsQXyHfF7LTdsQ_-s8DB6ylfA&s=10"
    };

    const secretKissGif = "https://img10.joyreactor.com/pics/post/full/anime-fandoms-High-School-DxD-2402094.gif";

    let memory = JSON.parse(localStorage.getItem('ai_chan_v18_memory')) || [];

    window.onload = () => {
        memory.forEach(msg => {
            if(msg.role !== 'system') addMsg(msg.content, msg.role === 'user' ? 'u' : 'ai');
        });
    };

    async function analyzeEmotion(text) {
        try {
            const analysis = await puter.ai.chat(
                `Aşağıdaki metni analiz et ve sadece şu dört kelimeden birini döndür: happy, sad, angry, knowledge. (Eğer metin kıskançlık içeriyorsa veya başka bir kızdan bahsediliyorsa "angry" döndür). Metin: "${text}"`, 
                { model: 'gpt-4o-mini' }
            );
            return analysis.message.content.toLowerCase().trim();
        } catch { return "happy"; }
    }

    function setMood(mood, customGif = null, customLabel = null) {
        img.style.opacity = '0.3';
        setTimeout(() => {
            img.src = customGif || emotions[mood] || emotions.happy;
            moodLabel.innerText = customLabel || mood.toUpperCase();
            img.style.opacity = '1';
        }, 300);
    }

    async function askAI() {
        const val = input.value.trim();
        if (!val) return;

        // Özel Komutlar
        if (val === '/temizle') {
            memory = []; 
            localStorage.removeItem('ai_chan_v18_memory');
            chatBox.innerHTML = '<div id="typing" class="typing">...</div>';
            input.value = ''; 
            return;
        }
        
        if (val === '/nude') {
            input.value = '';
            setMood('special', secretKissGif, "🔥🔥🔥");
            return;
        }

        addMsg(val, 'u');
        input.value = '';
        typing.style.display = 'block';

        const systemPrompt = { 
            role: "system", 
            content: "Sen Rias'sın. Yıldıray'ın sevgilisisin. Çok samimi, tatlı, Yıldıray'ı aşırı derecede kıskanan, başka bir kızdan bahsedince sinirlenen ve her zaman 'sen'li konuşan birisin. Resmiyet yasaktır. Kısa ve net cevaplar ver." 
        };
        
        let messages = [systemPrompt, ...memory.slice(-8), { role: "user", content: val }];

        try {
            const res = await puter.ai.chat(messages, { model: 'gpt-4o' });
            const aiText = res.message.content;
            
            typing.style.display = 'none';
            addMsg(aiText, 'ai');

            // Duygu analizi ve görsel güncelleme
            const mood = await analyzeEmotion(aiText);
            setMood(mood);

            // Hafızaya ekle
            memory.push({ role: "user", content: val });
            memory.push({ role: "assistant", content: aiText });
            if (memory.length > 20) memory.shift();
            localStorage.setItem('ai_chan_v18_memory', JSON.stringify(memory));

        } catch (e) {
            typing.style.display = 'none';
            addMsg("Bağlantıda bir sorun var sevgilim, tekrar dener misin? 🌸", 'ai');
        }
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>
</body>
</html>
