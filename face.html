<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sesli Alarm Terminali</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    #output_canvas { width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
    
    #hud-display {
      position: absolute; top: 30px; right: 30px; color: #00FF00;
      background: rgba(0, 30, 0, 0.7); padding: 20px; border-right: 4px solid #00FF00;
      font-size: 15px; z-index: 999; pointer-events: none;
    }

    /* Başlatma Butonu */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; justify-content: center;
      align-items: center; z-index: 1000; color: #00FF00; cursor: pointer;
      text-align: center; border: 2px solid #00FF00;
    }
    .alarm-red { color: #FF0000 !important; border-color: #FF0000 !important; }
  </style>
</head>
<body>

  <div id="overlay" onclick="startSystem()">
    <div>
      <h1>ANALİZ TERMİNALİ</h1>
      <p>[ SİSTEMİ VE SESİ AKTİF ETMEK İÇİN TIKLAYIN ]</p>
    </div>
  </div>

  <div id="hud-display">BEKLENİYOR...</div>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    let audioCtx = null;
    let isSystemActive = false;

    // Web Audio API ile saf tiz ses üretici
    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1000, audioCtx.currentTime); // 1000 Hz Tiz ses
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    window.startSystem = function() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      document.getElementById('overlay').style.display = 'none';
      isSystemActive = true;
    };

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const hud = document.getElementById('hud-display');

    function onResults(results) {
      if (!isSystemActive) return;

      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        const rightEyeDist = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
        const leftEyeDist = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
        
        const closed = rightEyeDist < 0.012 && leftEyeDist < 0.012;

        if (closed) {
          playBeep();
          hud.classList.add('alarm-red');
          hud.innerHTML = "!!! UYARI !!!<br>UYKU TESPİT EDİLDİ";
        } else {
          hud.classList.remove('alarm-red');
          hud.innerHTML = `SAĞ GÖZ: ${rightEyeDist < 0.012 ? "K
