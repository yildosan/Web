<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eye Traffic Racer</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <style>
    body { margin: 0; background: #111; overflow: hidden; font-family: 'Courier New', monospace; color: #00FF00; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #00FF00; }
    #input_video { display: none; }
    #msg { position: absolute; bottom: 20px; width: 100%; text-align: center; font-weight: bold; font-size: 20px; }
  </style>
</head>
<body onclick="resetGame()">

  <div id="ui">
    SKOR: <span id="score">0</span><br>
    HIZ : <span id="speed-ui">0</span> km/h
  </div>

  <div id="msg">SİSTEM HAZIRLANAMADI</div>
  <video id="input_video" playsinline></video>
  <canvas id="gameCanvas"></canvas>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msg = document.getElementById('msg');
    
    let score = 0;
    let gameSpeed = 8;
    let lane = 1; // 0: Sol, 1: Orta, 2: Sağ
    let cars = [];
    let gameActive = true;
    let roadOffset = 0;

    function resetGame() {
        score = 0; gameSpeed = 8; lane = 1; cars = []; gameActive = true;
        msg.innerText = "GÖZLERİNLE KONTROL ET";
        msg.style.color = "#00FF00";
    }

    function spawnCar() {
        if(!gameActive) return;
        cars.push({
            lane: Math.floor(Math.random() * 3),
            y: -100,
            color: '#FF0000'
        });
    }
    setInterval(spawnCar, 1500);

    function onResults(results) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const w = canvas.width;
      const h = canvas.height;
      const laneWidth = w / 3;

      // --- YOL ÇİZİMİ ---
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, w, h);
      
      // Şerit Çizgileri
      ctx.strokeStyle = '#555';
      ctx.setLineDash([40, 40]);
      ctx.lineDashOffset = -roadOffset;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(laneWidth, 0); ctx.lineTo(laneWidth, h);
      ctx.moveTo(laneWidth * 2, 0); ctx.lineTo(laneWidth * 2, h);
      ctx.stroke();
      ctx.setLineDash([]);
      if(gameActive) roadOffset = (roadOffset + gameSpeed) % 80;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
        const landmarks = results.multiFaceLandmarks[0];

        // --- GÖZ ANALİZİ (EAR) ---
        const rEye = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
        const lEye = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
        
        const rClosed = rEye < 0.012;
        const lClosed = lEye < 0.012;

        // Şerit Değiştirme Mantığı (Ayna görüntüsü terslendi)
        if (rClosed && lClosed) {
            gameSpeed = 3; // Fren
            msg.innerText = "FREN YAPILIYOR";
        } else if (lClosed) {
            lane = 0; // Sol (Kullanıcıya göre sol)
            msg.innerText = "<< SOL ŞERİT";
        } else if (rClosed) {
            lane = 2; // Sağ (Kullanıcıya göre sağ)
            msg.innerText = "SAĞ ŞERİT >>";
        } else {
            lane = 1; // Orta
            gameSpeed = Math.min(gameSpeed + 0.01, 20);
            msg.innerText = "GAZ KESME!";
        }

        // --- OYUNCU ARABASI ---
        const playerX = lane * laneWidth + laneWidth / 2;
        const playerY = h - 150;
        
        ctx.fillStyle = '#00FF00';
        ctx.shadowBlur = 15; ctx.shadowColor = '#00FF00';
        ctx.fillRect(playerX - 30, playerY, 60, 100); // Gövde
        ctx.fillStyle = '#000';
        ctx.fillRect(playerX - 25, playerY + 10, 50, 20); // Cam
        ctx.shadowBlur = 0;

        // --- TRAFİKTEKİ DİĞER ARAÇLAR ---
        cars.forEach((car, index) => {
            car.y += gameSpeed * 0.7;
            const carX = car.lane * laneWidth + laneWidth / 2;
            
            ctx.fillStyle = '#FF4400';
            ctx.fillRect(carX - 30, car.y, 60, 100);

            // Çarpışma
            if (car.lane === lane && car.y > playerY - 80 && car.y < playerY + 80) {
                gameActive = false;
                msg.innerText = "KAZA YAPILDI! TIKLA";
                msg.style.color = "red";
            }

            if (car.y > h) {
                cars.splice(index, 1);
                score += 10;
                document.getElementById('score').innerText = score;
                document.getElementById('speed-ui').innerText = Math.round(gameSpeed * 10);
            }
        });
      }
    }

    const faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => await faceMesh.send({image: videoElement}),
      width: 640, height: 480
    });
    camera.start();
    resetGame();
  </script>
</body>
</html>
