<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akıcı Nokta Takibi</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); } /* Ayna görüntüsü */
    #input_video { display: none; }
  </style>
</head>
<body>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Videoyu çiz
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks) {
        canvasCtx.fillStyle = "#00FF00"; // Nokta rengi yeşil
        for (const landmarks of results.multiFaceLandmarks) {
          for (const point of landmarks) {
            // Her bir noktayı minik kareler/noktalar olarak çiz (Çizgi birleştirmekten çok daha hafiftir)
            const x = point.x * canvasElement.width;
            const y = point.y * canvasElement.height;
            canvasCtx.fillRect(x, y, 1.5, 1.5); 
          }
        }
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false, // Performans için kapalı
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 480, // Orta şeker çözünürlük
      height: 360
    });
    camera.start();
  </script>
</body>
</html>
