<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hassas Dil ve Yüz Takibi</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
  </style>
</head>
<body>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.fillStyle = '#000000';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          
          // 1. ANA HATLAR (Kalın Çizgiler)
          // Dudak dış çerçevesi
          drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 3});
          
          // 2. DİL VE İÇ DUDAK TAKİBİ (Dil hareketlerini bu noktalar yakalar)
          // MediaPipe'da özel bir "dil" bağlantısı yoktur, bu yüzden iç dudak (inner lips) 
          // noktalarını kullanarak ağız boşluğunu belirginleştiriyoruz.
          const innerLips = [
            [78, 191], [191, 80], [80, 81], [81, 82], [82, 13], [13, 312], [312, 311], [311, 310], [310, 415], [415, 308],
            [308, 324], [324, 318], [318, 402], [402, 317], [317, 14], [14, 87], [87, 178], [178, 95], [95, 88], [88, 78]
          ];
          
          canvasCtx.beginPath();
          canvasCtx.strokeStyle = '#00FF00';
          canvasCtx.lineWidth = 2;
          for (const [startIdx, endIdx] of innerLips) {
            const start = landmarks[startIdx];
            const end = landmarks[endIdx];
            canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
            canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
          }
          canvasCtx.stroke();

          // 3. GÖZLER VE KAŞLAR
          drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00FF00', lineWidth: 2});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00FF00', lineWidth: 2});
          drawConnectors(canvasCtx, landmarks, FACEMESH_IRISES, {color: '#00FF00', lineWidth: 1});
          drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#00FF00', lineWidth: 2});

          // 4. SEYREK YÜZ AĞI (%50 yoğunluk, kalın çizgiler)
          canvasCtx.beginPath();
          canvasCtx.strokeStyle = '#00FF0040';
          canvasCtx.lineWidth = 1.2;
          const tesselation = FACEMESH_TESSELATION;
          for (let i = 0; i < tesselation.length; i += 2) { 
            const start = landmarks[tesselation[i][0]];
            const end = landmarks[tesselation[i][1]];
            canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
            canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
          }
          canvasCtx.stroke();

          // 5. NOKTALAR (Boyut artırılmış)
          canvasCtx.fillStyle = "#00FF00";
          for (let i = 0; i < landmarks.length; i += 2) {
            const x = landmarks[i].x * canvasElement.width;
            const y = landmarks[i].y * canvasElement.height;
            canvasCtx.fillRect(x - 1, y - 1, 2, 2);
          }
        }
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true, // Dil ve iç dudak hassasiyeti için zorunlu
      minDetectionConfidence: 0.7, // Daha kararlı takip için artırıldı
      minTrackingConfidence: 0.7
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
