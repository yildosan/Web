<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Otomatik Analiz Terminali</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; cursor: crosshair; }
    #output_canvas { width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
    
    #hud-display {
      position: absolute; top: 30px; right: 30px; color: #00FF00;
      background: rgba(0, 30, 0, 0.7); padding: 15px; border-right: 4px solid #00FF00;
      font-size: 14px; z-index: 999; pointer-events: none; min-width: 200px;
    }
    .alarm-mode { color: #FF0000 !important; border-color: #FF0000 !important; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  </style>
</head>
<body onclick="initAudio()"> <div id="hud-display">SİSTEM AKTİF Ediliyor...</div>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    let audioCtx = null;

    // Ses motorunu aktifleştirme (Kullanıcı ekrana ilk dokunduğunda çalışır)
    window.initAudio = function() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log("Ses motoru hazır.");
      }
    };

    function playBeep() {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime); // Tiz sinyal
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const hud = document.getElementById('hud-display');

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      
      canvasCtx.save();
      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Göz Analizi (EAR)
        const rEye = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
        const lEye = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
        const isClosed = (rEye < 0.012 && lEye < 0.012);

        if (isClosed) {
          playBeep();
          hud.classList.add('alarm-mode');
          hud.innerHTML = "[!!! UYARI !!!]<br>GÖZLER KAPALI<br>ALARM ÇALIYOR";
        } else {
          hud.classList.remove('alarm-mode');
          hud.innerHTML = `SAĞ GÖZ: ${rEye < 0.012 ? "KAPALI" : "AÇIK"}<br>SOL GÖZ: ${lEye < 0.012 ? "KAPALI" : "AÇIK"}<br>SİSTEM : TAKİPTE`;
        }

        const color = isClosed ? "#FF0000" : "#00FF00";
        
        // Çizimler
        drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: color, lineWidth: 3});
        drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: color, lineWidth: 2});
        drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: color, lineWidth: 2});
        
        // Mesh (Yarı Yoğunluk)
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = color + "40";
        const tess = FACEMESH_TESSELATION;
        for (let i = 0; i < tess.length; i += 2) { 
          const s = landmarks[tess[i][0]];
          const e = landmarks[tess[i][1]];
          canvasCtx.moveTo(s.x * canvasElement.width, s.y * canvasElement.height);
          canvasCtx.lineTo(e.x * canvasElement.width, e.y * canvasElement.height);
        }
        canvasCtx.stroke();
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => await faceMesh.send({image: videoElement}),
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
