<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siyah Arka Planlı Yüz Ağı</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>

  <style>
    body { 
      margin: 0; 
      background: #000; /* Simsiyah arka plan */
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      width: 100vw;
    }
    #output_canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transform: scaleX(-1); /* Ayna görüntüsü */
    }
    #input_video { 
      display: none; /* Kamera görüntüsü gizli */
    }
  </style>
</head>

<body>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // MediaPipe Çizim Yardımcıları (Kısaltmalar)
    const drawingUtils = window;

    function onResults(results) {
      // Canvas boyutlarını video boyutlarına eşitle
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      
      // --- KRİTİK DEĞİŞİKLİK: ARKA PLANI SİYAH YAP ---
      canvasCtx.fillStyle = '#000000'; // Siyah renk
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height); // Tüm ekranı boya
      // canvasCtx.drawImage(results.image, 0, 0, ...); -> BU SATIR KALDIRILDI
      // --------------------------------------------------

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          // 1. Tüm Yüz Ağı (Tesselation) - Hafif Yeşil
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, 
            {color: '#00FF0030', lineWidth: 0.5});
          
          // 2. Ana Hatlar (Göz, Dudak, Yüz Ovali) - Parlak Yeşil
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#00FF00', lineWidth: 1});
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 1});
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00FF00', lineWidth: 1});
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00FF00', lineWidth: 1});
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYEBROW, {color: '#00FF00', lineWidth: 1});
          drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYEBROW, {color: '#00FF00', lineWidth: 1});

          // 3. Noktalar (Her 5 noktada bir minik kare)
          canvasCtx.fillStyle = "#00FF00";
          for (let i = 0; i < landmarks.length; i += 5) {
            const x = landmarks[i].x * canvasElement.width;
            const y = landmarks[i].y * canvasElement.height;
            canvasCtx.fillRect(x, y, 1, 1);
          }
        }
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false, // Maksimum performans için kapalı
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 480, // Mobil ve masaüstü için ideal dengeli çözünürlük
      height: 360
    });
    camera.start();
  </script>
</body>
</html>
