<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kalın Çizgili Hassas Mesh</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
  </style>
</head>
<body>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.fillStyle = '#000000';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          
          // 1. ANA HATLAR (Dudak, Göz, Kaş, Oval - Kalınlık 2 Katına Çıkarıldı)
          // lineWidth değerleri 1'den 2'ye, 1.5'ten 3'e yükseltildi.
          drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 3});
          drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#00FF00', lineWidth: 2});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#00FF00', lineWidth: 2});
          drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYEBROW, {color: '#00FF00', lineWidth: 2});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYEBROW, {color: '#00FF00', lineWidth: 2});
          drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#00FF00', lineWidth: 2.5});

          // 2. YÜZ AĞI (Yarı Yoğunluk - Kalınlık 2 Katına Çıkarıldı)
          canvasCtx.beginPath();
          canvasCtx.strokeStyle = '#00FF0040'; // Şeffaflık biraz artırıldı (parlama etkisi için)
          canvasCtx.lineWidth = 1.0; // 0.5'ten 1.0'a çıkarıldı

          const tesselation = FACEMESH_TESSELATION;
          for (let i = 0; i < tesselation.length; i += 2) { 
            const start = landmarks[tesselation[i][0]];
            const end = landmarks[tesselation[i][1]];
            
            canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
            canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
          }
          canvasCtx.stroke();

          // 3. NOKTALAR (Her 2 noktadan biri - Boyut Artırıldı)
          canvasCtx.fillStyle = "#00FF00";
          for (let i = 0; i < landmarks.length; i += 2) {
            const x = landmarks[i].x * canvasElement.width;
            const y = landmarks[i].y * canvasElement.height;
            // Nokta boyutu 1x1'den 2x2'ye çıkarıldı
            canvasCtx.fillRect(x - 1, y - 1, 2, 2);
          }
        }
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true, // Göz ve dudak mimikleri için kritik
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
