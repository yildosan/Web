<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akıcı Mesh Takibi</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #output_canvas { width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
  </style>
</head>
<body>
  <video id="input_video" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d', { alpha: false }); // Performans için alpha kapalı

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks) {
        for (const landmarks of results.multiFaceLandmarks) {
          // 1. İnce Ağ Çizgileri (Hafif Şeffaf Yeşil)
          drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, 
            {color: '#00FF0030', lineWidth: 0.5});
          
          // 2. Ana Hatlar (Belirgin Beyaz/Yeşil)
          drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, 
            {color: '#00FF00', lineWidth: 1});
          
          // 3. Noktalar (Minik noktalar)
          for (let i = 0; i < landmarks.length; i += 5) { // Her 5 noktada bir çizerek CPU'yu rahatlatıyoruz
            const x = landmarks[i].x * canvasElement.width;
            const y = landmarks[i].y * canvasElement.height;
            canvasCtx.fillStyle = "#00FF00";
            canvasCtx.fillRect(x, y, 1, 1);
          }
        }
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false, // Kasmayı önleyen en kritik ayar
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 480,
      height: 360 // Mobil için optimize edilmiş çözünürlük
    });
    camera.start();
  </script>
</body>
</html>
