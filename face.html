<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Göz Analizi ve Sesli Alarm</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    .container { position: relative; width: 100vw; height: 100vh; }
    #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
    #hud-display {
      position: absolute; top: 30px; right: 30px; color: #00FF00;
      background: rgba(0, 30, 0, 0.7); padding: 20px; border-right: 4px solid #00FF00;
      font-size: 15px; z-index: 999; pointer-events: none; min-width: 220px;
    }
    .alarm-active { color: #FF0000 !important; border-color: #FF0000 !important; background: rgba(30, 0, 0, 0.8) !important; }
  </style>
</head>
<body>
  <div class="container">
    <div id="hud-display">SİSTEM YÜKLENİYOR...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script type="module">
    // --- BASE64 TİZ SİNYAL SESİ (0.5 sn, 1000Hz Bip) ---
    const beepSound = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFRm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YV9vT197fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8=");

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const hud = document.getElementById('hud-display');

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Göz Analizi (EAR)
        const rightEyeDist = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
        const leftEyeDist = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
        
        const isRightClosed = rightEyeDist < 0.012;
        const isLeftClosed = leftEyeDist < 0.012;

        // ALARM MANTIĞI: İki göz de kapalıysa
        if (isRightClosed && isLeftClosed) {
          hud.classList.add('alarm-active');
          beepSound.play().catch(() => {}); // Kullanıcı etkileşimi yoksa tarayıcı engelleyebilir
          hud.innerHTML = "[!!! UYARI !!!]<br>-----------------<br>DURUM: UYKU TESPİTİ<br>ALARM: AKTİF";
        } else {
          hud.classList.remove('alarm-active');
          hud.innerHTML = `
            [ANALİZ AKTİF]<br>
            -----------------<br>
            SAĞ GÖZ  : ${isRightClosed ? "KAPALI" : "AÇIK  "}<br>
            SOL GÖZ  : ${isLeftClosed ? "KAPALI" : "AÇIK  "}<br>
            VERİ     : ANALİZ EDİLİYOR
          `;
        }

        // Çizimler
        const themeColor = (isRightClosed && isLeftClosed) ? "#FF0000" : "#00FF00";
        drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: themeColor, lineWidth: 3});
        drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: themeColor, lineWidth: 2});
        drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: themeColor, lineWidth: 2});
        drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: themeColor, lineWidth: 2});

        // Seyrek Mesh
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = themeColor + "30";
        const tesselation = FACEMESH_TESSELATION;
        for (let i = 0; i < tesselation.length; i += 2) { 
          const start = landmarks[tesselation[i][0]];
          const end = landmarks[tesselation[i][1]];
          canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
          canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
        }
        canvasCtx.stroke();
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => await faceMesh.send({image: videoElement}),
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
