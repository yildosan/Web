<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Göz Analizli Teknik Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    .container { position: relative; width: 100vw; height: 100vh; }
    #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #input_video { display: none; }
    
    #hud-display {
      position: absolute;
      top: 30px;
      right: 30px;
      color: #00FF00;
      background: rgba(0, 30, 0, 0.7);
      padding: 20px;
      border-right: 4px solid #00FF00;
      font-size: 15px;
      z-index: 999;
      pointer-events: none;
      min-width: 220px;
      line-height: 1.4;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="hud-display">BAĞLANTI KURULUYOR...</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const hud = document.getElementById('hud-display');

    let lastFrameTime = performance.now();
    
    function onResults(results) {
      const now = performance.now();
      const fps = Math.round(1000 / (now - lastFrameTime));
      lastFrameTime = now;

      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      
      canvasCtx.save();
      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // --- GÖZ ANALİZİ (EAR - Eye Aspect Ratio Mantığı) ---
        // Sağ Göz noktaları (Üst: 159, Alt: 145)
        const rightEyeDist = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
        const rightStatus = rightEyeDist > 0.012 ? "AÇIK " : "KAPALI";

        // Sol Göz noktaları (Üst: 386, Alt: 374)
        const leftEyeDist = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
        const leftStatus = leftEyeDist > 0.012 ? "AÇIK " : "KAPALI";

        // Genel Analiz
        const mouthOpen = Math.hypot(landmarks[13].x - landmarks[14].x, landmarks[13].y - landmarks[14].y);
        const roll = Math.atan2(landmarks[263].y - landmarks[33].y, landmarks[263].x - landmarks[33].x) * (180 / Math.PI);

        hud.innerHTML = `
          [BİYOMETRİK VERİ]<br>
          -----------------<br>
          FPS      : ${fps}<br>
          SAĞ GÖZ  : ${rightStatus}<br>
          SOL GÖZ  : ${leftStatus}<br>
          AĞIZ     : ${mouthOpen > 0.04 ? "AÇIK " : "KAPALI"}<br>
          EĞİM     : ${Math.round(roll)}°<br>
          DURUM    : TARAMA AKTİF
        `;

        // --- ÇİZİMLER ---
        // Göz Kırpma Belirteci (Göz kapalıysa çizgiyi kalınlaştır/renk değiştir)
        const eyeColor = "#00FF00";
        drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: eyeColor, lineWidth: 2});
        drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: eyeColor, lineWidth: 2});
        drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#00FF00', lineWidth: 3});
        drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#00FF00', lineWidth: 2});
        
        // Mesh Yapısı
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = '#00FF0030';
        canvasCtx.lineWidth = 1;
        const tesselation = FACEMESH_TESSELATION;
        for (let i = 0; i < tesselation.length; i += 2) { 
          const start = landmarks[tesselation[i][0]];
          const end = landmarks[tesselation[i][1]];
          canvasCtx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
          canvasCtx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
        }
        canvasCtx.stroke();

        // Noktalar
        canvasCtx.fillStyle = "#00FF00";
        for (let i = 0; i < landmarks.length; i += 2) {
          canvasCtx.fillRect(landmarks[i].x * canvasElement.width - 1, landmarks[i].y * canvasElement.height - 1, 2, 2);
        }
      } else {
        hud.innerHTML = "[SİSTEM TARANIYOR...]<br>HEDEF BEKLENİYOR";
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => await faceMesh.send({image: videoElement}),
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
