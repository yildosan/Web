<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok - Spesifik Porno Video Bulucu</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f0f0f, #1a1a2e); }
        .video-card {
            transition: all 0.3s;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(236 72 153 / 0.3);
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="max-w-4xl mx-auto p-4 py-8">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2">🎥 Grok Spesifik Video</h1>
            <p class="text-pink-400">Ne istiyorsun detaylı anlat, Grok sana direkt video linkleri bulsun</p>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-8">
            <textarea 
                id="queryInput"
                rows="6"
                class="w-full bg-zinc-800 border border-zinc-700 focus:border-pink-500 rounded-2xl p-6 text-lg outline-none"
                placeholder="Örnek: 20 yaşında ince yapılı sarışın kız, büyük doğal memeler, dışarıda arabada sert seks yapıyor, creampie bitişli..."></textarea>

            <button onclick="findSpecificVideos()" 
                    class="mt-6 w-full bg-gradient-to-r from-pink-600 to-rose-600 py-6 rounded-2xl font-bold text-xl flex items-center justify-center gap-3">
                <i class="fas fa-video"></i>
                SPESİFİK VİDEOLAR BUL
            </button>
        </div>

        <div id="loading" class="hidden text-center py-16">
            <i class="fas fa-spinner fa-spin text-5xl text-pink-500 mb-6"></i>
            <p class="text-xl">Grok senin tarifine göre en uygun videoları arıyor...</p>
        </div>

        <div id="results" class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <script>
        async function findSpecificVideos() {
            const input = document.getElementById('queryInput').value.trim();
            if (!input) return alert("Lütfen aradığın şeyi detaylı yaz!");

            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            
            loading.classList.remove('hidden');
            resultsDiv.innerHTML = '';

            try {
                const aiResponse = await puter.ai.chat(
                    `Kullanıcı şu çok detaylı porno tarifini yaptı: "${input}"

                    Buna en uygun **gerçek video linkleri** bul. 
                    Mümkün olduğunca spesifik ve kaliteli videolar öner.
                    En az 6, en fazla 10 video öner.
                    
                    Her video için şu formatta JSON dön:
                    [
                        {
                            "title": "Video başlığı",
                            "url": "tam video linki (pornhub, xvideos, xhamster, spankbang vb.)",
                            "site": "Pornhub",
                            "desc": "Kısa açıklama neden uyuyor"
                        }
                    ]
                    
                    Gerçekçi ve çalışır linkler ver.`, 
                    { 
                        model: "x-ai/grok-4.3",
                        temperature: 0.65 
                    }
                );

                let videos = [];
                try {
                    videos = JSON.parse(aiResponse.message.content);
                } catch (e) {
                    // JSON temizleme denemesi
                    const match = aiResponse.message.content.match(/\[[\s\S]*\]/);
                    if (match) videos = JSON.parse(match[0]);
                }

                displayVideos(videos);
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `
                    <div class="col-span-full bg-red-900/30 border border-red-500 rounded-3xl p-8 text-center">
                        <p class="text-xl">Üzgünüm, şu anda video bulamadım.</p>
                        <p class="text-sm mt-3">Daha net veya farklı bir tarif dene.</p>
                    </div>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function displayVideos(videos) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (!videos || videos.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-10">Bu tarif için uygun video bulunamadı.</p>`;
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = "video-card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden";
                card.innerHTML = `
                    <div class="p-6">
                        <div class="flex items-start gap-4">
                            <div class="text-4xl flex-shrink-0 mt-1">
                                ${getSiteEmoji(video.site)}
                            </div>
                            <div class="flex-1">
                                <h3 class="font-semibold text-lg leading-tight mb-2 line-clamp-2">${video.title}</h3>
                                <p class="text-gray-400 text-sm mb-4 line-clamp-3">${video.desc}</p>
                                <a href="${video.url}" target="_blank"
                                   class="inline-flex items-center gap-2 bg-pink-600 hover:bg-pink-700 px-6 py-3 rounded-2xl font-medium text-sm transition-colors">
                                    <i class="fas fa-play"></i>
                                    Videoyu İzle
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getSiteEmoji(site) {
            const s = (site || '').toLowerCase();
            if (s.includes('pornhub')) return '🔴';
            if (s.includes('xvideos')) return '🟠';
            if (s.includes('xhamster')) return '💜';
            if (s.includes('spankbang')) return '🔵';
            return '📹';
        }
    </script>
</body>
</html>
