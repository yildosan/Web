<!DOCTYPE html>

    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
        }
        .video-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .thumbnail-container {
            position: relative;
        }
        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <div class="max-w-6xl mx-auto p-4">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 mt-6">
            <div class="flex items-center gap-3">
                <i class="fas fa-search text-4xl text-pink-500"></i>
                <div>
                    <h1 class="text-4xl font-bold">PornFinder</h1>
                    <p class="text-gray-400 text-sm">Grok AI + Eporner ile akıllı arama</p>
                </div>
            </div>
            <div class="text-sm text-gray-500 mt-4 md:mt-0">
                Puter.js + Grok AI
            </div>
        </div>

        <!-- Arama Alanı -->
        <div class="bg-zinc-900 rounded-3xl p-8 shadow-2xl mb-10">
            <div class="max-w-2xl mx-auto">
                <label class="block text-lg font-medium mb-3 text-pink-400">
                    <i class="fas fa-comment-dots mr-2"></i>
                    Porno'da ne arıyorsun? Detaylı anlat
                </label>
                <textarea 
                    id="queryInput"
                    rows="4"
                    class="w-full bg-zinc-800 border border-zinc-700 focus:border-pink-500 rounded-2xl p-6 text-lg resize-y min-h-[120px] outline-none"
                    placeholder="Örnek: 18-22 yaş arası sarışın kızlar, büyük memeli, doggystyle pozisyonunda hardcore seks..."></textarea>
                
                <div class="flex flex-wrap gap-3 mt-6">
                    <button onclick="quickSearch('teen blonde big tits doggystyle')" 
                            class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm transition-colors">
                        Genç Sarışın
                    </button>
                    <button onclick="quickSearch('milf mature anal creampie')" 
                            class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm transition-colors">
                        MILF Anal
                    </button>
                    <button onclick="quickSearch('asian japanese blowjob')" 
                            class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm transition-colors">
                        Asyalı
                    </button>
                </div>

                <button onclick="performSearch()" 
                        class="mt-8 w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-700 hover:to-purple-700 py-5 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 transition-all active:scale-95">
                    <i class="fas fa-search"></i>
                    GROK İLE ARA
                </button>
            </div>
        </div>

        <!-- Sonuçlar -->
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-20">
            <div class="inline-flex items-center gap-3 text-pink-400">
                <i class="fas fa-spinner fa-spin text-3xl"></i>
                <span class="text-xl">Grok düşünüyor ve videoları buluyor...</span>
            </div>
        </div>

        <div class="text-center text-xs text-gray-600 mt-12">
            Bu uygulama Puter.js ile geliştirildi. Grok AI anahtar kelimeleri optimize eder.<br>
            Sonuçlar Eporner API üzerinden çekilir. 18+ içerik içerir.
        </div>
    </div>

    <script>
        // Tailwind script
        tailwind.config = {
            content: [],
            theme: {
                extend: {}
            }
        }

        async function performSearch() {
            const input = document.getElementById('queryInput').value.trim();
            if (!input) {
                alert("Lütfen arama terimi girin!");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').innerHTML = '';

            try {
                // Grok AI ile sorguyu optimize et (daha iyi arama kelimeleri üret)
                let optimizedQuery = input;
                
                try {
                    const aiResponse = await puter.ai.chat(
                        `Kullanıcı şu porno aramasını yaptı: "${input}". 
                        Bunu Eporner gibi bir porno sitesinde en iyi sonuç verecek kısa, etkili İngilizce anahtar kelimelere dönüştür. 
                        Sadece 5-8 kelimelik arama stringi dön, açıklama ekleme.`, 
                        { model: "x-ai/grok-4.3" }  // veya mevcut Grok modellerinden biri
                    );
                    optimizedQuery = aiResponse.message.content.trim();
                    console.log("Grok optimized:", optimizedQuery);
                } catch (aiErr) {
                    console.log("AI optimizasyonu başarısız, direkt kullanıyoruz:", aiErr);
                }

                // Eporner API çağrısı (public API)
                const apiUrl = `https://www.eporner.com/api/v2/video/search/?query=${encodeURIComponent(optimizedQuery)}&per_page=18&order=latest&thumbsize=big&format=json`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                displayResults(data.videos || [], optimizedQuery);
            } catch (error) {
                console.error(error);
                document.getElementById('results').innerHTML = `
                    <div class="col-span-full text-center py-20 text-red-400">
                        <i class="fas fa-exclamation-triangle text-5xl mb-4"></i>
                        <p>Bir hata oluştu. Lütfen tekrar deneyin.</p>
                        <p class="text-sm mt-2">${error.message}</p>
                    </div>`;
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function displayResults(videos, query) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (!videos || videos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <p class="text-xl">Bu arama için sonuç bulunamadı.</p>
                        <p class="text-sm text-gray-500 mt-2">Farklı kelimeler deneyin.</p>
                    </div>`;
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${video.default_thumb.src}" 
                             class="w-full aspect-video object-cover"
                             alt="${video.title}">
                        <div class="duration text-xs font-mono">${video.length_min}</div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold line-clamp-2 leading-tight mb-3 h-12">${video.title}</h3>
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <div class="flex items-center gap-1">
                                <i class="fas fa-eye"></i> 
                                ${Math.floor(video.views / 1000)}K
                            </div>
                            <div class="flex items-center gap-1">
                                <i class="fas fa-star text-yellow-400"></i> 
                                ${video.rate}
                            </div>
                        </div>
                        <a href="${video.url}" target="_blank" 
                           class="mt-5 block w-full text-center bg-pink-600 hover:bg-pink-700 py-3 rounded-2xl font-medium text-sm transition-colors">
                            Videoyu İzle →
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function quickSearch(term) {
            document.getElementById('queryInput').value = term;
            performSearch();
        }

        // Enter tuşu ile arama
        document.getElementById('queryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                performSearch();
            }
        });

        // Demo için başlangıç mesajı
        window.onload = () => {
            console.log("%cPornFinder + Grok AI başlatıldı. Keyifli aramalar!", "color: #ec4899; font-size: 14px");
        }
    </script>
</body>
</html>
