<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VISOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;width:100vw;height:100dvh;font-family:'Orbitron',monospace}
  #app{position:relative;width:100vw;height:100dvh}
  #video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:1}
  #c{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
  .ui{position:absolute;z-index:3;pointer-events:none}
  #title{top:18px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:8px;color:#aaff44;text-shadow:0 0 14px #aaff44,0 0 30px #aaff44;font-weight:700;white-space:nowrap}
  #status{bottom:28px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:#aaff44;opacity:.7;white-space:nowrap}
  #startWrap{position:absolute;z-index:10;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
  #startBtn{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:4px;color:#000;background:#aaff44;border:none;padding:16px 44px;cursor:pointer;font-weight:700;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);box-shadow:0 0 30px #aaff44,0 0 60px rgba(170,255,68,.3)}
  #startBtn:active{transform:scale(.97)}
  #startMsg{margin-top:18px;font-size:10px;color:#aaff44;letter-spacing:2px;opacity:.7}
  /* scanlines */
  .scan{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px)}
  /* vignette */
  .vig{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="c"></canvas>
  <div class="vig"></div>
  <div class="scan"></div>
  <div class="ui" id="title">V I S O R</div>
  <div class="ui" id="status" id="statusTxt">INITIALIZING...</div>
  <div id="startWrap">
    <button id="startBtn">⬡ ACTIVATE</button>
    <div id="startMsg">TAP TO ENABLE CAMERA</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const startWrap = document.getElementById('startWrap');
const startBtn = document.getElementById('startBtn');
const startMsg = document.getElementById('startMsg');

let W, H, running = false;
let faces = [];
let helmets = {}; // per face helmet state

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── HELMET GEOMETRY ─────────────────────────────────────────────
// Returns a list of 3D vertices and edges for a stylized helmet
// in normalized coords (head center = 0,0,0; head radius ≈ 1)
function buildHelmetGeometry(){
  const verts = [];
  const edges = [];

  // Dome (upper sphere, latitude/longitude)
  const domeRows = 8, domeCols = 16;
  const domeStart = verts.length;
  for(let r=0; r<=domeRows; r++){
    const phi = (r/domeRows) * Math.PI * 0.85; // 0..153°
    for(let c=0; c<=domeCols; c++){
      const theta = (c/domeCols) * Math.PI * 2;
      const x = Math.sin(phi)*Math.cos(theta) * 1.18;
      const y = -Math.cos(phi) * 1.22 - 0.05;
      const z = Math.sin(phi)*Math.sin(theta) * 1.05;
      verts.push([x, y, z]);
    }
  }
  // dome edges
  for(let r=0; r<domeRows; r++){
    for(let c=0; c<domeCols; c++){
      const i = domeStart + r*(domeCols+1)+c;
      edges.push([i, i+1]);
      edges.push([i, i+(domeCols+1)]);
    }
    // last col wrap
    const i = domeStart + r*(domeCols+1)+domeCols;
    edges.push([i, i+(domeCols+1)]);
  }
  for(let c=0; c<domeCols; c++){
    const i = domeStart + domeRows*(domeCols+1)+c;
    edges.push([i, i+1]);
  }

  // Visor band (flat horizontal strip)
  const visorRows = 3, visorCols = 20;
  const visorStart = verts.length;
  for(let r=0; r<=visorRows; r++){
    const y = 0.08 + r * 0.18;
    const scale = 1.0 + r * 0.04;
    for(let c=0; c<=visorCols; c++){
      const theta = -0.45 + (c/visorCols) * (Math.PI + 0.9);
      const x = Math.cos(theta) * 1.22 * scale;
      const z = Math.sin(theta) * 1.08 * scale;
      verts.push([x, y, z]);
    }
  }
  for(let r=0; r<visorRows; r++){
    for(let c=0; c<visorCols; c++){
      const i = visorStart + r*(visorCols+1)+c;
      edges.push([i, i+1]);
      edges.push([i, i+(visorCols+1)]);
    }
    const i = visorStart + r*(visorCols+1)+visorCols;
    edges.push([i, i+(visorCols+1)]);
  }
  for(let c=0; c<visorCols; c++){
    const i = visorStart + visorRows*(visorCols+1)+c;
    edges.push([i, i+1]);
  }

  // Chin guard
  const chinRows = 4, chinCols = 14;
  const chinStart = verts.length;
  for(let r=0; r<=chinRows; r++){
    const y = 0.54 + r * 0.16;
    const taper = 1.0 - r*0.06;
    for(let c=0; c<=chinCols; c++){
      const theta = 0.1 + (c/chinCols)*Math.PI*0.8;
      const x = Math.cos(theta) * 1.05 * taper;
      const z = Math.sin(theta) * 0.92 * taper;
      verts.push([x, y, z]);
    }
  }
  for(let r=0; r<chinRows; r++){
    for(let c=0; c<chinCols; c++){
      const i = chinStart + r*(chinCols+1)+c;
      edges.push([i, i+1]);
      edges.push([i, i+(chinCols+1)]);
    }
    const i = chinStart + r*(chinCols+1)+chinCols;
    edges.push([i, i+(chinCols+1)]);
  }
  for(let c=0; c<chinCols; c++){
    edges.push([chinStart+chinRows*(chinCols+1)+c, chinStart+chinRows*(chinCols+1)+c+1]);
  }

  // Side cheek panels
  for(let s of [-1,1]){
    const ps = verts.length;
    const rows=4, cols=6;
    for(let r=0; r<=rows; r++){
      for(let c=0; c<=cols; c++){
        const y = 0.3 + r*0.12;
        const theta = s>0 ? (-0.3 - c*0.06) : (Math.PI+0.3+c*0.06);
        const radius = 1.15 - r*0.02;
        const x = Math.cos(theta)*radius;
        const z = Math.sin(theta)*0.9;
        verts.push([x, y, z]);
      }
    }
    for(let r=0; r<rows; r++){
      for(let c=0; c<cols; c++){
        const i = ps + r*(cols+1)+c;
        edges.push([i,i+1]);
        edges.push([i,i+(cols+1)]);
      }
    }
  }

  // Highlight edges (brighter): visor top edge
  const hlEdges = [];
  for(let c=0; c<visorCols; c++){
    hlEdges.push(visorStart + c);
    hlEdges.push(visorStart + c + 1);
  }

  return { verts, edges, hlEdges };
}

const GEOM = buildHelmetGeometry();

// ─── PARTICLE SYSTEM ─────────────────────────────────────────────
function createHelmetState(){
  return {
    phase: 'assemble',   // assemble | hold | idle
    progress: 0,         // 0..1
    particles: null,
    assembled: false,
    lastSeen: Date.now(),
    animStart: Date.now(),
  };
}

function initParticles(geom, cx, cy, radius){
  // Each vertex gets a particle with a random start position (scattered) and target
  return geom.verts.map(v => {
    const angle1 = Math.random()*Math.PI*2;
    const angle2 = Math.random()*Math.PI*2;
    const dist = 300 + Math.random()*400;
    return {
      sx: cx + Math.cos(angle1)*dist,
      sy: cy + Math.sin(angle2)*dist,
      tx: 0, ty: 0, // filled each frame from projected verts
      trail: [],
    };
  });
}

// ─── PROJECTION ──────────────────────────────────────────────────
function projectVerts(verts, cx, cy, radius, rotY){
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  return verts.map(([x,y,z])=>{
    // rotate around Y
    const rx = x*cosY + z*sinY;
    const rz = -x*sinY + z*cosY;
    // simple perspective
    const scale = radius * (0.8 + 0.3/(rz+2.5));
    const px = cx + rx * scale;
    const py = cy + y * radius;
    return { px, py, z: rz };
  });
}

// ease functions
function easeOutCubic(t){ return 1-(1-t)**3; }
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-(-2*t+2)**3/2; }

// ─── DRAW HELMET ─────────────────────────────────────────────────
function drawHelmet(state, cx, cy, radius, time){
  const { phase, progress } = state;
  const t = easeOutCubic(Math.min(progress, 1));
  const color = `rgba(140,255,50,`;
  const glow = `rgba(140,255,50,`;
  const rotY = Math.sin(time*0.0004)*0.15; // subtle wobble

  const projected = projectVerts(GEOM.verts, cx, cy, radius, rotY);

  // Update particle targets
  if(state.particles){
    projected.forEach((p,i)=>{
      if(state.particles[i]){
        state.particles[i].tx = p.px;
        state.particles[i].ty = p.py;
      }
    });
  }

  if(phase === 'assemble' && state.particles){
    // Draw particles flying in
    state.particles.forEach((p, i)=>{
      const px = p.sx + (p.tx - p.sx)*t;
      const py = p.sy + (p.ty - p.sy)*t;
      // trail
      p.trail.push({x:px,y:py});
      if(p.trail.length > 6) p.trail.shift();

      ctx.save();
      // trail
      if(p.trail.length > 1){
        ctx.beginPath();
        ctx.moveTo(p.trail[0].x, p.trail[0].y);
        for(let j=1;j<p.trail.length;j++) ctx.lineTo(p.trail[j].x, p.trail[j].y);
        ctx.strokeStyle = `rgba(140,255,50,${0.15*t})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      // dot
      ctx.beginPath();
      ctx.arc(px, py, 1.2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,255,120,${0.6*t})`;
      ctx.shadowColor = '#aaff44';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.restore();
    });

    // Draw edges assembling (fade in when close to assembled)
    const edgeAlpha = Math.max(0, (t-0.5)*2);
    if(edgeAlpha > 0) drawEdges(projected, edgeAlpha, rotY, radius);

  } else {
    // fully assembled
    drawEdges(projected, 1.0, rotY, radius);
    // bright outline glow pass
    drawEdges(projected, 0.15, rotY, radius, 3);
  }
}

function drawEdges(projected, alpha, rotY, radius, extraWidth=0){
  const BASE = 0.9 + 0.1*Math.sin(Date.now()*0.003);

  GEOM.edges.forEach(([a,b])=>{
    const pa = projected[a], pb = projected[b];
    if(!pa||!pb) return;
    // depth fade
    const avgZ = (pa.z + pb.z)/2;
    const depthAlpha = Math.max(0.15, Math.min(1, (avgZ + 1.5) / 2));
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pa.px, pa.py);
    ctx.lineTo(pb.px, pb.py);
    ctx.strokeStyle = `rgba(140,255,50,${alpha*depthAlpha*BASE})`;
    ctx.lineWidth = (extraWidth||0) + (avgZ > 0 ? 1.3 : 0.7);
    if(extraWidth > 0){
      ctx.shadowColor = '#aaff44';
      ctx.shadowBlur = 12;
    }
    ctx.stroke();
    ctx.restore();
  });
}

// ─── FACE DETECTION ──────────────────────────────────────────────
let detecting = false;
async function detect(){
  if(detecting || !running) return;
  detecting = true;
  try{
    const opts = new faceapi.TinyFaceDetectorOptions({inputSize:224, scoreThreshold:0.4});
    const res = await faceapi.detectAllFaces(video, opts).withFaceLandmarks(true);
    faces = res || [];
  }catch(e){}
  detecting = false;
}
setInterval(detect, 150);

// ─── MAIN LOOP ───────────────────────────────────────────────────
const helmetStates = {};

function loop(time){
  if(!running){ requestAnimationFrame(loop); return; }
  ctx.clearRect(0,0,W,H);

  const scaleX = W / (video.videoWidth||W);
  const scaleY = H / (video.videoHeight||H);

  // Update status
  const statusEl = document.getElementById('status');
  if(faces.length > 0){
    statusEl.textContent = 'FACE LOCKED · TRACKING ACTIVE';
  } else {
    statusEl.textContent = 'SCANNING...';
  }

  faces.forEach((face, fi)=>{
    const box = face.detection.box;
    // mirror x
    const rawCX = box.x + box.width/2;
    const mirCX = (video.videoWidth||W) - rawCX;
    const cx = mirCX * scaleX;
    const cy = (box.y + box.height*0.35) * scaleY;
    const radius = box.height * scaleY * 0.72;

    if(!helmetStates[fi]){
      helmetStates[fi] = createHelmetState();
      helmetStates[fi].particles = initParticles(GEOM, cx, cy, radius);
    }
    const state = helmetStates[fi];
    state.lastSeen = Date.now();

    const elapsed = Date.now() - state.animStart;
    const assembleDuration = 2200;

    if(state.phase === 'assemble'){
      state.progress = Math.min(elapsed / assembleDuration, 1);
      if(state.progress >= 1){
        state.phase = 'hold';
        state.assembled = true;
      }
    }

    drawHelmet(state, cx, cy, radius, time);

    // Scan line sweep
    if(state.phase === 'assemble'){
      const sweep = ((elapsed % 1800) / 1800);
      const sy = cy - radius*1.8 + sweep * radius * 3.5;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx - radius*2, sy);
      ctx.lineTo(cx + radius*2, sy);
      const g = ctx.createLinearGradient(cx-radius*2,sy,cx+radius*2,sy);
      g.addColorStop(0,'rgba(140,255,50,0)');
      g.addColorStop(0.5,'rgba(140,255,50,0.5)');
      g.addColorStop(1,'rgba(140,255,50,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#aaff44';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.restore();
    }

    // Assembly particles glow at end
    if(state.phase === 'assemble' && state.progress > 0.85){
      const flash = (state.progress - 0.85)/0.15;
      ctx.save();
      ctx.globalAlpha = flash * 0.2;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius*1.8);
      grad.addColorStop(0,'rgba(180,255,80,0.8)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius*1.8, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  });

  // Cleanup lost faces
  Object.keys(helmetStates).forEach(k=>{
    if(helmetStates[k] && Date.now() - helmetStates[k].lastSeen > 2000){
      helmetStates[k] = null;
    }
  });

  requestAnimationFrame(loop);
}

// ─── INIT ─────────────────────────────────────────────────────────
startBtn.addEventListener('click', async ()=>{
  startBtn.disabled = true;
  startMsg.textContent = '[ LOADING MODELS... ]';
  try{
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
    ]);
    startMsg.textContent = '[ STARTING CAMERA... ]';
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;
    await new Promise(r=>video.onloadedmetadata=r);
    video.play();
    startWrap.style.display = 'none';
    running = true;
    requestAnimationFrame(loop);
  }catch(err){
    startMsg.textContent = '[ ERROR: ' + err.message + ' ]';
    startBtn.disabled = false;
    startBtn.textContent = 'RETRY';
  }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
