<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Piksel Hassasiyetli HTML Mimarı</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen">

    <div class="container mx-auto py-10 px-4">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                PIXEL-TO-HTML SCANNER
            </h1>
            <p class="text-zinc-400 mt-2">Görseli piksel bazlı tarayıp yapısal koda dönüştürür.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-zinc-800 p-6 rounded-2xl border border-zinc-700 shadow-xl">
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-600 rounded-xl p-8 mb-6 hover:border-blue-500 transition-colors cursor-pointer" id="dropZone">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <p id="fileName" class="text-zinc-500 italic">Görseli buraya sürükleyin veya tıklayın</p>
                    <img id="preview" class="mt-4 max-h-48 rounded hidden">
                </div>

                <button id="scanBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-3">
                    <span>GÖRSELİ PİKSEL TARA VE KODLA</span>
                </button>
            </div>

            <div class="bg-zinc-800 rounded-2xl border border-zinc-700 shadow-xl flex flex-col overflow-hidden">
                <div class="flex border-b border-zinc-700">
                    <button id="tabPreview" class="flex-1 py-3 bg-zinc-700 font-bold">ÖNİZLEME</button>
                    <button id="tabCode" class="flex-1 py-3 hover:bg-zinc-700 transition-colors">KOD (HTML/CSS)</button>
                </div>
                
                <div class="flex-grow min-h-[450px] relative">
                    <div id="loading" class="absolute inset-0 bg-zinc-800/90 z-10 hidden flex items-center justify-center flex-col">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
                        <p class="mt-4 text-sm text-blue-400 font-mono tracking-widest">TARANIYOR...</p>
                    </div>
                    <iframe id="outputFrame" class="w-full h-full bg-white"></iframe>
                    <textarea id="outputCode" class="w-full h-full bg-zinc-900 text-emerald-500 p-4 font-mono text-xs hidden outline-none" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const preview = document.getElementById('preview');
        const scanBtn = document.getElementById('scanBtn');
        const outputFrame = document.getElementById('outputFrame');
        const outputCode = document.getElementById('outputCode');
        const loading = document.getElementById('loading');

        // Dosya seçme mantığı
        dropZone.onclick = () => imageInput.click();
        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                preview.src = URL.createObjectURL(file);
                preview.classList.remove('hidden');
                document.getElementById('fileName').innerText = file.name;
            }
        };

        scanBtn.onclick = async () => {
            const file = imageInput.files[0];
            if(!file) return alert("Lütfen bir görsel yükleyin!");

            loading.classList.remove('hidden');

            try {
                // GPT-4o'ya piksel tarama emri veren kritik prompt
                const response = await puter.ai.chat(
                    `Bir frontend uzmanı ve UI tarayıcı gibi davran. Gönderdiğim görseli piksel piksel analiz et:
                    1. Önce görselin genel grid yapısını (layout) belirle.
                    2. Tüm renk kodlarını (HEX) görselden tam olarak çek.
                    3. Butonlar, inputlar ve görsellerin konumlarını (padding/margin) piksel hassasiyetinde tahmin et.
                    4. Tipografiyi (font büyüklüğü, kalınlık) en yakın modern Google Font ile eşleştir.
                    5. Sonuç olarak SADECE saf HTML ve Tailwind CSS kodunu ver. Kod içinde açıklama veya markdown bloğu kullanma.`,
                    file,
                    { model: 'gpt-4o' }
                );

                const generatedCode = response.message.content;
                
                // Çıktıları işle
                outputCode.value = generatedCode;
                const blob = new Blob([generatedCode], { type: 'text/html' });
                outputFrame.src = URL.createObjectURL(blob);

            } catch (err) {
                console.error(err);
                alert("Tarama başarısız oldu.");
            } finally {
                loading.classList.add('hidden');
            }
        };

        // Tab geçişleri
        document.getElementById('tabPreview').onclick = () => {
            outputFrame.classList.remove('hidden');
            outputCode.classList.add('hidden');
            document.getElementById('tabPreview').classList.add('bg-zinc-700');
            document.getElementById('tabCode').classList.remove('bg-zinc-700');
        };
        document.getElementById('tabCode').onclick = () => {
            outputCode.classList.remove('hidden');
            outputFrame.classList.add('hidden');
            document.getElementById('tabCode').classList.add('bg-zinc-700');
            document.getElementById('tabPreview').classList.remove('bg-zinc-700');
        };
    </script>
</body>
</html>
