<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter AI - Görselden Koda</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10">

    <div class="max-w-5xl mx-auto border border-gray-200 bg-white shadow-2xl rounded-2xl overflow-hidden">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-3xl font-extrabold tracking-tight">AI Vision-to-HTML</h1>
            <p class="mt-2 opacity-80">Görseli yükle, GPT-4o saniyeler içinde kodlasın.</p>
        </div>

        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <label class="block text-sm font-semibold text-gray-700">Tasarım Görselini Seçin</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full p-2 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-400">
                
                <button id="runBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow-md transition-all active:scale-95">
                    Kodu Üret (GPT-4o)
                </button>

                <div id="status" class="hidden text-sm text-blue-600 font-medium animate-pulse">
                    AI Tasarımı inceliyor, lütfen bekleyin...
                </div>
            </div>

            <div class="flex flex-col h-full border rounded-xl overflow-hidden">
                <div class="bg-gray-100 px-4 py-2 text-xs font-mono border-b flex justify-between items-center">
                    <span>ÇIKTI ÖNİZLEME</span>
                    <button onclick="copyCode()" class="text-blue-600 hover:underline">Kodu Kopyala</button>
                </div>
                <div id="outputContainer" class="flex-grow min-h-[300px] p-2 bg-white overflow-auto text-sm">
                    <div id="placeholder" class="text-gray-400 flex items-center justify-center h-full italic">
                        Henüz bir çıktı üretilmedi.
                    </div>
                    <iframe id="previewIframe" class="w-full h-full border-none hidden"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lastGeneratedCode = "";

        document.getElementById('runBtn').onclick = async () => {
            const file = document.getElementById('imageInput').files[0];
            const status = document.getElementById('status');
            const previewIframe = document.getElementById('previewIframe');
            const placeholder = document.getElementById('placeholder');

            if (!file) {
                alert("Lütfen önce bir görsel dosyası seçin!");
                return;
            }

            status.classList.remove('hidden');
            
            try {
                // Puter.js v2'nin en güçlü özelliği: 
                // Otomatik session yönetimi sayesinde API Key istemez.
                const response = await puter.ai.chat(
                    "Bu görseldeki arayüzü modern HTML ve Tailwind CSS kullanarak kodla. Sadece HTML çıktısını ver, açıklama yapma. Responsive olsun.",
                    file,
                    { model: "gpt-4o" }
                );

                const result = response.message.content;
                lastGeneratedCode = result;

                // Iframe içine bas ve önizlemeyi göster
                const blob = new Blob([result], { type: 'text/html' });
                previewIframe.src = URL.createObjectURL(blob);
                previewIframe.classList.remove('hidden');
                placeholder.classList.add('hidden');

            } catch (err) {
                console.error(err);
                alert("Hata: " + err.message);
            } finally {
                status.classList.add('hidden');
            }
        };

        function copyCode() {
            if (!lastGeneratedCode) return alert("Kopyalanacak kod yok!");
            navigator.clipboard.writeText(lastGeneratedCode);
            alert("Kod panoya kopyalandı!");
        }
    </script>
</body>
</html>
