<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter AI + GPT-4o Image to Code</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #preview-container iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Görselden HTML Kodu Oluşturucu</h1>
        <p class="text-gray-600 mb-6">Bir görsel yükleyin, Puter ve GPT-4o bunu modern bir HTML/Tailwind koduna dönüştürsün.</p>

        <div class="flex flex-col gap-4 mb-8">
            <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <button id="generateBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition disabled:bg-gray-400">
                Kodu Oluştur
            </button>
        </div>

        <div id="loading" class="hidden text-center py-4">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div>
            <p class="text-blue-600">AI görseli analiz ediyor ve kod yazıyor...</p>
        </div>

        <div id="resultArea" class="hidden">
            <h2 class="text-lg font-semibold mb-2">Önizleme:</h2>
            <div id="preview-container" class="mb-6">
                <iframe id="livePreview"></iframe>
            </div>
            
            <h2 class="text-lg font-semibold mb-2">HTML Kodu:</h2>
            <pre id="codeOutput" class="bg-gray-900 text-green-400 p-4 rounded-lg overflow-x-auto text-sm"></pre>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const imageInput = document.getElementById('imageInput');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const codeOutput = document.getElementById('codeOutput');
        const livePreview = document.getElementById('livePreview');

        generateBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert("Lütfen önce bir görsel seçin!");
                return;
            }

            // UI Hazırlığı
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');
            generateBtn.disabled = true;

            try {
                // Puter AI Chat API Çağrısı
                const response = await puter.ai.chat(
                    `Sana gönderdiğim bu görseldeki arayüzü HTML ve Tailwind CSS kullanarak birebir oluştur. 
                     Sadece kod çıktısı ver, markdown blokları (\`\`\`) kullanma. 
                     Görseldeki renkleri, fontları ve düzeni taklit et.`,
                    file,
                    { model: 'gpt-4o' }
                );

                const generatedCode = response.message.content;

                // Sonuçları Yazdır
                codeOutput.textContent = generatedCode;
                
                // Iframe içinde canlı önizleme oluştur
                const blob = new Blob([generatedCode], { type: 'text/html' });
                livePreview.src = URL.createObjectURL(blob);

                resultArea.classList.remove('hidden');
            } catch (error) {
                console.error("Hata:", error);
                alert("Bir hata oluştu: " + error.message);
            } finally {
                loading.classList.add('hidden');
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
