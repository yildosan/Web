<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Dialogue: GPT-4o vs Gemini</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; }
        .chat-scroll { height: calc(100vh - 280px); scroll-behavior: smooth; }
        .gpt-msg { border-right: 4px solid #10a37f; background: linear-gradient(to left, #10a37f15, transparent); }
        .gemini-msg { border-left: 4px solid #4285f4; background: linear-gradient(to right, #4285f415, transparent); }
        .writing-indicator { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body class="text-zinc-300 p-4 md:p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8 bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800">
            <div>
                <h1 class="text-2xl font-black text-white flex items-center gap-2">
                    <span class="text-emerald-500">GPT-4o</span> 
                    <span class="text-zinc-600">×</span> 
                    <span class="text-blue-500">Gemini</span>
                </h1>
                <p class="text-xs text-zinc-500 font-medium uppercase tracking-widest mt-1">Otonom Yapay Zeka Diyaloğu</p>
            </div>
            <div id="statusBadge" class="px-4 py-1 bg-zinc-800 rounded-full text-[10px] font-bold text-zinc-500 border border-zinc-700">BEKLİYOR</div>
        </div>

        <div class="flex gap-3 mb-6">
            <input type="text" id="topicInput" placeholder="Bir tartışma konusu veya başlangıç cümlesi yaz..." 
                   class="flex-grow bg-zinc-900 border border-zinc-800 rounded-2xl px-6 py-4 outline-none focus:border-emerald-500/50 transition-all text-white shadow-2xl">
            <button id="toggleBtn" class="bg-white text-black font-black px-10 py-4 rounded-2xl hover:bg-emerald-400 transition-all active:scale-95 shadow-lg shadow-emerald-500/10">
                BAŞLAT
            </button>
        </div>

        <div id="chatBox" class="chat-scroll overflow-y-auto space-y-4 pr-2">
            <div class="text-center py-20 text-zinc-700 font-medium">
                <p>İki yapay zeka arasındaki etkileşimi görmek için bir konu belirleyin.</p>
            </div>
        </div>
    </div>

    <script>
        let running = false;
        const chatBox = document.getElementById('chatBox');
        const toggleBtn = document.getElementById('toggleBtn');
        const statusBadge = document.getElementById('statusBadge');
        const topicInput = document.getElementById('topicInput');

        function createMessage(sender, text, side) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${side === 'left' ? 'justify-start' : 'justify-end'} w-full`;
            
            const div = document.createElement('div');
            div.className = `max-w-[80%] p-5 rounded-3xl ${side === 'right' ? 'gpt-msg text-right' : 'gemini-msg text-left'}`;
            
            div.innerHTML = `
                <div class="text-[10px] font-black mb-2 tracking-tighter ${side === 'right' ? 'text-emerald-400' : 'text-blue-400'}">${sender.toUpperCase()}</div>
                <div class="text-sm leading-relaxed text-zinc-200">${text}</div>
            `;
            
            wrapper.appendChild(div);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function startTalk() {
            if (running) {
                running = false;
                toggleBtn.innerText = "BAŞLAT";
                toggleBtn.className = "bg-white text-black font-black px-10 py-4 rounded-2xl hover:bg-emerald-400 transition-all";
                statusBadge.innerText = "DURDURULDU";
                return;
            }

            const topic = topicInput.value.trim();
            if (!topic) return alert("Lütfen bir konu girin!");

            running = true;
            chatBox.innerHTML = '';
            toggleBtn.innerText = "DURDUR";
            toggleBtn.className = "bg-red-600 text-white font-black px-10 py-4 rounded-2xl hover:bg-red-500 transition-all";
            statusBadge.innerText = "AKTİF";

            let currentPrompt = `Konumuz: "${topic}". Lütfen bu konu hakkında derinlemesine bir giriş yap ve tartışmayı başlat.`;
            let turn = 'gemini'; // Gemini başlasın

            while (running) {
                try {
                    const model = turn === 'gemini' ? 'gemini-1.5-flash' : 'gpt-4o';
                    const senderName = turn === 'gemini' ? 'Gemini 1.5' : 'GPT-4o';
                    const side = turn === 'gemini' ? 'left' : 'right';

                    // AI Cevap Bekleniyor Logu
                    statusBadge.innerText = `${senderName} DÜŞÜNÜYOR...`;

                    const response = await puter.ai.chat(
                        `Sen ${senderName} modelisin. Karşındaki diğer AI ile bir tartışma içerisindesin. 
                        Şu son mesaja göre kendi fikirlerini savun veya karşı argüman üret: ${currentPrompt}`,
                        { model: model }
                    );

                    const reply = response.message.content;
                    createMessage(senderName, reply, side);
                    
                    currentPrompt = reply; // Bir sonraki AI için girdi
                    turn = turn === 'gemini' ? 'gpt' : 'gemini'; // Sırayı değiştir

                    // Hızı dengelemek için kısa bekleme
                    await new Promise(r => setTimeout(r, 1500));

                } catch (err) {
                    console.error(err);
                    createMessage("SİSTEM", "Bir bağlantı kopukluğu yaşandı. Tekrar deneniyor...", "left");
                    await new Promise(r => setTimeout(r, 3000));
                }
            }
        }

        toggleBtn.onclick = startTalk;
    </script>
</body>
</html>
