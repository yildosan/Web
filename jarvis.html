<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter AI - Pixel to HTML Engine</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .scanner-line {
            height: 3px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 2.5s ease-in-out infinite;
            display: none;
        }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex items-center justify-between">
            <h1 class="text-3xl font-black text-white italic">PIXEL<span class="text-blue-500">ENGINE</span></h1>
            <div class="text-xs font-mono text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">Vercel & Puter Optimized</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-6 rounded-3xl">
                <div id="dropZone" class="relative min-h-[350px] border-2 border-dashed border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition-all overflow-hidden bg-slate-900/50">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <div id="placeholder" class="text-center">
                        <div class="text-6xl mb-4 opacity-50">📁</div>
                        <p class="text-slate-400">Görseli sürükleyin veya seçin</p>
                    </div>
                    <img id="imgPreview" class="hidden max-w-full max-h-[400px] object-contain p-2">
                    <div id="scanLine" class="scanner-line"></div>
                </div>
                
                <button id="convertBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-blue-900/40 active:scale-95">
                    KODU OLUŞTUR (CLAUDE 3.5)
                </button>
            </div>

            <div class="glass rounded-3xl overflow-hidden flex flex-col shadow-2xl min-h-[500px]">
                <div class="flex bg-slate-800 p-2 gap-2">
                    <button id="btnPreview" class="flex-1 py-2 text-xs font-bold bg-slate-700 text-white rounded-xl">CANLI ÖNİZLEME</button>
                    <button id="btnCode" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-white transition">KOD ÇIKTISI</button>
                </div>
                
                <div class="flex-grow bg-white relative">
                    <div id="loading" class="hidden absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center z-50">
                        <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p class="text-blue-400 font-mono text-sm">Pikseller koda dökülüyor...</p>
                    </div>
                    
                    <iframe id="outputFrame" class="w-full h-full border-none"></iframe>
                    <textarea id="outputCode" class="hidden absolute inset-0 w-full h-full bg-[#1e1e1e] text-blue-300 p-6 font-mono text-xs outline-none resize-none" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const imgPreview = document.getElementById('imgPreview');
        const placeholder = document.getElementById('placeholder');
        const scanLine = document.getElementById('scanLine');
        const convertBtn = document.getElementById('convertBtn');
        const loading = document.getElementById('loading');
        const outputFrame = document.getElementById('outputFrame');
        const outputCode = document.getElementById('outputCode');

        dropZone.onclick = () => imageInput.click();

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                imgPreview.src = URL.createObjectURL(file);
                imgPreview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            }
        };

        // Görseli Base64'e çevirme (Hata çözücü)
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        convertBtn.onclick = async () => {
            const file = imageInput.files[0];
            if(!file) return alert("Lütfen bir görsel seçin!");

            loading.classList.remove('hidden');
            scanLine.style.display = 'block';
            convertBtn.disabled = true;

            try {
                // Modeli 'claude-3-5-sonnet' veya 'gpt-4o' olarak ayarlayabilirsin
                const response = await puter.ai.chat(
                    "Bu görseldeki web tasarımını birebir HTML ve Tailwind CSS olarak kodla. SADECE saf HTML kodu ver, açıklama yapma.",
                    file, 
                    { model: 'claude-3-5-sonnet' }
                );

                if (!response || !response.message) {
                    throw new Error("API yanıt vermedi.");
                }

                const result = response.message.content;
                // Markdown temizleme
                const cleanCode = result.replace(/```html|```/g, "").trim();

                outputCode.value = cleanCode;
                const blob = new Blob([cleanCode], { type: 'text/html' });
                outputFrame.src = URL.createObjectURL(blob);

            } catch (err) {
                console.error("Detaylı Hata:", err);
                alert("Hata oluştu: " + (err.message || "Bilinmeyen bir hata"));
            } finally {
                loading.classList.add('hidden');
                scanLine.style.display = 'none';
                convertBtn.disabled = false;
            }
        };

        // Tab Kontrolleri
        document.getElementById('btnPreview').onclick = () => {
            outputFrame.classList.remove('hidden');
            outputCode.classList.add('hidden');
            document.getElementById('btnPreview').classList.add('bg-slate-700', 'text-white');
            document.getElementById('btnCode').classList.remove('bg-slate-700', 'text-white');
        };

        document.getElementById('btnCode').onclick = () => {
            outputCode.classList.remove('hidden');
            outputFrame.classList.add('hidden');
            document.getElementById('btnCode').classList.add('bg-slate-700', 'text-white');
            document.getElementById('btnPreview').classList.remove('bg-slate-700', 'text-white');
        };
    </script>
</body>
</html>
