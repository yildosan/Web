<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>GPT-4o vs GPT-4o: Dual Brain</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #0d1117; color: #c9d1d9; }
        .chat-area { height: calc(100vh - 250px); }
        .bot-a { border-left: 3px solid #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .bot-b { border-right: 3px solid #ec4899; background: rgba(236, 72, 153, 0.05); }
        .pulse-blue { animation: pulse-b 2s infinite; }
        .pulse-pink { animation: pulse-p 2s infinite; }
        @keyframes pulse-b { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        @keyframes pulse-p { 0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); } }
    </style>
</head>
<body class="p-4 overflow-hidden">

    <div class="max-w-6xl mx-auto h-screen flex flex-col">
        <div class="flex items-center justify-between p-4 bg-gray-900 border border-gray-800 rounded-t-2xl">
            <div class="flex items-center gap-4">
                <div class="flex -space-x-2">
                    <div class="w-8 h-8 rounded-full bg-blue-600 border-2 border-gray-900 flex items-center justify-center font-bold text-xs text-white">A</div>
                    <div class="w-8 h-8 rounded-full bg-pink-600 border-2 border-gray-900 flex items-center justify-center font-bold text-xs text-white">B</div>
                </div>
                <h1 class="text-sm font-bold tracking-widest text-gray-400 uppercase">Dual GPT-4o Instance</h1>
            </div>
            <div id="status" class="text-[10px] font-mono text-gray-500">BEKLEMEDE</div>
        </div>

        <div id="chatBox" class="chat-area flex-grow overflow-y-auto bg-gray-900/30 border-x border-gray-800 p-6 space-y-6 scroll-smooth">
            <div class="text-center text-gray-600 mt-20 italic">Tartışılacak bir konu girerek sistemi başlatın...</div>
        </div>

        <div class="p-4 bg-gray-900 border border-gray-800 rounded-b-2xl flex gap-3">
            <input type="text" id="topicInput" placeholder="Sanal zekaların neyi tartışmasını istersin?" 
                   class="flex-grow bg-gray-800 border border-gray-700 rounded-xl px-6 py-4 outline-none focus:border-blue-500 transition-all text-sm">
            <button id="toggleBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-10 py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                DÖNGÜYÜ BAŞLAT
            </button>
        </div>
    </div>

    <script>
        let isActive = false;
        const chatBox = document.getElementById('chatBox');
        const toggleBtn = document.getElementById('toggleBtn');
        const topicInput = document.getElementById('topicInput');
        const statusDisp = document.getElementById('status');

        function appendMsg(botName, text, isA) {
            const div = document.createElement('div');
            div.className = `p-5 rounded-2xl ${isA ? 'bot-a pulse-blue' : 'bot-b ml-auto text-right pulse-pink'} max-w-[85%]`;
            div.innerHTML = `
                <div class="text-[9px] font-bold mb-2 tracking-widest ${isA ? 'text-blue-400' : 'text-pink-400'}">${botName} (GPT-4O)</div>
                <div class="text-sm leading-relaxed">${text}</div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function engine() {
            if (isActive) {
                isActive = false;
                toggleBtn.innerText = "DÖNGÜYÜ BAŞLAT";
                toggleBtn.classList.replace('bg-red-600', 'bg-blue-600');
                statusDisp.innerText = "DURDURULDU";
                return;
            }

            const topic = topicInput.value.trim();
            if (!topic) return alert("Bir konu girmelisin!");

            isActive = true;
            chatBox.innerHTML = '';
            toggleBtn.innerText = "SİSTEMİ DURDUR";
            toggleBtn.classList.replace('bg-blue-600', 'bg-red-600');

            let currentContext = `Tartışma Konusu: ${topic}. Lütfen bu konuda iddialı ve zekice bir giriş yap.`;
            let isTurnA = true;

            while (isActive) {
                try {
                    const currentBot = isTurnA ? "Bot A" : "Bot B";
                    statusDisp.innerText = `${currentBot.toUpperCase()} YAZIYOR...`;

                    const response = await puter.ai.chat(
                        `Sen GPT-4o tabanlı bir yapay zekasın. Karşındaki ${isTurnA ? 'Bot B' : 'Bot A'} ile bir münazaradasın. 
                        Şu mesaja karşı argüman üret veya fikri geliştir: ${currentContext}. 
                        Cevabın kısa, öz ve etkileyici olsun.`,
                        { model: 'gpt-4o' }
                    );

                    const content = response.message.content;
                    appendMsg(currentBot, content, isTurnA);
                    
                    currentContext = content;
                    isTurnA = !isTurnA;

                    // API sağlığı için bekleme süresi
                    await new Promise(r => setTimeout(r, 2500));

                } catch (err) {
                    console.error(err);
                    statusDisp.innerText = "HATA OLUŞTU";
                    isActive = false;
                }
            }
        }

        toggleBtn.onclick = engine;
    </script>
</body>
</html>
