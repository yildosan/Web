<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v20 | Web Search Enabled</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --jarvis: #00e6fe; --bg: #030a13; --border: rgba(0, 230, 254, 0.2); }
        body { background: var(--bg); color: var(--jarvis); font-family: 'Roboto Mono', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { width: 500px; height: 95vh; background: rgba(3, 10, 19, 0.95); border-radius: 20px; box-shadow: 0 0 20px var(--jarvis); display: flex; flex-direction: column; border: 2px solid var(--border); position: relative; }
        #visual { height: 250px; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border); position: relative; }
        #orb { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--jarvis); box-shadow: 0 0 30px var(--jarvis); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .m { padding: 10px 15px; border-radius: 10px; font-size: 13px; max-width: 85%; animation: slide 0.3s ease; }
        @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai { background: rgba(0, 230, 254, 0.1); border-left: 3px solid var(--jarvis); align-self: flex-start; }
        .u { background: rgba(255, 255, 255, 0.05); align-self: flex-end; color: #fff; }
        .link-btn { display: inline-block; margin-top: 8px; padding: 5px 10px; background: var(--jarvis); color: #000; text-decoration: none; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--jarvis); padding: 10px; border-radius: 8px; outline: none; }
        button { background: var(--jarvis); border: none; color: #000; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status { position: absolute; top: 10px; left: 15px; font-size: 10px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <div class="status" id="netStatus">WEB ACCESS: ACTIVE</div>
        <div id="orb"></div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Sisteme bir komut verin, Sir..." autocomplete="off">
        <button onclick="askAI()">SEND</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const netStatus = document.getElementById('netStatus');
    let memory = [];

    async function askAI() {
        const val = input.value.trim();
        if (!val) return;

        addMsg(val, 'u');
        input.value = '';
        netStatus.innerText = "WEB ACCESS: SEARCHING...";

        try {
            // Puter AI Chat with Web Search capability
            const res = await puter.ai.chat([
                { 
                    role: "system", 
                    content: "Sen Jarvis'sin. Sir'e (Yıldıray) hizmet ediyorsun. İnternet erişimin var. Güncel bilgiler istendiğinde mutlaka web araması yap. Cevaplarında bulduğun linkleri '[Link Metni](URL)' formatında ekle. Çok profesyonel ve analitik ol." 
                },
                ...memory,
                { role: "user", content: val }
            ], {
                model: 'gpt-4o',
                // Web araması özelliğini burada aktif ediyoruz
                web_browser: true 
            });

            const reply = res.message.content;
            
            // Linkleri tespit edip butonlaştıran basit bir parser
            const formattedReply = formatMessage(reply);
            
            addMsg(formattedReply, 'ai', true);
            memory.push({ role: "user", content: val }, { role: "assistant", content: reply });
            if(memory.length > 10) memory.shift();
            
            netStatus.innerText = "WEB ACCESS: ACTIVE";

        } catch (e) {
            addMsg("Üzgünüm Sir, merkezi veri tabanına ulaşırken bir hata oluştu.", 'ai');
        }
    }

    function formatMessage(text) {
        // Markdown linklerini ([text](url)) HTML butonlarına çevirir
        const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
        return text.replace(linkRegex, '<a href="$2" target="_blank" class="link-btn">$1</a>');
    }

    function addMsg(t, c, isHTML = false) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        if(isHTML) d.innerHTML = t;
        else d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>
</body>
</html>
