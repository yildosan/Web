<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Grup</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b141a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .wa-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #0b141a; }
        .chat-area { height: calc(100vh - 130px); }
        .my-bubble { background-color: #005c4b; border-radius: 8px 0 8px 8px; }
        .ai-bubble { background-color: #202c33; border-radius: 0 8px 8px 8px; }
        .typing { font-style: italic; font-size: 11px; color: #00a884; }
    </style>
</head>
<body class="wa-bg">

    <header class="h-16 bg-[#202c33] flex items-center px-4 gap-3 border-b border-gray-700 shadow-lg sticky top-0 z-50">
        <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center text-white text-xl">👥</div>
        <div class="flex flex-col">
            <span class="text-white font-semibold text-sm">Geyik Muhabbeti 🚀</span>
            <span id="typingStatus" class="typing h-4"></span>
        </div>
    </header>

    <main id="chatBox" class="chat-area overflow-y-auto p-4 space-y-3 flex flex-col">
        <div class="self-center bg-[#182229] text-[#8696a0] text-[11px] px-3 py-1 rounded-md mb-4 shadow-sm">
            Bugün
        </div>
    </main>

    <footer class="h-16 bg-[#202c33] flex items-center px-3 gap-2 sticky bottom-0">
        <input type="text" id="userInput" placeholder="Mesaj yazın..." 
               class="flex-grow bg-[#2a3942] text-white rounded-full px-5 py-2 outline-none text-sm border-none">
        <button id="sendBtn" class="bg-[#00a884] w-10 h-10 rounded-full flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
        </button>
    </footer>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingStatus = document.getElementById('typingStatus');

        let chatHistory = [];

        function addMessage(sender, text, type) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col max-w-[85%] ${type === 'me' ? 'self-end' : 'self-start'}`;
            
            const senderNameColor = sender === 'Ali' ? '#3498db' : (sender === 'Ayşe' ? '#e91e63' : '#00a884');
            
            wrapper.innerHTML = `
                <div class="${type === 'me' ? 'my-bubble' : 'ai-bubble'} p-2 px-3 shadow-md relative">
                    ${type !== 'me' ? `<div style="color:${senderNameColor}; font-weight:bold; font-size:12px; margin-bottom:2px;">${sender}</div>` : ''}
                    <div class="text-white text-[14px] leading-snug">${text}</div>
                    <div class="text-[10px] text-gray-400 text-right mt-1">${new Date().getHours()}:${String(new Date().getMinutes()).padStart(2, '0')}</div>
                </div>
            `;
            
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            chatHistory.push({ role: sender === 'Sen' ? 'user' : 'assistant', content: `${sender}: ${text}` });
        }

        async function aiTurn(botName) {
            typingStatus.innerText = `${botName} yazıyor...`;
            
            try {
                const prompt = `
                    WhatsApp grubundasın. Adın ${botName}. Grupta Ali, Ayşe ve Sen varsınız. 
                    Karakterin: Samimi, doğal, emoji kullanan, bazen espri yapan, gerçek bir Türk genci gibi konuşan biri ol. 
                    Resmiyetten uzak dur. Önceki konuşmaları oku ve muhabbete dahil ol. 
                    Lütfen sadece kendi mesajını yaz. Başka birinin adını başına ekleme.
                `;

                const response = await puter.ai.chat(prompt, JSON.stringify(chatHistory), { model: 'gpt-4o' });
                const reply = response.message.content;
                
                typingStatus.innerText = '';
                addMessage(botName, reply, 'ai');
            } catch (err) {
                console.error(err);
                typingStatus.innerText = '';
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            addMessage('Sen', text, 'me');

            // Sen yazdıktan sonra önce Ali, sonra Ayşe tepki versin
            await new Promise(r => setTimeout(r, 1000));
            await aiTurn('Ali');
            
            await new Promise(r => setTimeout(r, 2000));
            await aiTurn('Ayşe');
            
            // Sonra kendi aralarında bir tur daha dönebilirler
            if (Math.random() > 0.5) {
                await new Promise(r => setTimeout(r, 2500));
                await aiTurn('Ali');
            }
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => e.key === 'Enter' && handleSend();
    </script>
</body>
</html>
