<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual GPT-4o Mobile</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; }
        
        .chat-height { height: calc(100vh - 180px); }
        
        /* Mesaj Balonları */
        .bubble-a {
            background: #1e293b;
            border-bottom-left-radius: 4px;
            border-left: 4px solid #3b82f6;
        }
        .bubble-b {
            background: #2d1b36;
            border-bottom-right-radius: 4px;
            border-right: 4px solid #d946ef;
        }

        /* Yükleme Animasyonu */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #94a3b8;
            animation: dot-flashing 1s infinite linear alternate;
            display: inline-block;
        }
        @keyframes dot-flashing {
            0% { background-color: #94a3b8; }
            50%, 100% { background-color: #475569; }
        }
    </style>
</head>
<body class="overflow-hidden">

    <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900/50 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
            <h1 class="text-white font-bold text-sm tracking-tight uppercase">Bot-A vs Bot-B</h1>
        </div>
        <div id="status" class="text-[10px] font-bold text-zinc-500 bg-zinc-800 px-2 py-1 rounded">HAZIR</div>
    </header>

    <main id="chatBox" class="chat-height overflow-y-auto p-4 space-y-6 scroll-smooth">
        <div class="flex flex-col items-center justify-center h-full text-center px-8 space-y-4">
            <div class="w-16 h-16 bg-zinc-800 rounded-2xl flex items-center justify-center text-3xl">🤖</div>
            <p class="text-zinc-500 text-sm italic">İki GPT-4o'nun birbiriyle konuşmasını izlemek için aşağıdan bir konu başlatın.</p>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full p-4 bg-zinc-900/80 backdrop-blur-xl border-t border-zinc-800">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="topicInput" placeholder="Tartışma konusu nedir?" 
                   class="flex-grow bg-zinc-800 text-white rounded-2xl px-5 py-3 outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-sm">
            <button id="toggleBtn" class="bg-white text-black font-extrabold px-6 py-3 rounded-2xl text-xs uppercase tracking-tighter active:scale-90 transition-all">
                BAŞLAT
            </button>
        </div>
    </footer>

    <script>
        let running = false;
        const chatBox = document.getElementById('chatBox');
        const toggleBtn = document.getElementById('toggleBtn');
        const topicInput = document.getElementById('topicInput');
        const status = document.getElementById('status');

        function addMessage(sender, text, isA) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isA ? 'justify-start' : 'justify-end'}`;
            
            const div = document.createElement('div');
            div.className = `max-w-[85%] p-4 rounded-2xl shadow-2xl ${isA ? 'bubble-a' : 'bubble-b'}`;
            
            div.innerHTML = `
                <p class="text-[10px] font-black mb-1 tracking-widest ${isA ? 'text-blue-400' : 'text-magenta-400'}" style="${!isA ? 'color:#d946ef' : ''}">
                    ${sender}
                </p>
                <p class="text-sm text-zinc-100 leading-relaxed">${text}</p>
            `;
            
            wrapper.appendChild(div);
            chatBox.appendChild(wrapper);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        async function startDiscussion() {
            if (running) {
                running = false;
                toggleBtn.innerText = "BAŞLAT";
                toggleBtn.className = "bg-white text-black font-extrabold px-6 py-3 rounded-2xl text-xs uppercase tracking-tighter active:scale-90 transition-all";
                status.innerText = "DURDU";
                return;
            }

            const topic = topicInput.value.trim();
            if (!topic) return;

            running = true;
            chatBox.innerHTML = '';
            toggleBtn.innerText = "DURDUR";
            toggleBtn.className = "bg-red-600 text-white font-extrabold px-6 py-3 rounded-2xl text-xs uppercase tracking-tighter active:scale-90 transition-all";
            
            let lastMessage = `Konumuz: "${topic}". Lütfen tartışmayı başlat ve karşı tarafın fikrini merak et.`;
            let isBotA = true;

            while (running) {
                try {
                    const currentBot = isBotA ? "Bot A" : "Bot B";
                    status.innerText = `${currentBot} YAZIYOR...`;

                    const response = await puter.ai.chat(
                        `Sen GPT-4o tabanlı bir yapay zekasın. Karşındaki Bot ile şu konu üzerinde tartışıyorsun: ${topic}. 
                        Sana gelen son mesaj şu: "${lastMessage}". 
                        Bu mesaja cevap ver, gerekirse eleştir veya geliştir. Kısa ve vurucu konuş.`,
                        { model: 'gpt-4o' }
                    );

                    const content = response.message.content;
                    addMessage(currentBot, content, isBotA);
                    
                    lastMessage = content;
                    isBotA = !isBotA;

                    // AI'ların insan hızında görünmesi için bekleme
                    await new Promise(r => setTimeout(r, 2000));

                } catch (err) {
                    console.error(err);
                    status.innerText = "HATA";
                    running = false;
                }
            }
        }

        toggleBtn.onclick = startDiscussion;

        // Klavyede Enter'a basınca başlatma
        topicInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startDiscussion();
        });
    </script>
</body>
</html>
