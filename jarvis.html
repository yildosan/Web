<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Grup</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b141a; font-family: 'Segoe UI', sans-serif; }
        .wa-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #0b141a; }
        .chat-area { height: calc(100vh - 130px); }
        .my-bubble { background-color: #005c4b; border-radius: 8px 0 8px 8px; align-self: flex-end; }
        .ai-bubble { background-color: #202c33; border-radius: 0 8px 8px 8px; align-self: flex-start; }
        .typing { font-style: italic; font-size: 11px; color: #00a884; }
    </style>
</head>
<body class="wa-bg overflow-hidden">

    <header class="h-16 bg-[#202c33] flex items-center px-4 gap-3 border-b border-gray-700 shadow-lg sticky top-0 z-50">
        <div class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center text-white text-xl">👥</div>
        <div class="flex flex-col">
            <span class="text-white font-semibold text-sm">Geyik Muhabbeti 🚀</span>
            <span id="typingStatus" class="typing h-4"></span>
        </div>
    </header>

    <main id="chatBox" class="chat-area overflow-y-auto p-4 space-y-3 flex flex-col">
        <div class="self-center bg-[#182229] text-[#8696a0] text-[11px] px-3 py-1 rounded-md mb-4">
            BUGÜN
        </div>
    </main>

    <footer class="h-16 bg-[#202c33] flex items-center px-3 gap-2 sticky bottom-0">
        <input type="text" id="userInput" placeholder="Mesaj yazın..." 
               class="flex-grow bg-[#2a3942] text-white rounded-full px-5 py-2 outline-none text-sm border-none">
        <button id="sendBtn" class="bg-[#00a884] w-10 h-10 rounded-full flex items-center justify-center text-white active:scale-90 transition-transform">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
        </button>
    </footer>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingStatus = document.getElementById('typingStatus');

        // Mesaj geçmişini tutan dizi
        let conversationLog = "";

        function addMessageToUI(sender, text, isMe) {
            const wrapper = document.createElement('div');
            wrapper.className = isMe ? 'my-bubble p-2 px-3 shadow-md max-w-[85%]' : 'ai-bubble p-2 px-3 shadow-md max-w-[85%]';
            
            const color = sender === 'Ali' ? '#3498db' : (sender === 'Ayşe' ? '#e91e63' : '#00a884');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            wrapper.innerHTML = `
                ${!isMe ? `<div style="color:${color}; font-weight:bold; font-size:12px; margin-bottom:2px;">${sender}</div>` : ''}
                <div class="text-white text-[14px] leading-snug">${text}</div>
                <div class="text-[10px] text-gray-400 text-right mt-1">${time}</div>
            `;
            
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // AI için log oluştur
            conversationLog += `${sender}: ${text}\n`;
        }

        async function triggerAI(botName) {
            typingStatus.innerText = `${botName} yazıyor...`;
            
            try {
                // Karakter ve Bağlam Tanımı
                const systemInstructions = `
                WhatsApp grubundasın. Adın ${botName}. 
                Grupta Ali, Ayşe ve "Sen" (kullanıcı) var. 
                KARAKTER: Doğal, samimi Türk genci, emoji kullanır, kısaltmalar (slm, tmm, naber) yapabilir.
                DİKKAT: Sadece kendi mesajını yaz. Başına "${botName}:" ekleme. 
                Önceki konuşma geçmişi şudur:
                ${conversationLog}
                `;

                const response = await puter.ai.chat(systemInstructions, { model: 'gpt-4o' });
                const reply = response.message.content.trim();
                
                typingStatus.innerText = '';
                if(reply) {
                    addMessageToUI(botName, reply, false);
                }
            } catch (err) {
                console.error("AI Hatası:", err);
                typingStatus.innerText = '';
            }
        }

        async function handleAction() {
            const val = userInput.value.trim();
            if (!val) return;

            userInput.value = '';
            addMessageToUI('Sen', val, true);

            // Rastgele gecikmelerle cevaplar gelsin
            setTimeout(() => triggerAI('Ali'), 1500);
            setTimeout(() => triggerAI('Ayşe'), 4000);
        }

        sendBtn.onclick = handleAction;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleAction(); };
    </script>
</body>
</html>
