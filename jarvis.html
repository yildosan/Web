<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter AI - Vision to HTML (Claude Edition)</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; }
        .glass { background: rgba(23, 23, 23, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .scanner { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #8b5cf6; box-shadow: 0 0 20px #8b5cf6; animation: scan 2s ease-in-out infinite; display: none; }
        @keyframes scan { 0%, 100% { top: 0; } 50% { top: 100%; } }
    </style>
</head>
<body class="p-4 md:p-10 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold tracking-tighter text-purple-400">CLAUDE <span class="text-white">VISION-HTML</span></h1>
            <div id="modelBadge" class="text-[10px] bg-purple-900/30 text-purple-300 border border-purple-500/30 px-3 py-1 rounded-full uppercase font-bold tracking-widest">Model: Claude 3.5 Sonnet</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-6 rounded-2xl">
                <div id="dropZone" class="relative min-h-[300px] border-2 border-dashed border-zinc-700 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-purple-500 transition-all overflow-hidden group">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <div id="placeholder" class="text-center p-6">
                        <div class="text-5xl mb-4">🖼️</div>
                        <p class="text-zinc-400 font-medium">Görseli buraya bırakın veya tıklayın</p>
                        <p class="text-zinc-600 text-xs mt-2 italic">UI tasarımları, ekran görüntüleri veya eskizler</p>
                    </div>
                    <img id="imgPreview" class="hidden max-w-full max-h-[400px] object-contain">
                    <div id="scanLine" class="scanner"></div>
                </div>
                
                <button id="convertBtn" class="w-full mt-6 bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-purple-900/20 active:scale-[0.98]">
                    KODU OLUŞTUR (CLAUDE)
                </button>
            </div>

            <div class="glass rounded-2xl overflow-hidden flex flex-col border border-zinc-800 shadow-2xl min-h-[500px]">
                <div class="flex bg-zinc-900 p-1">
                    <button id="btnPreview" class="flex-1 py-2 text-xs font-bold bg-zinc-800 text-white rounded-md shadow-sm">ÖNİZLEME</button>
                    <button id="btnCode" class="flex-1 py-2 text-xs font-bold text-zinc-500 hover:text-zinc-300 transition">KOD ÇIKTISI</button>
                </div>
                
                <div id="contentArea" class="flex-grow bg-white relative">
                    <div id="loading" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-50 text-center p-6">
                        <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p class="text-purple-400 font-mono text-sm">Claude pikselleri analiz ediyor...</p>
                    </div>
                    
                    <iframe id="outputFrame" class="w-full h-full border-none"></iframe>
                    <textarea id="outputCode" class="hidden absolute inset-0 w-full h-full bg-[#1e1e1e] text-emerald-400 p-6 font-mono text-xs outline-none" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const imgPreview = document.getElementById('imgPreview');
        const placeholder = document.getElementById('placeholder');
        const scanLine = document.getElementById('scanLine');
        const convertBtn = document.getElementById('convertBtn');
        const loading = document.getElementById('loading');
        const outputFrame = document.getElementById('outputFrame');
        const outputCode = document.getElementById('outputCode');

        dropZone.onclick = () => imageInput.click();

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                imgPreview.src = URL.createObjectURL(file);
                imgPreview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            }
        };

        convertBtn.onclick = async () => {
            const file = imageInput.files[0];
            if(!file) return alert("Lütfen bir görsel yükleyin!");

            loading.classList.remove('hidden');
            scanLine.style.display = 'block';
            convertBtn.disabled = true;

            try {
                // Claude 3.5 Sonnet modeline özel yapılandırılmış prompt
                const prompt = `
                    Görseldeki web tasarımını birebir HTML ve Tailwind CSS koduna dönüştür. 
                    - Sadece temiz HTML kodu ver.
                    - CSS için Tailwind CDN kullan.
                    - Görseldeki her bir butonu, başlığı ve düzeni piksel düzeyinde taklit etmeye çalış.
                    - Metin içeriğini görsele sadık kalarak aktar.
                    - Markdown ( \`\`\` ) kullanmadan sadece ham kodu döndür.
                `;

                // Puter üzerinden Claude 3.5 Sonnet çağrısı
                const response = await puter.ai.chat(prompt, file, { 
                    model: 'claude-3-5-sonnet' 
                });

                const rawContent = response.message.content;
                // Markdown bloklarını temizle (eğer gelirse)
                const cleanCode = rawContent.replace(/```html|```/g, "").trim();

                outputCode.value = cleanCode;
                const blob = new Blob([cleanCode], { type: 'text/html' });
                outputFrame.src = URL.createObjectURL(blob);

            } catch (err) {
                console.error(err);
                alert("Hata oluştu: " + err.message);
            } finally {
                loading.classList.add('hidden');
                scanLine.style.display = 'none';
                convertBtn.disabled = false;
            }
        };

        // Tab Değişimi
        document.getElementById('btnPreview').onclick = () => {
            outputFrame.classList.remove('hidden');
            outputCode.classList.add('hidden');
            document.getElementById('btnPreview').className = "flex-1 py-2 text-xs font-bold bg-zinc-800 text-white rounded-md shadow-sm";
            document.getElementById('btnCode').className = "flex-1 py-2 text-xs font-bold text-zinc-500 hover:text-zinc-300 transition";
        };
        document.getElementById('btnCode').onclick = () => {
            outputCode.classList.remove('hidden');
            outputFrame.classList.add('hidden');
            document.getElementById('btnCode').className = "flex-1 py-2 text-xs font-bold bg-zinc-800 text-white rounded-md shadow-sm";
            document.getElementById('btnPreview').className = "flex-1 py-2 text-xs font-bold text-zinc-500 hover:text-zinc-300 transition";
        };
    </script>
</body>
</html>
