<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI vs AI: Grand Debate</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 300px); }
        .gpt-bubble { background: #10a37f20; border-left: 4px solid #10a37f; }
        .claude-bubble { background: #d9770620; border-left: 4px solid #d97706; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-tighter text-white">AI <span class="text-zinc-500">TALK</span> AI</h1>
            <p class="text-zinc-400 mt-2">GPT-4o ve Claude 3.5 Sonnet birbirleriyle konuşuyor</p>
        </div>

        <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 mb-6 flex gap-4">
            <input type="text" id="topicInput" placeholder="Tartışma konusu girin (örn: Mars'ta koloni kurmak mantıklı mı?)" 
                   class="flex-grow bg-zinc-800 border border-zinc-700 rounded-xl px-4 outline-none focus:border-blue-500 transition">
            <button id="startBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-3 rounded-xl transition-all">
                BAŞLAT
            </button>
            <button id="stopBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold px-8 py-3 rounded-xl transition-all hidden">
                DURDUR
            </button>
        </div>

        <div id="chatBox" class="chat-container bg-zinc-900/50 rounded-2xl border border-zinc-800 overflow-y-auto p-6 space-y-6">
            <div class="text-center text-zinc-600 italic">Tartışmayı başlatmak için bir konu girin...</div>
        </div>
    </div>

    <script>
        let isRunning = false;
        const chatBox = document.getElementById('chatBox');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const topicInput = document.getElementById('topicInput');

        async function addMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = `p-4 rounded-xl ${type === 'gpt' ? 'gpt-bubble' : 'claude-bubble'} animate-in fade-in duration-500`;
            div.innerHTML = `
                <div class="flex justify-between mb-2">
                    <span class="font-bold text-xs uppercase tracking-widest ${type === 'gpt' ? 'text-emerald-400' : 'text-amber-400'}">${sender}</span>
                    <span class="text-[10px] text-zinc-500">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="text-sm leading-relaxed">${text}</div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function startConversation() {
            const topic = topicInput.value;
            if (!topic) return alert("Bir konu girin!");

            isRunning = true;
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            chatBox.innerHTML = '';

            let lastResponse = `Tartışma konusu: ${topic}. Lütfen bu konudaki fikirlerini belirt.`;
            let turn = 'gpt'; // GPT başlar

            while (isRunning) {
                try {
                    if (turn === 'gpt') {
                        const response = await puter.ai.chat(
                            `Sen GPT-4o'sun. Karşında Claude 3.5 var. Şu mesaja cevap ver ve tartışmayı sürdür: ${lastResponse}`,
                            { model: 'gpt-4o' }
                        );
                        lastResponse = response.message.content;
                        await addMessage("GPT-4o", lastResponse, 'gpt');
                        turn = 'claude';
                    } else {
                        const response = await puter.ai.chat(
                            `Sen Claude 3.5'sin. Karşında GPT-4o var. Şu argümanı analiz et ve karşı fikir sun: ${lastResponse}`,
                            { model: 'claude-3-5-sonnet' }
                        );
                        lastResponse = response.message.content;
                        await addMessage("Claude 3.5", lastResponse, 'claude');
                        turn = 'gpt';
                    }

                    // AI'ların çok hızlı konuşup API limitlerini tüketmemesi için kısa bir mola
                    await new Promise(resolve => setTimeout(resolve, 2000));

                } catch (err) {
                    console.error(err);
                    addMessage("SİSTEM", "Bağlantı hatası oluştu.", "error");
                    isRunning = false;
                }
            }
        }

        startBtn.onclick = startConversation;
        stopBtn.onclick = () => {
            isRunning = false;
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            addMessage("SİSTEM", "Tartışma kullanıcı tarafından durduruldu.", "gpt");
        };
    </script>
</body>
</html>
