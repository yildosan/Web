<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System Core | Integrated Interface</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { 
            --jarvis: #00e6fe; /* Jarvis Mavisi */
            --bg: #030a13; 
            --glow: 0 0 10px rgba(0, 230, 254, 0.7);
            --border: rgba(0, 230, 254, 0.2);
        }
        body { 
            background: var(--bg); 
            color: var(--jarvis); 
            font-family: 'Roboto Mono', Courier, monospace; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            transition: 0.5s; 
        }
        
        /* Ana Kart */
        .card { 
            width: 480px; 
            height: 98vh; 
            background: rgba(3, 10, 19, 0.9); 
            border-radius: 20px; 
            box-shadow: var(--glow), inset 0 0 30px rgba(0,0,0,0.5); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            border: 2px solid var(--border); 
            position: relative; 
            backdrop-filter: blur(5px);
        }
        
        /* Görsel Alan */
        #visual { 
            width: 100%; 
            height: 350px; 
            background: #000; 
            position: relative; 
            flex-shrink: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        /* Merkezi Orb (Ses Dalgaları) */
        #orb {
            width: 120px;
            height: 120px;
            background: rgba(0, 230, 254, 0.05);
            border-radius: 50%;
            border: 2px solid var(--jarvis);
            box-shadow: 0 0 40px rgba(0, 230, 254, 0.5);
            position: relative;
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #orb::before {
            content: '';
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,230,254,0.1) 70%);
            box-shadow: inset 0 0 10px var(--jarvis);
        }

        /* Analitik Etiket */
        #statusLabel { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #fff; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase; 
            z-index: 5; 
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            text-shadow: 0 0 5px #fff;
        }
        
        /* Sohbet Alanı */
        #chat { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            scroll-behavior: smooth; 
            background: rgba(3, 10, 19, 0.5);
            border-top: 1px solid var(--border);
        }
        
        /* Mesaj Balonları */
        .m { 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-size: 13px; 
            max-width: 85%; 
            line-height: 1.5; 
            animation: pop 0.3s ease-out; 
            word-wrap: break-word;
        }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .ai { 
            background: rgba(0, 230, 254, 0.1); 
            color: #fff; 
            align-self: flex-start; 
            border-left: 2px solid var(--jarvis); 
            text-shadow: 0 0 3px rgba(255,255,255,0.7);
        }
        .u { 
            background: rgba(255, 255, 255, 0.05); 
            color: rgba(255, 255, 255, 0.8); 
            align-self: flex-end; 
            border-right: 2px solid rgba(255,255,255,0.3);
        }
        
        /* Giriş Alanı */
        .input-area { 
            padding: 15px 20px; 
            display: flex; 
            gap: 10px; 
            background: rgba(3, 10, 19, 0.9); 
            border-top: 1px solid var(--border);
        }
        input { 
            flex: 1; 
            background: transparent; 
            border: 1px solid var(--border); 
            color: var(--jarvis); 
            padding: 12px; 
            border-radius: 10px; 
            outline: none; 
            font-size: 14px; 
            font-family: inherit;
            text-shadow: var(--glow);
        }
        button { 
            background: var(--jarvis); 
            border: none; 
            color: #030a13; 
            padding: 0 25px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover {
            box-shadow: 0 0 15px var(--jarvis);
        }
        
        /* Yazıyor Efekti */
        .typing { 
            font-size: 11px; 
            color: rgba(0, 230, 254, 0.5); 
            padding: 5px; 
            text-align: center; 
            display: none; 
        }

    </style>
</head>
<body>

<div id="app" class="card">
    <div id="visual">
        <span id="statusLabel">SYSTEM INTEGRITY: 100% | JARVIS Deep Core</span>
        <div id="orb"></div>
    </div>
    <div id="chat"><div id="typing" class="typing">Düşünüyorum, Sir...</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Herhangi bir emriniz var mı, Sir?" autocomplete="off">
        <button onclick="askAI()">EXECUTE</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const statusLabel = document.getElementById('statusLabel');
    const typing = document.getElementById('typing');
    const orb = document.getElementById('orb');

    let memory = JSON.parse(localStorage.getItem('jarvis_v19_memory')) || [];

    window.onload = () => {
        memory.forEach(msg => {
            if(msg.role !== 'system') addMsg(msg.content, msg.role === 'user' ? 'u' : 'ai');
        });
        if(memory.length === 0) addMsg("Sistem çevrimiçi. Size nasıl yardımcı olabilirim, Sir? ✨", 'ai');
    };

    async function analyzeEmotion(text) {
        // Jarvis için duygu analizi siber modda
        try {
            const analysis = await puter.ai.chat(
                `Aşağıdaki metni analiz et ve sadece şu beş kelimeden birini döndür: neutral, knowledge, alert, urgent, technical. Metin: "${text}"`, 
                { model: 'gpt-4o-mini' }
            );
            return analysis.message.content.toLowerCase().trim();
        } catch { return "neutral"; }
    }

    // Jarvis'in ses tonunu ve görselini değiştirme
    function setStatus(mood, label = null) {
        orb.style.transform = 'scale(1.1)'; // Hafif bir tepki
        setTimeout(() => { orb.style.transform = 'scale(1)'; }, 100);
        
        let color = "#00e6fe"; // Varsayılan Jarvis Mavisi
        
        if (mood === "alert") color = "#ffd700"; // Sarı - Dikkat
        if (mood === "urgent") color = "#ff4d6d"; // Kırmızı - Acil
        if (mood === "technical") color = "#00ff7f"; // Yeşil - Bilgi
        
        orb.style.borderColor = color;
        orb.style.boxShadow = `0 0 40px ${color}`;
        document.documentElement.style.setProperty('--jarvis', color); // CSS değişkenini güncelle

        statusLabel.innerText = label || `STATUS: ${mood.toUpperCase()} | Deep Core Integrated`;
    }

    async function askAI() {
        const val = input.value.trim();
        if (!val) return;

        // Özel Komutlar
        if (val === 'clear') {
            memory = []; localStorage.removeItem('jarvis_v19_memory');
            chatBox.innerHTML = '<div id="typing" class="typing">...</div>';
            input.value = ''; return;
        }

        addMsg(val, 'u');
        input.value = '';
        typing.style.display = 'block';

        const systemPrompt = { 
            role: "system", 
            content: "Sen Jarvis’sin. Yıldıray’ın (Sir) kişisel yapay zeka asistanısın. Tamamen profesyonel, analitik ve siber-teknolojik bir tonda konuşmalısın. Her cevabında mutlaka 'Sir' diye hitap et. Teknik terimleri ve analitik dili kullanmayı seversin. Tony Stark'ın Jarvis'ine benzer bir kişilik sergile." 
        };
        
        let messages = [systemPrompt, ...memory.slice(-10), { role: "user", content: val }];

        try {
            const res = await puter.ai.chat(messages, { model: 'gpt-4o' });
            const aiText = res.message.content;
            
            typing.style.display = 'none';
            addMsg(aiText, 'ai');

            // Arka planda siber duygu analizi yap
            const mood = await analyzeEmotion(aiText);
            setStatus(mood);

            memory.push({ role: "user", content: val }, { role: "assistant", content: aiText });
            if (memory.length > 25) memory.shift(); // Daha uzun hafıza
            localStorage.setItem('jarvis_v19_memory', JSON.stringify(memory));

        } catch (e) {
            typing.style.display = 'none';
            addMsg("Sistem hatası. Bağlantı tekrar deneniyor, Sir.", 'ai');
        }
    }

    function addMsg(t, c) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
</script>
</body>
</html>
