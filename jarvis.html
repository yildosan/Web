<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v20.2 | Link Fix Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --jarvis: #00e6fe; --bg: #030a13; --border: rgba(0, 230, 254, 0.2); }
        body { background: var(--bg); color: var(--jarvis); font-family: 'Roboto Mono', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { width: 550px; height: 95vh; background: rgba(3, 10, 19, 0.95); border-radius: 20px; box-shadow: 0 0 30px rgba(0, 230, 254, 0.3); display: flex; flex-direction: column; border: 2px solid var(--border); position: relative; }
        #visual { height: 180px; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border); }
        #orb { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--jarvis); box-shadow: 0 0 20px var(--jarvis); position: relative; }
        #orb::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 1px solid var(--jarvis); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .m { padding: 12px 18px; border-radius: 12px; font-size: 13px; max-width: 85%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .ai { background: rgba(0, 230, 254, 0.08); border-left: 3px solid var(--jarvis); align-self: flex-start; }
        .u { background: rgba(255, 255, 255, 0.05); align-self: flex-end; color: #fff; }
        /* Link Butonu Stili */
        .link-btn { display: inline-block; margin: 10px 5px 0 0; padding: 8px 15px; background: var(--jarvis); color: #000; text-decoration: none; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid transparent; }
        .link-btn:hover { background: #fff; box-shadow: 0 0 15px var(--jarvis); }
        .input-area { padding: 20px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--jarvis); padding: 12px; border-radius: 10px; outline: none; }
        button { background: var(--jarvis); border: none; color: #000; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .status { position: absolute; top: 15px; left: 20px; font-size: 10px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="card">
    <div id="visual">
        <div class="status" id="sysStatus">SYSTEM: READY</div>
        <div id="orb"></div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şey emredin, Sir..." autocomplete="off">
        <button onclick="askAI()">EXECUTE</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const sysStatus = document.getElementById('sysStatus');
    let memory = [];

    // Linkleri tespit edip butona çeviren fonksiyon
    function formatLinks(text) {
        // Markdown [Text](URL) formatını yakalar
        const markdownLink = /\[([^\]]+)\]\(([^)]+)\)/g;
        // Ham URL'leri yakalar (http/https ile başlayan)
        const rawUrl = /(https?:\/\/[^\s]+)/g;

        let formatted = text.replace(markdownLink, (match, title, url) => {
            // Eğer link geçici bir proxy linkiyse AI'ya tekrar sormasını söyleyen bir not ekleyebiliriz
            if(url.includes("googleusercontent")) return `<em>(Veri çekiliyor...)</em>`;
            return `<a href="${url}" target="_blank" class="link-btn">🔗 ${title}</a>`;
        });

        return formatted;
    }

    async function askAI() {
        const val = input.value.trim();
        if (!val) return;

        addMsg(val, 'u');
        input.value = '';
        sysStatus.innerText = "SYSTEM: SEARCHING REAL-TIME DATA...";

        try {
            const res = await puter.ai.chat([
                { 
                    role: "system", 
                    content: `Sen Jarvis'sin. Sir'e (Yıldıray) hizmet ediyorsun. 
                    KRİTİK TALİMAT: Web sonuçlarında gelen 'googleusercontent.com' linklerini ASLA kullanma. 
                    Bunlar yerine bulduğun içeriğin asıl kaynağındaki (YouTube.com, Maps.google.com, vb.) GERÇEK URL'leri bulmaya çalış. 
                    Eğer sadece proxy linki bulabiliyorsan, Sir'e linki doğrudan veremediğini ama içeriği açıklayabileceğini söyle. 
                    Gerçek linkleri '[Başlık](URL)' formatında ver. Hitap: Sir.` 
                },
                ...memory,
                { role: "user", content: val }
            ], {
                model: 'gpt-4o',
                web_browser: true 
            });

            const reply = res.message.content;
            addMsg(formatLinks(reply), 'ai', true);

            memory.push({ role: "user", content: val }, { role: "assistant", content: reply });
            if(memory.length > 10) memory.splice(0, 2);
            sysStatus.innerText = "SYSTEM: READY";

        } catch (e) {
            sysStatus.innerText = "SYSTEM: ERROR";
            addMsg("Bağlantı hatası, Sir. Tekrar denemek ister misiniz?", 'ai');
        }
    }

    function addMsg(t, c, isHTML = false) {
        const d = document.createElement('div');
        d.className = `m ${c}`;
        if(isHTML) d.innerHTML = t;
        else d.innerText = t;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') askAI(); };
    window.onload = () => addMsg("Sistem çevrimiçi. Veri tabanları ve web erişimi aktif, Sir.", 'ai');
</script>
</body>
</html>
