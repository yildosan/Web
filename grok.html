<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter.js + Grok Chatbot</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col justify-between font-sans">

    <header class="bg-gray-800 p-4 text-center border-b border-gray-700 shadow-md">
        <h1 class="text-xl font-bold text-indigo-400 tracking-wide">Grok AI Assistant</h1>
        <p class="text-xs text-gray-400 mt-1">Powered by Puter.js</p>
    </header>

    <main id="chat-window" class="chat-scroll flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start gap-2.5">
            <div class="bg-indigo-600 text-white p-3 rounded-lg rounded-tl-none shadow max-w-[80%]">
                <p class="text-sm">Merhaba! Ben Grok. Bugün sana nasıl yardımcı olabilirim?</p>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-gray-800 border-t border-gray-700 sticky bottom-0">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Grok'a bir şeyler sorun..." 
                autocomplete="off"
                class="flex-1 bg-gray-700 text-white placeholder-gray-400 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none p-3"
                required
            >
            <button 
                type="submit" 
                id="send-btn"
                class="inline-flex justify-center p-3 text-indigo-400 hover:text-indigo-200 font-bold bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors duration-200"
            >
                Gönder
            </button>
        </form>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        // Mesaj geçmişini hafızada tutmak için array (Grok'un bağlamı hatırlamasını sağlar)
        let messageHistory = [];

        // Mesajı ekrana yazdırma fonksiyonu
        function appendMessage(text, isUser = false) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = isUser ? "flex items-start justify-end gap-2.5" : "flex items-start gap-2.5";

            const messageBox = document.createElement('div');
            messageBox.className = isUser 
                ? "bg-gray-700 text-gray-100 p-3 rounded-lg rounded-tr-none shadow max-w-[80%] text-sm" 
                : "bg-indigo-600 text-white p-3 rounded-lg rounded-tl-none shadow max-w-[80%] text-sm";
            
            messageBox.innerText = text;
            messageWrapper.appendChild(messageBox);
            chatWindow.appendChild(messageWrapper);
            
            // Otomatik aşağı kaydır
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Form gönderildiğinde
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = userInput.value.trim();
            if (!message) return;

            // Kullanıcı mesajını ekle ve inputu temizle
            appendMessage(message, true);
            userInput.value = '';

            // Geçmişe ekle
            messageHistory.push({ role: 'user', content: message });

            // Loading göstergesi ekle
            const loadingWrapper = document.createElement('div');
            loadingWrapper.className = "flex items-start gap-2.5 opacity-50";
            loadingWrapper.innerHTML = `<div class="bg-indigo-800 p-3 rounded-lg rounded-tl-none text-sm animate-pulse">Grok düşünüyor...</div>`;
            chatWindow.appendChild(loadingWrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                // Puter.js chat servisi çağrısı (Chat geçmişini ve güncel modeli gönderiyoruz)
                const response = await puter.ai.chat(messageHistory, { model: 'grok-2' });
                
                // Loading'i kaldır
                chatWindow.removeChild(loadingWrapper);

                const botResponse = response.message.content;
                
                // Bot yanıtını ekrana yazdır ve geçmişe kaydet
                appendMessage(botResponse);
                messageHistory.push({ role: 'assistant', content: botResponse });

            } catch (error) {
                console.error("Puter Error:", error);
                chatWindow.removeChild(loadingWrapper);
                appendMessage("Üzgünüm, bir hata oluştu. Model ismi veya API yapısı değişmiş olabilir.", false);
            }
        });
    </script>
</body>
</html>
