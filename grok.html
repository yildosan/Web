<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Live Voice & Mind Bot</title>
    <!-- Puter.js SDK -->
    <script src="https://js.puter.com/v2/"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 20px;
        }
        /* Canlı dinleme animasyonu */
        .pulse-ring {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.15); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 shadow-md shrink-0 flex flex-col sm:flex-row justify-between items-center gap-2">
        <div class="text-center sm:text-left">
            <h1 class="text-lg font-bold text-indigo-400 tracking-wide">🎙️ Grok Live Voice Bot</h1>
            <p class="text-xs text-gray-400 mt-0.5">Gerçek Zamanlı Canlı Sesli Sohbet (Live Mode)</p>
        </div>
        
        <!-- Ses Kontrolü ve Paneller -->
        <div class="flex items-center gap-3">
            <span id="live-indicator" class="hidden bg-red-600/20 text-red-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-red-500/30 animate-pulse flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-red-500"></span> LIVE AKTİF
            </span>
            <button id="toggle-voice-btn" class="bg-gray-700 hover:bg-gray-600 text-indigo-300 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-colors">
                <span id="voice-icon">🔊</span> <span id="voice-status-text">Karakter Sesi Açık</span>
            </button>
            <div class="flex gap-1.5 sm:hidden">
                <button onclick="togglePanel('left-panel')" class="bg-gray-700 px-2.5 py-1.5 rounded text-xs font-semibold text-indigo-300">🎭 Kimlik</button>
                <button onclick="togglePanel('right-panel')" class="bg-gray-700 px-2.5 py-1.5 rounded text-xs font-semibold text-indigo-300">📜 Geçmiş</button>
            </div>
        </div>
    </header>

    <!-- Ana Panel Düzeni -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- SOL PANEL: Karakter Kimlik Paneli -->
        <aside id="left-panel" class="hidden sm:flex w-full sm:w-80 bg-gray-850 border-r border-gray-700 p-4 flex-col gap-4 custom-scroll overflow-y-auto shrink-0 absolute sm:relative z-20 h-full sm:h-auto left-0 top-0">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                <h2 class="text-md font-bold text-indigo-400">🎭 Karakter Kimliği</h2>
                <button onclick="togglePanel('left-panel')" class="sm:hidden text-xs text-red-400 font-bold">Kapat</button>
            </div>
            
            <!-- İnternetten Karakter Arama Alanı -->
            <div class="bg-gray-800 p-3 rounded border border-indigo-500/30">
                <label class="block text-xs text-indigo-300 mb-1 font-semibold">🔍 İnternetten Karakter Ara:</label>
                <div class="flex gap-1">
                    <input type="text" id="search-query" placeholder="Örn: Elon Musk" class="flex-1 bg-gray-700 p-1.5 text-xs rounded border border-gray-600 focus:outline-none text-white">
                    <button type="button" id="search-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 rounded font-medium transition-colors">Bul</button>
                </div>
                <p id="search-status" class="text-[10px] text-gray-400 mt-1 hidden"></p>
            </div>

            <div class="flex flex-col gap-3 text-sm">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Adı:</label>
                    <input type="text" id="char-name" value="Rias" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-indigo-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Soyadı:</label>
                    <input type="text" id="char-surname" value="Gremory" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-indigo-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Yaş:</label>
                    <input type="text" id="char-age" value="18" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-indigo-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Cinsiyet:</label>
                    <select id="char-gender" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-indigo-500 text-xs text-white">
                        <option value="female" selected>Kadın (Female)</option>
                        <option value="male">Erkek (Male)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Meslek / Rol:</label>
                    <input type="text" id="char-job" value="Kulüp Başkanı" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-indigo-500 text-xs">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Genel Tanım / Kişilik:</label>
                    <textarea id="char-desc" rows="4" class="w-full bg-gray-700 p-2 rounded border border-gray-600 focus:outline-none focus:border-indigo-500 text-xs resize-none">Asil, lider ruhlu, korumacı ve sadık bir karakter. Kullanıcıya yakın ve samimi bir hitap şekli kullanır.</textarea>
                </div>
                <button id="save-persona-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded text-xs transition-colors duration-200">
                    Kimliği Güncelle ve Kaydet
                </button>
            </div>
        </aside>

        <!-- ORTA PANEL: Chat Penceresi -->
        <main class="flex-1 flex flex-col justify-between bg-gray-900 relative w-full">
            <div id="chat-window" class="custom-scroll flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl w-full mx-auto">
                <!-- Mesajlar dinamik gelir -->
            </div>

            <!-- Giriş Alanı ve Mikrofon Butonu -->
            <footer class="p-3 bg-gray-800 border-t border-gray-700 sticky bottom-0">
                <div class="max-w-2xl mx-auto flex items-center gap-2">
                    
                    <!-- CANLI MİKROFON BUTONU -->
                    <button 
                        type="button" 
                        id="mic-btn" 
                        class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full focus:outline-none transition-all relative flex items-center justify-center shrink-0"
                        title="Canlı Konuşmayı Başlat / Durdur"
                    >
                        <span id="mic-icon" class="text-lg">🎤</span>
                        <!-- Pulsing Halka Efekti -->
                        <span id="mic-pulse" class="hidden absolute inset-0 rounded-full border border-red-500 bg-red-500/20 pulse-ring"></span>
                    </button>

                    <form id="chat-form" class="flex-1 flex gap-2">
                        <input 
                            type="text" 
                            id="user-input" 
                            placeholder="Konuşmak için mikrofonu kullanın veya yazın..." 
                            autocomplete="off"
                            class="flex-1 bg-gray-700 text-white placeholder-gray-400 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none p-2.5"
                            required
                        >
                        <button type="submit" class="px-4 py-2.5 text-indigo-400 hover:text-indigo-200 text-sm font-bold bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">
                            Gönder
                        </button>
                    </form>
                </div>
            </footer>
        </main>

        <!-- SAĞ PANEL: Sohbet Geçmişi / Sekmeler -->
        <aside id="right-panel" class="hidden sm:flex w-full sm:w-64 bg-gray-850 border-l border-gray-700 p-4 flex-col gap-4 custom-scroll overflow-y-auto shrink-0 absolute sm:relative z-20 h-full sm:h-auto right-0 top-0">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                <h2 class="text-md font-bold text-indigo-400">📜 Eski Sohbetler</h2>
                <div class="flex gap-2">
                    <button id="new-chat-btn" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-indigo-300 font-bold">+</button>
                    <button onclick="togglePanel('right-panel')" class="sm:hidden text-xs text-red-400 font-bold">Kapat</button>
                </div>
            </div>
            <div id="history-list" class="flex flex-col gap-2 text-sm">
                <!-- Kayıtlı sekmeler -->
            </div>
        </aside>

    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('history-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const savePersonaBtn = document.getElementById('save-persona-btn');
        const searchBtn = document.getElementById('search-btn');
        const searchQuery = document.getElementById('search-query');
        const searchStatus = document.getElementById('search-status');
        const toggleVoiceBtn = document.getElementById('toggle-voice-btn');
        const voiceIcon = document.getElementById('voice-icon');
        const voiceStatusText = document.getElementById('voice-status-text');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const micPulse = document.getElementById('mic-pulse');
        const liveIndicator = document.getElementById('live-indicator');

        const cName = document.getElementById('char-name');
        const cSurname = document.getElementById('char-surname');
        const cAge = document.getElementById('char-age');
        const cGender = document.getElementById('char-gender');
        const cJob = document.getElementById('char-job');
        const cDesc = document.getElementById('char-desc');

        let currentSessionId = null;
        let allSessions = JSON.parse(localStorage.getItem('grok_live_voice_sessions')) || {};
        let chatHistory = [];
        let voiceEnabled = true;
        
        // Ses Tanıma (Speech-to-Text) Entegrasyonu
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Kullanıcı durunca otomatik kesilsin
            recognition.interimResults = false;
            recognition.lang = 'tr-TR'; // Türkçe öncelikli tanıma

            recognition.onstart = () => {
                isListening = true;
                micIcon.innerText = "🛑";
                micPulse.classList.remove('hidden');
                liveIndicator.classList.remove('hidden');
                userInput.placeholder = "Sizi dinliyorum, konuşun...";
            };

            recognition.onend = () => {
                isListening = false;
                micIcon.innerText = "🎤";
                micPulse.classList.add('hidden');
                liveIndicator.classList.add('hidden');
                userInput.placeholder = "Konuşmak için mikrofonu kullanın veya yazın...";
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                if(speechToText.trim() !== "") {
                    userInput.value = speechToText;
                    // Canlı modda doğrudan mesajı gönder
                    chatForm.requestSubmit();
                }
            };

            recognition.onerror = (event) => {
                console.error("Ses tanıma hatası: ", event.error);
                stopListening();
            };
        } else {
            micBtn.style.display = "none";
            console.warn("Tarayıcı ses tanıma (Speech-to-Text) teknolojisini desteklemiyor.");
        }

        function startListening() {
            if (recognition) {
                window.speechSynthesis.cancel(); // Bot konuşuyorsa sustur
                recognition.start();
            }
        }

        function stopListening() {
            if (recognition && isListening) {
                recognition.stop();
            }
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        // PANEL GEÇİŞLERİ (Mobil)
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            if(panel.classList.contains('hidden')) {
                document.getElementById('left-panel').classList.add('hidden');
                document.getElementById('right-panel').classList.add('hidden');
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        }

        // SES AÇ / KAPAT SİSTEMİ
        toggleVoiceBtn.addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            if(!voiceEnabled) {
                window.speechSynthesis.cancel();
                voiceIcon.innerText = "🔇";
                voiceStatusText.innerText = "Ses Kapalı";
                toggleVoiceBtn.classList.replace('text-indigo-300', 'text-gray-400');
            } else {
                voiceIcon.innerText = "🔊";
                voiceStatusText.innerText = "Karakter Sesi Açık";
                toggleVoiceBtn.classList.replace('text-gray-400', 'text-indigo-300');
            }
        });

        // LIVE MODE TTS (Sıfır Gecikmeli Doğal Ses Sentezi)
        function speakLive(text) {
            if (!voiceEnabled) return;
            window.speechSynthesis.cancel(); // Önceki ses kuyruğunu temizle

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();

            const isFemale = cGender.value === 'female';
            const age = parseInt(cAge.value) || 20;

            // Dil seçimi tespiti
            const containsTurkish = /[çğıöşüÇĞİÖŞÜ]/.test(text) || text.length < 5;
            const langCode = containsTurkish ? 'tr-TR' : 'en-US';
            utterance.lang = langCode;

            const filteredVoices = voices.filter(v => v.lang.startsWith(langCode.split('-')[0]));
            let selectedVoice = null;

            if (filteredVoices.length > 0) {
                if (isFemale) {
                    selectedVoice = filteredVoices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('yelda') || v.name.toLowerCase().includes('susan') || v.name.toLowerCase().includes('zira')) || filteredVoices[0];
                } else {
                    selectedVoice = filteredVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('tolga') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('cem')) || filteredVoices[0];
                }
            }

            if (selectedVoice) utterance.voice = selectedVoice;

            // Yaş ve canlandırmaya göre tonlama ayarı
            if (age < 16) {
                utterance.pitch = 1.35;
                utterance.rate = 1.05;
            } else if (age > 60) {
                utterance.pitch = 0.8;
                utterance.rate = 0.85;
            } else {
                utterance.pitch = isFemale ? 1.15 : 0.95;
                utterance.rate = 1.0;
            }

            // Canlı mod akışı bittiğinde kullanıcıyı tekrar dinlemeye başla (Hands-free Live Modu)
            utterance.onend = () => {
                if (voiceEnabled && !isListening && document.activeElement !== userInput) {
                    // Bot konuşmasını bitirdikten 300ms sonra mikrofonu canlandır
                    setTimeout(startListening, 300);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.onvoiceschanged = () => {
            console.log("Ses motorları güncellendi.");
        };

        // GİZLİ SİSTEM TALİMATI
        function buildSystemInstruction() {
            return {
                role: 'system',
                content: `Sen yapay zeka değilsin. Rolünü asla bozma. Şu karakter kimliğine tamamen bürünerek konuşacaksın:
                Ad: ${cName.value}
                Soyad: ${cSurname.value}
                Yaş: ${cAge.value}
                Meslek/Rol: ${cJob.value}
                Kişilik ve Genel Tanım: ${cDesc.value}
                
                LORE SENSÖRÜ VE İNTERNET KURALI: 
                1. Sana tanımlanan internet arama (web_search) aracını SADECE canlandırdığın karakterin kendi evreni, kendi biyografisi, kendi şirketleri/projeleri ya da hikayesindeki diğer karakterlerle ilgili detayları doğrulamak veya hatırlamak için kullanabilirsin.
                2. Canlandırdığın karakterin hayatı veya evreniyle hiçbir bağı olmayan genel dünya gündemi hakkında internet araması YAPMA. Bu tarz alakasız konuları bilmiyormuş gibi yap ve karakterinin mizacına uygun şekilde konuyu geçiştir.
                3. Arama yaptığını kesinlikle gizle. Bilgileri kendi öz hafızandan aktarır gibi, tamamen doğal bir üslupla konuşmaya dahil et.
                
                KESİN LİNK YASAĞI:
                Kullanıcı senden kelimesi kelimesine açıkça ve doğrudan "bana link ver", "bana URL gönder" ya da "kaynak sitesini yaz" demediği sürece, yanıtlarının hiçbir aşamasında ASLA URL veya link paylaşmayacaksın. Tüm web kaynaklarını gizli tut.
                
                SES VE CANLI SOHBET KURALI:
                Senin yanıtların doğrudan ses motoruyla okunacağı ve kullanıcıyla CANLI sesli konuşma içinde olduğun için yanıtlarını kesinlikle çok kısa, öz ve akıcı tut (en fazla 2-3 cümle). Asla listeleme, Markdown formatı, yıldız (*) simgeleri veya kod bloğu kullanma. Tamamen günlük bir sesli diyalog gibi cevap ver.`
            };
        }

        function appendMessage(text, isUser = false) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = isUser ? "flex items-start justify-end gap-2.5" : "flex items-start gap-2.5";

            const messageBox = document.createElement('div');
            messageBox.className = isUser 
                ? "bg-gray-700 text-gray-100 p-3 rounded-lg rounded-tr-none shadow max-w-[80%] text-sm" 
                : "bg-indigo-600 text-white p-3 rounded-lg rounded-tl-none shadow max-w-[80%] text-sm";
            
            messageBox.innerText = text;
            messageWrapper.appendChild(messageBox);
            chatWindow.appendChild(messageWrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Karakter Arama Motoru
        searchBtn.addEventListener('click', async () => {
            const q = searchQuery.value.trim();
            if(!q) return;

            searchStatus.classList.remove('hidden');
            searchStatus.innerText = "Evren taranıyor...";
            searchBtn.disabled = true;

            try {
                const instructions = `İnternet üzerinde şu karakteri araştır: "${q}". 
                Bilgileri bulduktan sonra bana SADECE aşağıdaki JSON formatında yanıt dön. Başka hiçbir açıklama ekleme, sadece saf JSON ver:
                {
                    "name": "Karakterin Adı",
                    "surname": "Karakterin Soyadı (yoksa boş bırak)",
                    "age": "Karakterin yaşı",
                    "gender": "female veya male girin",
                    "job": "Mesleği veya rolü",
                    "desc": "Kişilik analizi, konuşma üslubu ve genel tanımı."
                }`;

                const response = await puter.ai.chat(instructions, {
                    model: 'x-ai/grok-4-1-fast',
                    tools: [{ type: 'web_search' }]
                });

                const rawText = (response && response.message) ? response.message.content : response;
                const cleanJsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const data = JSON.parse(cleanJsonText);

                cName.value = data.name || '';
                cSurname.value = data.surname || '';
                cAge.value = data.age || '';
                cGender.value = data.gender === 'male' ? 'male' : 'female';
                cJob.value = data.job || '';
                cDesc.value = data.desc || '';

                searchStatus.innerText = "Karakter zihni hazır! Kaydet butonuna basın.";
                searchQuery.value = '';
            } catch (error) {
                console.error(error);
                searchStatus.innerText = "Hata oluştu, bilgileri kontrol edin.";
            } finally {
                searchBtn.disabled = false;
            }
        });

        function createNewSession() {
            currentSessionId = 'session_' + Date.now();
            chatHistory = [];
            
            const welcomeText = `Selam. Ben ${cName.value}. Seni dinliyorum.`;
            
            allSessions[currentSessionId] = {
                title: `${cName.value} (${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`,
                history: [{ role: 'assistant', content: welcomeText }],
                persona: { name: cName.value, surname: cSurname.value, age: cAge.value, gender: cGender.value, job: cJob.value, desc: cDesc.value }
            };
            
            saveToStorage();
            loadSession(currentSessionId);
        }

        function loadSession(id) {
            currentSessionId = id;
            chatWindow.innerHTML = '';
            
            const session = allSessions[id];
            chatHistory = session.history;

            if(session.persona) {
                cName.value = session.persona.name || '';
                cSurname.value = session.persona.surname || '';
                cAge.value = session.persona.age || '';
                cGender.value = session.persona.gender || 'female';
                cJob.value = session.persona.job || '';
                cDesc.value = session.persona.desc || '';
            }

            chatHistory.forEach(msg => {
                if(msg.role !== 'system') {
                    appendMessage(msg.content, msg.role === 'user');
                }
            });

            renderHistorySidebar();
        }

        function renderHistorySidebar() {
            historyList.innerHTML = '';
            Object.keys(allSessions).sort((a,b) => b.split('_')[1] - a.split('_')[1]).forEach(id => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-2 rounded text-xs truncate transition-all ${id === currentSessionId ? 'bg-indigo-600 text-white font-semibold' : 'bg-gray-800 hover:bg-gray-700 text-gray-300'}`;
                btn.innerText = allSessions[id].title;
                btn.addEventListener('click', () => {
                    loadSession(id);
                    if(window.innerWidth < 640) document.getElementById('right-panel').classList.add('hidden');
                });
                historyList.appendChild(btn);
            });
        }

        function saveToStorage() {
            localStorage.setItem('grok_live_voice_sessions', JSON.stringify(allSessions));
        }

        savePersonaBtn.addEventListener('click', () => {
            if(!currentSessionId) return;
            allSessions[currentSessionId].persona = {
                name: cName.value, surname: cSurname.value, age: cAge.value, gender: cGender.value, job: cJob.value, desc: cDesc.value
            };
            allSessions[currentSessionId].title = `${cName.value} (Live Mod)`;
            saveToStorage();
            renderHistorySidebar();
            
            chatWindow.innerHTML = '';
            const welcomeText = `Ben ${cName.value}. Canlı bağlantı kuruldu. Seni dinliyorum.`;
            chatHistory = [{ role: 'assistant', content: welcomeText }];
            allSessions[currentSessionId].history = chatHistory;
            saveToStorage();
            appendMessage(welcomeText, false);
            speakLive(welcomeText);

            if(window.innerWidth < 640) document.getElementById('left-panel').classList.add('hidden');
        });

        newChatBtn.addEventListener('click', () => {
            createNewSession();
            if(window.innerWidth < 640) document.getElementById('right-panel').classList.add('hidden');
        });

        // Chat Form Gönderimi
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message || !currentSessionId) return;

            stopListening();
            window.speechSynthesis.cancel(); // Kullanıcı araya girerse botu sustur

            appendMessage(message, true);
            userInput.value = '';

            chatHistory.push({ role: 'user', content: message });

            const loadingWrapper = document.createElement('div');
            loadingWrapper.className = "flex items-start gap-2.5 opacity-50";
            loadingWrapper.innerHTML = `<div class="bg-indigo-800 p-3 rounded-lg rounded-tl-none text-sm animate-pulse">...</div>`;
            chatWindow.appendChild(loadingWrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const apiPayload = [ buildSystemInstruction(), ...chatHistory ];
                
                const response = await puter.ai.chat(apiPayload, { 
                    model: 'x-ai/grok-4-1-fast',
                    tools: [{ type: 'web_search' }] 
                });
                
                chatWindow.removeChild(loadingWrapper);
                const botResponse = (response && response.message) ? response.message.content : response;

                appendMessage(botResponse, false);
                speakLive(botResponse); // Sıfır gecikmeli canlı seslendirme
                
                chatHistory.push({ role: 'assistant', content: botResponse });
                allSessions[currentSessionId].history = chatHistory;
                saveToStorage();

            } catch (error) {
                console.error(error);
                if (chatWindow.contains(loadingWrapper)) chatWindow.removeChild(loadingWrapper);
                appendMessage("Bağlantı kesildi.", false);
            }
        });

        if (Object.keys(allSessions).length > 0) {
            const lastSessionId = Object.keys(allSessions).sort((a,b) => b.split('_')[1] - a.split('_')[1])[0];
            loadSession(lastSessionId);
        } else {
            createNewSession();
        }
    </script>
</body>
</html>
