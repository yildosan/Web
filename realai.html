<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yüz → 3D Kafa</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #app{display:flex;height:100%}
  #left{width:340px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
  video{width:100%;border-radius:8px;transform:scaleX(-1);background:#000}
  button{padding:10px;border:0;border-radius:8px;background:#3b82f6;color:#fff;font-size:15px;cursor:pointer}
  button:disabled{background:#444;cursor:default}
  #status{font-size:13px;opacity:.8}
  #view{flex:1;min-width:0}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <video id="video" autoplay playsinline muted></video>
    <button id="capture" disabled>Yüzümü yakala</button>
    <button id="export" disabled>GLB olarak indir</button>
    <div id="status">Model yükleniyor…</div>
    <div style="font-size:12px;opacity:.6">Kameraya düz bak, nötr bir ifade ile yakala. Sonra fareyle 3D modeli döndür.</div>
  </div>
  <div id="view"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
import { Delaunay } from 'https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/+esm';

const $ = id => document.getElementById(id);
const video = $('video'), statusEl = $('status');
const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

// ---------- Three.js sahnesi ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1f);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
camera.position.set(0, 0, 3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(1, 1, 2); scene.add(key);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let headGroup = null;
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ---------- MediaPipe ----------
let landmarker;
try {
  const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
    },
    runningMode: 'VIDEO', numFaces: 1
  });
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  video.srcObject = stream;
  await video.play();
  $('capture').disabled = false;
  statusEl.textContent = 'Hazır. Yüzünü kadraja al ve yakala.';
} catch (e) {
  statusEl.textContent = 'Hata: ' + e.message + ' (localhost veya https gerekir)';
}

// ---------- Yakala + mesh kur ----------
$('capture').onclick = () => {
  const res = landmarker.detectForVideo(video, performance.now());
  if (!res.faceLandmarks.length) { statusEl.textContent = 'Yüz bulunamadı, tekrar dene.'; return; }
  buildHead(res.faceLandmarks[0].slice(0, 468));
  $('export').disabled = false;
  statusEl.textContent = 'Tamam! Fareyle döndürebilirsin.';
};

function buildHead(lm) {
  const vw = video.videoWidth, vh = video.videoHeight, aspect = vw / vh;

  // Kare görüntüyü doku olarak dondur
  const cv = document.createElement('canvas');
  cv.width = vw; cv.height = vh;
  const ctx = cv.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;

  // Ten rengi: yanak bölgesinden örnekle
  const c = lm[205];
  const px = ctx.getImageData(Math.round(c.x * vw) - 6, Math.round(c.y * vh) - 6, 12, 12).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < px.length; i += 4) { r += px[i]; g += px[i + 1]; b += px[i + 2]; }
  const n = px.length / 4;
  const skin = new THREE.Color(`rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`);

  // Köşe, UV ve üçgenler
  const pos = new Float32Array(468 * 3), uv = new Float32Array(468 * 2);
  lm.forEach((p, i) => {
    pos.set([(p.x - 0.5) * aspect, -(p.y - 0.5), -p.z * aspect], i * 3);
    uv.set([p.x, 1 - p.y], i * 2);
  });

  const pts = lm.map(p => [p.x * aspect, p.y]);
  const tri = Delaunay.from(pts).triangles;
  const oval = OVAL.map(i => pts[i]);
  const inside = (x, y) => {
    let o = false;
    for (let i = 0, j = oval.length - 1; i < oval.length; j = i++) {
      const [xi, yi] = oval[i], [xj, yj] = oval[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) o = !o;
    }
    return o;
  };
  const idx = [];
  for (let t = 0; t < tri.length; t += 3) {
    const a = tri[t], b2 = tri[t + 1], c2 = tri[t + 2];
    const cx = (pts[a][0] + pts[b2][0] + pts[c2][0]) / 3, cy = (pts[a][1] + pts[b2][1] + pts[c2][1]) / 3;
    if (inside(cx, cy)) idx.push(a, b2, c2);
  }

  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  faceGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  faceGeo.setIndex(idx);
  faceGeo.computeVertexNormals();
  const faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.8, side: THREE.DoubleSide
  }));

  // Yüz ölçüleri
  const box = new THREE.Box3().setFromBufferAttribute(faceGeo.getAttribute('position'));
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const W = size.x, H = size.y;
  const ovalZ = OVAL.reduce((s, i) => s + pos[i * 3 + 2], 0) / OVAL.length;

  // Kafa (elipsoid kafatası + boyun + kulaklar), ten rengiyle
  const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.9 });
  const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), skinMat);
  const rx = W * 0.56, ry = H * 0.68, rz = W * 0.62;
  skull.scale.set(rx, ry, rz);
  skull.position.set(ctr.x, ctr.y + H * 0.1, ovalZ - rz * 0.85);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(W * 0.2, W * 0.24, H * 0.7, 32), skinMat);
  neck.position.set(ctr.x, ctr.y - H * 0.75, ovalZ - rz * 0.85);

  const earGeo = new THREE.SphereGeometry(1, 24, 16);
  const earL = new THREE.Mesh(earGeo, skinMat), earR = new THREE.Mesh(earGeo, skinMat);
  [earL, earR].forEach((e, k) => {
    e.scale.set(W * 0.03, H * 0.1, W * 0.07);
    e.position.set(ctr.x + (k ? 1 : -1) * rx * 0.98, ctr.y, ovalZ - rz * 0.85);
  });

  if (headGroup) scene.remove(headGroup);
  headGroup = new THREE.Group();
  headGroup.add(faceMesh, skull, neck, earL, earR);
  headGroup.position.set(-ctr.x, -ctr.y, -ctr.z); // merkeze al
  scene.add(headGroup);
  controls.target.set(0, 0, 0);
  camera.position.set(0, 0, 3);
}

// ---------- GLB dışa aktar ----------
$('export').onclick = () => {
  new GLTFExporter().parse(headGroup, glb => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    a.download = 'yuzum.glb'; a.click();
  }, err => console.error(err), { binary: true });
};
</script>
</body>
</html>
