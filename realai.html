<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d12">
<title>AI İnsan – 3D Sohbet</title>
<script src="https://js.puter.com/v2/"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--bg:#0b0d12;--panel:rgba(20,24,34,.78);--line:#2a3142;--fg:#eef1f7;--ac:#7c9cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#1b2238,var(--bg) 70%);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#status{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;font-size:13px;opacity:.7}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
select,button,input{font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
#ui{width:100%;max-width:680px;margin:0 auto;padding:6px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#log{max-height:26dvh;overflow:auto;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);font-size:15px;line-height:1.45}
#log p{margin:.3em 0}.u{color:var(--ac)}
#row{display:flex;gap:8px}#row input{flex:1;min-width:0}
#go{display:none}
@media(max-width:480px){select,button{padding:8px 10px}#send{display:none}#go{display:block}}
#scanUI{position:fixed;inset:0;z-index:20;background:rgba(5,7,12,.93);display:flex;align-items:center;justify-content:center;padding:16px}
#scanUI[hidden]{display:none}
.box{width:min(420px,100%);text-align:center}
.vwrap{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-height:62dvh;margin:0 auto;background:#000}
#vid{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.oval{position:absolute;inset:12% 18%;border:3px dashed rgba(255,255,255,.55);border-radius:50%}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#smsg{font-size:14px;opacity:.85;min-height:2.6em}
#mic.on{background:#c0392b}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div>
<div id="status">Model yükleniyor…</div>
<div id="top">
  <select id="model">
    <option value="gpt-4o-mini">gpt-4o-mini</option>
    <option value="gpt-5-nano">gpt-5-nano</option>
    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
  </select>
  <button id="scan" title="Yüzümü tara">📷</button>
  <button id="mute" title="Ses aç/kapat">🔊</button>
</div>
<div id="ui">
  <div id="log"><p><b>AI:</b> Merhaba! Benimle yazarak ya da mikrofonla konuşabilirsin.</p></div>
  <div id="row">
    <input id="inp" placeholder="Bir şey yaz…" autocomplete="off">
    <button id="mic" title="Konuş">🎤</button>
    <button id="send">Gönder</button><button id="go" title="Gönder">➤</button>
  </div>
</div>
</div>

<div id="scanUI" hidden><div class="box">
  <h3>Yüzünü tarat</h3>
  <div class="vwrap"><video id="vid" playsinline muted autoplay></video><div class="oval"></div></div>
  <p id="smsg"></p>
  <div class="btns"><button id="cam">🎥 Kamerayı aç</button><button id="snap">📸 Tara</button><button id="up">🖼 Fotoğraf yükle/çek</button><input id="fileIn" type="file" accept="image/*" capture="user" hidden><button id="reset">Orijinal yüz</button><button id="skip">Kapat</button></div>
</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2,2,4); scene.add(key);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enableZoom = false; controls.enablePan = false;
controls.minPolarAngle = 1.2; controls.maxPolarAngle = 1.9;
controls.minAzimuthAngle = -0.8; controls.maxAzimuthAngle = 0.8;

let fitInfo = null;
function fit(){
  if (!fitInfo) return;
  const {ctr,size} = fitInfo, v = THREE.MathUtils.degToRad(camera.fov/2);
  const dH = (size.y/2)/Math.tan(v), dW = (size.x/2)/Math.tan(Math.atan(Math.tan(v)*camera.aspect));
  const dir = camera.position.clone().sub(ctr).normalize();
  camera.position.copy(ctr).addScaledVector(dir, Math.max(dH,dW)*1.15);
  controls.target.copy(ctr); controls.update();
}
function resize(){
  const s = $('stage'), w = s.clientWidth, h = s.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); fit();
}
new ResizeObserver(resize).observe($('stage')); camera.position.set(0,0,1); resize();

// --- Model ---
let morphMeshes = [], root = null;
const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder)
  .load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/facecap.glb', gltf => {
    root = gltf.scene; scene.add(root);
    root.traverse(o => { if (o.isMesh && o.morphTargetDictionary) morphMeshes.push(o); });
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    camera.position.set(ctr.x, ctr.y, ctr.z + 1);
    fitInfo = {ctr, size}; fit();
    $('status').textContent = 'Hazır';
    setTimeout(() => $('status').style.opacity = 0, 2000);
    try{ afterLoad(); }catch(e){ console.error(e); $('status').style.opacity = 1; $('status').textContent = 'Yüz modülü başlatılamadı'; }
  }, undefined, e => { $('status').textContent = 'Model yüklenemedi: internet bağlantını kontrol et.'; console.error(e); });

const M = {};                       // hedef morph değerleri
const setM = (n,v) => M[n] = v;
function applyMorphs(dt){
  for (const m of morphMeshes){
    const d = m.morphTargetDictionary, inf = m.morphTargetInfluences;
    for (const n in M){ const i = d[n]; if (i !== undefined) inf[i] += (M[n] - inf[i]) * Math.min(1, dt*18); }
  }
}

// --- Yüz tarama: kullanıcının yüzünü sadece yüz bölgesine yansıtır ---
const LS = 'aiInsanFace', msg = t => $('smsg').textContent = t, ss = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
let head = null, model = null, stream = null, landmarker = null;
const faceUni = { value: new THREE.Texture() };

function analyzeHead(){
  root.updateMatrixWorld(true);
  head = morphMeshes.reduce((a,b) => a.geometry.attributes.position.count >= b.geometry.attributes.position.count ? a : b);
  const g = head.geometry, pos = g.attributes.position, nor = g.attributes.normal, n = pos.count, dict = head.morphTargetDictionary;
  const W = new Float32Array(n*3), N = new Float32Array(n*3), v = new THREE.Vector3(), nm = new THREE.Matrix3().getNormalMatrix(head.matrixWorld);
  for (let i=0;i<n;i++){
    v.fromBufferAttribute(pos,i).applyMatrix4(head.matrixWorld); W.set([v.x,v.y,v.z], i*3);
    v.fromBufferAttribute(nor,i).applyMatrix3(nm).normalize(); N.set([v.x,v.y,v.z], i*3);
  }
  // Morph hedeflerinden göz ve ağız merkezlerini bul
  const region = name => {
    const a = g.morphAttributes.position[dict[name]], mg = new Float32Array(n); let mx = 0;
    for (let i=0;i<n;i++){
      const rel = g.morphTargetsRelative;
      mg[i] = Math.hypot(a.getX(i)-(rel?0:pos.getX(i)), a.getY(i)-(rel?0:pos.getY(i)), a.getZ(i)-(rel?0:pos.getZ(i)));
      mx = Math.max(mx, mg[i]);
    }
    const c = [0,0,0], nn = [0,0,0]; let k = 0;
    for (let i=0;i<n;i++) if (mg[i] > mx*0.45){ k++; for (let j=0;j<3;j++){ c[j]+=W[i*3+j]; nn[j]+=N[i*3+j]; } }
    return { c: c.map(q=>q/k), nrm: nn };
  };
  const eyes = [region('eyeBlink_L'), region('eyeBlink_R')].sort((a,b) => a.c[0]-b.c[0]);
  const mouth = region('mouthFunnel');
  const f = new THREE.Vector3(...mouth.nrm).normalize();
  model = { W, N, f, P: [eyes[0].c, eyes[1].c, mouth.c] };
  // Sadece baş mesh'inin malzemesine yüz shader'ı ekle
  head.geometry.setAttribute('uvFace', new THREE.BufferAttribute(new Float32Array(n*2), 2));
  head.geometry.setAttribute('faceW', new THREE.BufferAttribute(new Float32Array(n), 1));
  const mat = head.material.clone(); head.material = mat;
  mat.onBeforeCompile = sh => {
    sh.uniforms.faceTex = faceUni;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec2 uvFace;attribute float faceW;varying vec2 vFaceUv;varying float vFaceW;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFaceUv=uvFace;vFaceW=faceW;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform sampler2D faceTex;varying vec2 vFaceUv;varying float vFaceW;')
      .replace('#include <map_fragment>', `#include <map_fragment>
      if (vFaceW > 0.001){
        vec3 ph = texture2D(faceTex, vFaceUv).rgb, phL = texture2D(faceTex, vFaceUv, 5.0).rgb;
        #ifdef USE_MAP
        vec3 bL = texture2D(map, vMapUv, 5.0).rgb;
        #else
        vec3 bL = diffuseColor.rgb;
        #endif
        float edge = 1.0 - smoothstep(0.3, 1.0, vFaceW);
        ph *= mix(vec3(1.0), clamp(bL / max(phL, vec3(0.03)), 0.5, 2.0), edge);
        diffuseColor.rgb = mix(diffuseColor.rgb, ph, vFaceW);
      }`);
  };
  mat.customProgramCacheKey = () => 'face'; mat.needsUpdate = true;
}

function clearFace(){ if (!head) return; const a = head.geometry.attributes.faceW; a.array.fill(0); a.needsUpdate = true; }

function applyFace(d){
  const img = new Image();
  img.onload = () => {
    const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4; tex.needsUpdate = true; faceUni.value = tex;
    const { W, N, f, P } = model, [A,B,M] = P;
    const dist = Math.hypot(B[0]-A[0], B[1]-A[1]), eyeY = (A[1]+B[1])/2, m = Math.abs(eyeY - M[1]);
    const cx = (A[0]+B[0])/2, cy = (eyeY + M[1])/2, rx = 1.05*dist, ry = 1.2*m;
    // Model (x,y) -> fotoğraf (px,py) afin dönüşümü: göz, göz, ağız
    const inv = new THREE.Matrix3().set(A[0],A[1],1, B[0],B[1],1, M[0],M[1],1).invert();
    const [a,b,c] = new THREE.Vector3(d.pts[0][0], d.pts[1][0], d.pts[2][0]).applyMatrix3(inv).toArray();
    const [e,h,k] = new THREE.Vector3(d.pts[0][1], d.pts[1][1], d.pts[2][1]).applyMatrix3(inv).toArray();
    const uv = head.geometry.attributes.uvFace, fw = head.geometry.attributes.faceW, n = fw.count;
    for (let i=0;i<n;i++){
      const x = W[i*3], y = W[i*3+1], u = (a*x+b*y+c)/d.w, v = 1 - (e*x+h*y+k)/d.h;
      const r = Math.hypot((x-cx)/rx, (y-cy)/ry), dot = N[i*3]*f.x + N[i*3+1]*f.y + N[i*3+2]*f.z;
      let w = (1 - ss(0.7, 1, r)) * ss(0.15, 0.5, dot);
      if (u < 0.02 || u > 0.98 || v < 0.02 || v > 0.98) w = 0;
      uv.array[i*2] = u; uv.array[i*2+1] = v; fw.array[i] = w;
    }
    uv.needsUpdate = fw.needsUpdate = true;
  };
  img.src = d.img;
}

async function getLandmarker(){
  if (landmarker) return landmarker;
  const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { FaceLandmarker, FilesetResolver } = await import(V + '/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks(V + '/wasm');
  return landmarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' },
    runningMode: 'IMAGE', numFaces: 1 });
}

function openScan(){
  $('scanUI').hidden = false; msg('“Kamerayı aç”a basıp izin ver ya da “Fotoğraf yükle/çek” ile bir selfie seç.');
  getLandmarker().catch(() => msg('Yüz modeli yüklenemedi (internet?).'));
}
async function startCam(){
  if (!navigator.mediaDevices?.getUserMedia) return msg('Bu sayfada kamera erişimi kapalı (HTTPS ya da tarayıcıda açılmış olmalı; uygulama içi önizleme/dosya olarak açma desteklenmez). “Fotoğraf yükle/çek” ile devam edebilirsin.');
  try{
    stream?.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:960} }, audio:false });
    $('vid').srcObject = stream; await $('vid').play().catch(() => {});
    msg('Yüzünü ovalin içine getir, düz bak ve “Tara”ya bas.');
  }catch(e){
    msg(e?.name === 'NotAllowedError' ? 'Kamera izni verilmedi ya da bu sayfada engelli. Adres çubuğundaki kilit/kamera simgesinden izin ver, olmazsa “Fotoğraf yükle/çek”i kullan.' : 'Kamera açılamadı (' + (e?.name || e) + '). “Fotoğraf yükle/çek”i dene.');
  }
}
function closeScan(){ stream?.getTracks().forEach(t => t.stop()); stream = null; $('scanUI').hidden = true; }

async function scanFace(src){
  src = src || $('vid');
  const sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
  if (!sw) return msg('Kamera hazır değil. Önce “Kamerayı aç”a bas.');
  const k = Math.min(1, 1024/Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  msg('Yüz analiz ediliyor…');
  const f = (await getLandmarker()).detect(c).faceLandmarks?.[0];
  if (!f) return msg('Yüz bulunamadı. Işığı artırıp tekrar dene.');
  const P = i => [f[i].x*c.width, f[i].y*c.height];
  const avg = ids => { const p = ids.map(P); return [p.reduce((s,q)=>s+q[0],0)/p.length, p.reduce((s,q)=>s+q[1],0)/p.length]; };
  let eA = avg([33,133,159,145]), eB = avg([263,362,386,374]); const mo = avg([61,291,0,17]);
  if (eA[0] > eB[0]) [eA, eB] = [eB, eA];
  const nose = P(1), dA = Math.abs(nose[0]-P(33)[0]), dB = Math.abs(P(263)[0]-nose[0]);
  if (Math.abs(dA-dB)/(dA+dB) > 0.22) return msg('Yüzünü kameraya düz çevir ve tekrar dene.');
  const d = { img: c.toDataURL('image/jpeg', 0.9), pts: [eA, eB, mo], w: c.width, h: c.height };
  try{ localStorage.setItem(LS, JSON.stringify(d)); }catch{}
  applyFace(d); closeScan();
}
$('scan').onclick = openScan; $('skip').onclick = closeScan;
$('cam').onclick = startCam; $('up').onclick = () => $('fileIn').click();
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try{ let b; try{ b = await createImageBitmap(f, {imageOrientation:'from-image'}); }catch{ b = await createImageBitmap(f); } await scanFace(b); }
  catch(err){ msg('Fotoğraf okunamadı: ' + (err?.message || err)); }
  e.target.value = '';
};
$('snap').onclick = () => scanFace().catch(e => msg('Hata: ' + (e?.message || e)));
