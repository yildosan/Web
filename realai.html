<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d12">
<title>AI İnsan – 3D Sohbet</title>
<script src="https://js.puter.com/v2/"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--bg:#0b0d12;--panel:rgba(20,24,34,.78);--line:#2a3142;--fg:#eef1f7;--ac:#7c9cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#1b2238,var(--bg) 70%);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#status{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;font-size:13px;opacity:.7}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
select,button,input{font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
#ui{width:100%;max-width:680px;margin:0 auto;padding:6px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#log{max-height:26dvh;overflow:auto;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);font-size:15px;line-height:1.45}
#log p{margin:.3em 0}.u{color:var(--ac)}
#row{display:flex;gap:8px}#row input{flex:1;min-width:0}
@media(max-width:480px){select,button{padding:8px 10px}#send{display:none}#go{display:block}}
#go{display:none}
#mic.on{background:#c0392b}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div>
<div id="status">Model yükleniyor…</div>
<div id="top">
  <select id="model">
    <option value="gpt-4o-mini">gpt-4o-mini</option>
    <option value="gpt-5-nano">gpt-5-nano</option>
    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
  </select>
  <button id="mute" title="Ses aç/kapat">🔊</button>
</div>
<div id="ui">
  <div id="log"><p><b>AI:</b> Merhaba! Benimle yazarak ya da mikrofonla konuşabilirsin.</p></div>
  <div id="row">
    <input id="inp" placeholder="Bir şey yaz…" autocomplete="off">
    <button id="mic" title="Konuş">🎤</button>
    <button id="send">Gönder</button><button id="go" title="Gönder">➤</button>
  </div>
</div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2,2,4); scene.add(key);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enableZoom = false; controls.enablePan = false;
controls.minPolarAngle = 1.2; controls.maxPolarAngle = 1.9;
controls.minAzimuthAngle = -0.8; controls.maxAzimuthAngle = 0.8;

let fitInfo = null;
function fit(){
  if (!fitInfo) return;
  const {ctr,size} = fitInfo, v = THREE.MathUtils.degToRad(camera.fov/2);
  const dH = (size.y/2)/Math.tan(v), dW = (size.x/2)/Math.tan(Math.atan(Math.tan(v)*camera.aspect));
  const dir = camera.position.clone().sub(ctr).normalize();
  camera.position.copy(ctr).addScaledVector(dir, Math.max(dH,dW)*1.15);
  controls.target.copy(ctr); controls.update();
}
function resize(){
  const s = $('stage'), w = s.clientWidth, h = s.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); fit();
}
new ResizeObserver(resize).observe($('stage')); camera.position.set(0,0,1); resize();

// --- Model ---
let morphMeshes = [], root = null;
const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder)
  .load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/facecap.glb', gltf => {
    root = gltf.scene; scene.add(root);
    root.traverse(o => { if (o.isMesh && o.morphTargetDictionary) morphMeshes.push(o); });
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    camera.position.set(ctr.x, ctr.y, ctr.z + 1);
    fitInfo = {ctr, size}; fit();
    $('status').textContent = 'Hazır';
    setTimeout(() => $('status').style.opacity = 0, 2000);
  }, undefined, e => { $('status').textContent = 'Model yüklenemedi: internet bağlantını kontrol et.'; console.error(e); });

const M = {};                       // hedef morph değerleri
const setM = (n,v) => M[n] = v;
function applyMorphs(dt){
  for (const m of morphMeshes){
    const d = m.morphTargetDictionary, inf = m.morphTargetInfluences;
    for (const n in M){ const i = d[n]; if (i !== undefined) inf[i] += (M[n] - inf[i]) * Math.min(1, dt*18); }
  }
}

// --- Canlılık: göz kırpma, mimik, kafa hareketi, dudak senkronu ---
let speaking = false, nextBlink = 2, blink = 0, t = 0, viseme = {jawOpen:0, mouthFunnel:0, mouthPucker:0}, nextViseme = 0;
const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt = clock.getDelta(); t += dt;
  nextBlink -= dt;
  if (nextBlink < 0){ blink = 0.15; nextBlink = 2 + Math.random()*4; }
  blink = Math.max(0, blink - dt);
  const b = blink > 0 ? 1 : 0;
  setM('eyeBlink_L', b); setM('eyeBlink_R', b);
  // bakış / kaş
  setM('eyeLookInLeft', 0); setM('browInnerUp', speaking ? 0.25 + 0.2*Math.sin(t*3) : 0.05);
  setM('mouthSmile_L', speaking ? 0.25 : 0.12); setM('mouthSmile_R', speaking ? 0.25 : 0.12);
  // konuşma
  if (speaking){
    nextViseme -= dt;
    if (nextViseme < 0){
      nextViseme = 0.07 + Math.random()*0.08;
      const r = Math.random();
      viseme = { jawOpen: 0.1 + Math.random()*0.55, mouthFunnel: r<0.25 ? 0.5 : 0, mouthPucker: r>0.8 ? 0.5 : 0 };
    }
  } else viseme = {jawOpen:0, mouthFunnel:0, mouthPucker:0};
  for (const k in viseme) setM(k, viseme[k]);
  applyMorphs(dt);
  if (root){ root.rotation.y = Math.sin(t*0.5)*0.05; root.rotation.x = Math.sin(t*0.7)*0.02; }
  controls.update();
  renderer.render(scene, camera);
})();

// --- Ses (TTS) ---
let muted = false;
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; if (muted){ speechSynthesis.cancel(); speaking = false; } };
function speak(text){
  speechSynthesis.cancel();
  if (muted){ speaking = true; setTimeout(()=>speaking=false, Math.min(8000, text.length*55)); return; }
  const u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g,''));
  const lang = /[çğıöşüÇĞİÖŞÜ]/.test(text) ? 'tr' : 'en';
  u.lang = lang === 'tr' ? 'tr-TR' : 'en-US';
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith(lang));
  if (v) u.voice = v;
  u.onstart = () => speaking = true;
  u.onend = u.onerror = () => speaking = false;
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged = () => {};

// --- Yapay zeka (Puter.js, API anahtarı yok) ---
const history = [{role:'system', content:'Sen sıcakkanlı, doğal konuşan bir insan avatarısın. Kullanıcının dilinde, en fazla 2-3 kısa cümleyle yanıt ver. Markdown ve emoji kullanma.'}];
const log = $('log');
function add(who, text){
  const p = document.createElement('p');
  p.innerHTML = `<b class="${who==='Sen'?'u':''}">${who}:</b> `; p.append(text);
  log.append(p); log.scrollTop = log.scrollHeight; return p;
}
function unlockTTS(){ try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch{} }
async function ask(text){
  if (!text.trim()) return;
  unlockTTS();
  add('Sen', text); history.push({role:'user', content:text});
  const wait = add('AI', '…');
  try{
    if (typeof puter === 'undefined') throw new Error('Puter.js yüklenemedi (internet?).');
    const r = await puter.ai.chat(history, {model: $('model').value});
    let out = typeof r === 'string' ? r : (r?.message?.content ?? r?.text ?? '');
    if (Array.isArray(out)) out = out.map(c => c.text || '').join('');
    out = String(out).trim() || '(boş yanıt)';
    history.push({role:'assistant', content:out});
    wait.lastChild.textContent = out;
    speak(out);
  }catch(e){
    wait.lastChild.textContent = 'Hata: ' + (e?.message || e?.error?.message || JSON.stringify(e));
  }
}
const sendIt = () => { const v = $('inp').value; $('inp').value = ''; ask(v); };
$('send').onclick = $('go').onclick = sendIt;
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter') sendIt(); });

// --- Mikrofon ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $('mic').style.display = 'none';
else {
  const rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = false;
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onend = () => $('mic').classList.remove('on');
  $('mic').onclick = () => { unlockTTS(); speaking = false; $('mic').classList.add('on'); try{ rec.start(); }catch{} };
}
</script>
</body>
</html>
