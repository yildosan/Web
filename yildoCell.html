<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Operatör Paketleri</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Operatör Sitelerinden Canlı Veri Çekme</h1>
      <button onclick="fetchTurkcellData()" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600">
        Turkcell Verilerini Getir
      </button>
    </div>

    <div id="status" class="text-sm text-gray-600 mb-4"></div>
    <div id="packageList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    async function fetchTurkcellData() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('packageList');
      
      statusEl.innerText = 'Turkcell web sitesinden veriler çekiliyor...';
      listEl.innerHTML = '';

      // CORS proxy hizmeti kullanılarak Turkcell sitesine istek atılıyor
      const targetUrl = 'https://www.turkcell.com.tr/paket-ve-tarifeler/konusma';
      const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        const data = await response.json();
        
        // Gelen HTML yanıtını bir DOM ağacına çeviriyoruz
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // Örnek: Turkcell sayfasındaki paket kartlarını DOM seçicileri ile yakalama
        const cards = doc.querySelectorAll('.m-card-v2');
        
        if (cards.length === 0) {
          statusEl.innerText = 'Veri bulundu ancak sayfa yapısı değişmiş olabilir.';
          return;
        }

        statusEl.innerText = `${cards.length} adet canlı paket bulundu.`;

        cards.forEach(card => {
          const title = card.querySelector('.m-card-v2__title')?.innerText || 'İsimsiz Paket';
          const price = card.querySelector('.m-card-v2__price')?.innerText || 'Fiyat bilgisi yok';

          const cardHtml = `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
              <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded font-bold">Turkcell (Canlı)</span>
              <h3 class="font-bold text-lg mt-2">${title.trim()}</h3>
              <p class="text-xl font-black text-gray-900 mt-2">${price.trim()}</p>
            </div>
          `;
          listEl.innerHTML += cardHtml;
        });

      } catch (error) {
        statusEl.innerText = 'Veriler çekilirken bir hata oluştu: ' + error.message;
      }
    }
  </script>
</body>
</html>
