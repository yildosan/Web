<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazuri-Turkuli Çeviri (GPT-4o)</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2a2a2a; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 500px; }
        h2 { text-align: center; color: #00d1b2; margin-bottom: 1.5rem; }
        select, textarea, button { width: 100%; margin-bottom: 1rem; padding: 12px; border-radius: 6px; border: none; font-size: 1rem; box-sizing: border-box; }
        textarea { height: 120px; background: #3d3d3d; color: white; resize: none; }
        button { background-color: #00d1b2; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00b8a0; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #output { padding: 12px; background: #1a1a1a; border-left: 4px solid #00d1b2; min-height: 50px; white-space: pre-wrap; }
        .loader { font-size: 0.8rem; color: #888; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lazuri Çeviri 4o</h2>
    
    <select id="direction">
        <option value="tr-laz">Türkçe ➔ Lazca</option>
        <option value="laz-tr">Lazca ➔ Türkçe</option>
    </select>

    <textarea id="inputText" placeholder="Metni buraya yazın..."></textarea>
    
    <button id="translateBtn">Çevir</button>
    
    <div class="loader" id="loader">Puter AI işliyor...</div>
    <div id="output">Çeviri burada görünecek...</div>
</div>

<script>
    const translateBtn = document.getElementById('translateBtn');
    const inputText = document.getElementById('inputText');
    const outputDiv = document.getElementById('output');
    const direction = document.getElementById('direction');
    const loader = document.getElementById('loader');

    translateBtn.onclick = async () => {
        const text = inputText.value.trim();
        if (!text) return;

        translateBtn.disabled = true;
        loader.style.display = 'block';
        outputDiv.innerText = "Düşünüyor...";

        const promptDirection = direction.value === 'tr-laz' ? "Türkçe'den Lazca'ya" : "Lazca'dan Türkçe'ye";
        
        const systemPrompt = `Sen profesyonel bir Lazca çevirmensin. 
        Görevin verilen metni ${promptDirection} çevirmektir. 
        Lazca alfabesini (ç’, gğ, k’, p’, t’, ž gibi harfler) doğru kullan. 
        Sadece çeviriyi döndür, açıklama yapma.`;

        try {
            // Puter.js v2 chat kullanımı (Model: gpt-4o)
            const response = await puter.ai.chat(
                `${systemPrompt}\n\nÇevrilecek metin: ${text}`,
                { model: 'gpt-4o' }
            );

            outputDiv.innerText = response.toString();
        } catch (error) {
            outputDiv.innerText = "Hata oluştu: " + error.message;
        } finally {
            translateBtn.disabled = false;
            loader.style.display = 'none';
        }
    };
</script>

</body>
</html>
