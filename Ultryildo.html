<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Metaverse 3D - Speech Bubbles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 5;
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .stats { color: #00ffff; font-size: 20px; font-weight: bold; text-shadow: 0 0 8px #00ffff; }
    
    /* Emote & Chat Paneli */
    #bottom-panel {
      display: flex; gap: 15px; align-items: flex-end; pointer-events: auto;
    }

    #emote-bar {
      display: flex; flex-direction: column; gap: 8px;
      background: rgba(10, 10, 20, 0.85); border: 1px solid #ff0055;
      padding: 10px; border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
    }
    .emote-btn {
      background: #111; color: #00ffff; border: 1px solid #00ffff;
      padding: 6px 12px; font-family: inherit; font-size: 13px;
      cursor: pointer; font-weight: bold; transition: all 0.2s;
      text-align: left;
    }
    .emote-btn:hover { background: #00ffff; color: #000; }

    #chat-container {
      width: 320px;
      background: rgba(10, 10, 20, 0.85); border: 1px solid #00ffff;
      border-radius: 8px; padding: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
    }
    #chat-messages {
      height: 120px; overflow-y: auto; color: #fff; font-size: 13px;
      margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px;
    }
    #chat-input {
      width: 100%; background: #000; border: 1px solid #ff0055;
      color: #00ffff; padding: 8px; font-family: inherit; font-size: 13px;
      outline: none;
    }

    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 10;
      cursor: pointer;
    }
    h1 { font-size: 45px; color: #ff0055; text-shadow: 0 0 15px #ff0055; margin-bottom: 10px; text-align: center; }
    p { font-size: 15px; color: #aaa; margin-bottom: 20px; text-align: center; line-height: 1.6; }
    .btn { padding: 12px 30px; font-size: 18px; background: #ff0055; color: #fff; border: none; cursor: pointer; font-family: inherit; font-weight: bold; }
    .btn:hover { background: #ff3377; box-shadow: 0 0 15px #ff0055; }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>CYBER METAVERSE</h1>
    <p>
      WASD: Hareket | Fare: Kamerayı Çevir | Boşluk: Zıpla<br>
      <b>1: El Sallama | 2: Dans | 3: Kafa Sallama</b> | T veya Enter: Chat
    </p>
    <button class="btn" id="start-btn">METAVERSE'E GİRİŞ YAP</button>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="stats">
        <div>BÖLGE: <span id="zone-val" style="color:#ff0055;">MERKEZ PLAZA</span></div>
        <div>ONLINE AVATARLAR: <span>1</span></div>
      </div>
    </div>

    <div id="bottom-panel">
      <div id="emote-bar">
        <button class="emote-btn" onclick="triggerEmote('wave')">[1] 👋 El Salla</button>
        <button class="emote-btn" onclick="triggerEmote('dance')">[2] 🕺 Dans Et</button>
        <button class="emote-btn" onclick="triggerEmote('nod')">[3] 🔴 Onayla</button>
      </div>

      <div id="chat-container">
        <div id="chat-messages">
          <div><span style="color:#ff0055;">[Sistem]:</span> Dünyaya hoş geldiniz! Mesajlarınız artık kafanızın üstünde belirecek.</div>
        </div>
        <input type="text" id="chat-input" placeholder="Mesaj yazın (Enter)..." />
      </div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <script>
    let scene, camera, renderer;
    let player, playerLimbs = {}, cameraPivot;
    let isPlaying = false;
    let isChatting = false;

    // Duygu & Animasyon Durumu
    let currentEmote = null;
    let emoteTimer = 0;

    // Kontroller & Fizik
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let canJump = false;
    let animTime = 0;

    // Kamera
    let cameraYaw = 0;
    let cameraPitch = 0.3;
    const cameraDistance = 5;

    // Mesaj Balonu Sistem Değişkenleri
    let speechBubbleSprite = null;
    let bubbleTimeout = null;

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020205);
      scene.fog = new THREE.FogExp2(0x020205, 0.02);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x332244);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffff, 0.9);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      createMetaverseWorld();
      
      // Sadece Oyuncu Avatarı Oluştur
      player = createHumanoidAvatar(0xff0055, 0x00ffff);
      scene.add(player.group);
      playerLimbs = player.limbs;

      cameraPivot = new THREE.Object3D();
      scene.add(cameraPivot);

      setupControls();
      setupChat();

      window.addEventListener('resize', onWindowResize);
    }

    // --- İNSANSI AVATAR OLUŞTURUCU ---
    function createHumanoidAvatar(suitColor, visorColor) {
      const group = new THREE.Group();
      const limbs = {};

      const suitMat = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.4, metalness: 0.2 });
      const jointMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8 });
      const visorMat = new THREE.MeshBasicMaterial({ color: visorColor, wireframe: true });

      // Torso
      const torsoGeo = new THREE.CylinderGeometry(0.35, 0.25, 0.8, 8);
      const torso = new THREE.Mesh(torsoGeo, suitMat);
      torso.position.y = 1.1;
      group.add(torso);
      limbs.torso = torso;

      // Baş & Vizör
      const headGroup = new THREE.Group();
      headGroup.position.y = 1.65;
      
      const headGeo = new THREE.SphereGeometry(0.22, 16, 16);
      const head = new THREE.Mesh(headGeo, suitMat);
      headGroup.add(head);

      const visorGeo = new THREE.BoxGeometry(0.25, 0.1, 0.2);
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 0.02, -0.12);
      headGroup.add(visor);
      
      group.add(headGroup);
      limbs.head = headGroup;

      function createLimb(xOffset, yPos, length, radius) {
        const pivot = new THREE.Group();
        pivot.position.set(xOffset, yPos, 0);

        const meshGeo = new THREE.CylinderGeometry(radius, radius * 0.8, length, 8);
        const mesh = new THREE.Mesh(meshGeo, suitMat);
        mesh.position.y = -length / 2;
        pivot.add(mesh);

        const jointGeo = new THREE.SphereGeometry(radius * 1.1, 8, 8);
        const joint = new THREE.Mesh(jointGeo, jointMat);
        pivot.add(joint);

        group.add(pivot);
        return pivot;
      }

      limbs.leftArm = createLimb(-0.42, 1.4, 0.6, 0.08);
      limbs.rightArm = createLimb(0.42, 1.4, 0.6, 0.08);
      limbs.leftLeg = createLimb(-0.2, 0.7, 0.7, 0.1);
      limbs.rightLeg = createLimb(0.2, 0.7, 0.7, 0.1);

      return { group, limbs };
    }

    function createMetaverseWorld() {
      const floorGeo = new THREE.PlaneGeometry(120, 120, 30, 30);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x050510, wireframe: true, emissive: 0x110022 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const portalGeo = new THREE.TorusGeometry(3, 0.2, 16, 100);
      const portalMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
      const portal = new THREE.Mesh(portalGeo, portalMat);
      portal.position.set(0, 3.5, -20);
      scene.add(portal);

      const stageGeo = new THREE.CylinderGeometry(8, 10, 1, 32);
      const stageMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x330011 });
      const stage = new THREE.Mesh(stageGeo, stageMat);
      stage.position.set(25, 0.5, 10);
      scene.add(stage);
    }

    // --- MESAJ BALONU (SPEECH BUBBLE) OLUŞTURUCU ---
    function createSpeechBubble(text) {
      if (speechBubbleSprite) {
        player.group.remove(speechBubbleSprite);
        speechBubbleSprite.geometry.dispose();
        speechBubbleSprite.material.dispose();
        speechBubbleSprite = null;
      }

      if (bubbleTimeout) clearTimeout(bubbleTimeout);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      // Balon Arkaplanı
      ctx.fillStyle = 'rgba(10, 10, 25, 0.9)';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 6;
      
      // Yuvarlatılmış Kutucuk Çizimi
      const x = 10, y = 10, w = 492, h = 108, r = 20;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Metin Çizimi
      ctx.fillStyle = '#ffffff';
      ctx.font = 'Bold 28px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Metni sığdırmak için uzun metinlerde kırpma
      let displayText = text;
      if (displayText.length > 28) {
        displayText = displayText.substring(0, 25) + '...';
      }
      ctx.fillText(displayText, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      speechBubbleSprite = new THREE.Sprite(spriteMaterial);

      // Balonun Boyutu ve Kafanın Üstündeki Pozisyonu
      speechBubbleSprite.scale.set(2.4, 0.6, 1);
      speechBubbleSprite.position.set(0, 2.3, 0);

      player.group.add(speechBubbleSprite);

      // 4 Saniye Sonra Balonu Kaldır
      bubbleTimeout = setTimeout(() => {
        if (speechBubbleSprite) {
          player.group.remove(speechBubbleSprite);
          speechBubbleSprite = null;
        }
      }, 4000);
    }

    // --- EMOTE TETİKLEME ---
    function triggerEmote(type) {
      if (!isPlaying) return;
      currentEmote = type;
      emoteTimer = 3.0;
    }

    function setupControls() {
      const startScreen = document.getElementById('start-screen');
      startScreen.addEventListener('click', () => { document.body.requestPointerLock(); });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isPlaying = true;
          startScreen.style.display = 'none';
        } else if (!isChatting) {
          isPlaying = false;
          startScreen.style.display = 'flex';
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!isPlaying || isChatting) return;
        cameraYaw -= e.movementX * 0.003;
        cameraPitch -= e.movementY * 0.003;
        cameraPitch = Math.max(-0.2, Math.min(1.2, cameraPitch));
      });

      document.addEventListener('keydown', (e) => {
        if (isChatting) return;
        
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': if (canJump) { velocity.y = 9; canJump = false; } break;
          case 'Digit1': triggerEmote('wave'); break;
          case 'Digit2': triggerEmote('dance'); break;
          case 'Digit3': triggerEmote('nod'); break;
          case 'KeyT': e.preventDefault(); focusChat(); break;
        }

        if (['KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
          currentEmote = null;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });
    }

    function setupChat() {
      const input = document.getElementById('chat-input');
      input.addEventListener('focus', () => { isChatting = true; document.exitPointerLock(); });
      input.addEventListener('blur', () => { isChatting = false; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim() !== '') {
          const msg = input.value.trim();
          addChatMessage('Sen', msg);
          createSpeechBubble(msg); // Mesaj Balonunu Tetikle
          input.value = '';
          input.blur();
          document.body.requestPointerLock();
        }
      });
    }

    function focusChat() { document.getElementById('chat-input').focus(); }

    function addChatMessage(user, msg) {
      const messages = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<span style="color:#00ffff;">[${user}]:</span> ${msg}`;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    // --- ANIMASYON ENGINE ---
    function animateAvatarLimbs(limbs, isMoving, delta) {
      animTime += delta * (isMoving ? 12 : 3);

      if (currentEmote && !isMoving && emoteTimer > 0) {
        emoteTimer -= delta;

        if (currentEmote === 'wave') {
          limbs.rightArm.rotation.x = -Math.PI + 0.3;
          limbs.rightArm.rotation.z = Math.sin(animTime * 2) * 0.4;
          limbs.leftArm.rotation.x = 0;
          limbs.leftArm.rotation.z = 0;
          limbs.head.rotation.y = 0;
        } 
        else if (currentEmote === 'dance') {
          limbs.leftArm.rotation.x = Math.sin(animTime * 2) * 1.2;
          limbs.rightArm.rotation.x = -Math.sin(animTime * 2) * 1.2;
          limbs.leftLeg.rotation.x = Math.cos(animTime * 2) * 0.5;
          limbs.rightLeg.rotation.x = -Math.cos(animTime * 2) * 0.5;
          limbs.torso.position.y = 1.1 + Math.sin(animTime * 4) * 0.15;
          limbs.head.rotation.z = Math.sin(animTime * 2) * 0.2;
        } 
        else if (currentEmote === 'nod') {
          limbs.head.rotation.x = Math.sin(animTime * 3) * 0.3;
          limbs.leftArm.rotation.x = 0;
          limbs.rightArm.rotation.x = 0;
        }

        if (emoteTimer <= 0) currentEmote = null;
        return;
      }

      limbs.head.rotation.x = 0;
      limbs.head.rotation.z = 0;
      limbs.rightArm.rotation.z = 0;

      if (isMoving) {
        limbs.leftLeg.rotation.x = Math.sin(animTime) * 0.6;
        limbs.rightLeg.rotation.x = -Math.sin(animTime) * 0.6;
        limbs.leftArm.rotation.x = -Math.sin(animTime) * 0.5;
        limbs.rightArm.rotation.x = Math.sin(animTime) * 0.5;
        limbs.torso.position.y = 1.1 + Math.abs(Math.sin(animTime * 2)) * 0.05;
      } else {
        limbs.leftLeg.rotation.x = 0;
        limbs.rightLeg.rotation.x = 0;
        limbs.leftArm.rotation.x = Math.sin(animTime) * 0.05;
        limbs.rightArm.rotation.x = -Math.sin(animTime) * 0.05;
        limbs.torso.position.y = 1.1 + Math.sin(animTime) * 0.02;
      }
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      if (isPlaying) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 25.0 * delta;

        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.z -= 1;
        if (moveBackward) moveDir.z += 1;
        if (moveLeft) moveDir.x -= 1;
        if (moveRight) moveDir.x += 1;
        moveDir.normalize();

        const isMoving = moveForward || moveBackward || moveLeft || moveRight;

        if (isMoving) {
          const angle = cameraYaw + Math.atan2(moveDir.x, moveDir.z);
          velocity.x = Math.sin(angle) * 12;
          velocity.z = Math.cos(angle) * 12;
          player.group.rotation.y = angle + Math.PI;
        }

        player.group.position.x += velocity.x * delta;
        player.group.position.z += velocity.z * delta;
        player.group.position.y += velocity.y * delta;

        if (player.group.position.y < 0) {
          velocity.y = 0;
          player.group.position.y = 0;
          canJump = true;
        }

        animateAvatarLimbs(playerLimbs, isMoving, delta);

        // Kamera Takibi
        cameraPivot.position.copy(player.group.position);
        cameraPivot.position.y += 1.4;

        camera.position.x = cameraPivot.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        camera.position.z = cameraPivot.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);
        camera.position.y = cameraPivot.position.y + cameraDistance * Math.sin(cameraPitch);

        camera.lookAt(cameraPivot.position);

        // Bölge Algılama
        const distToPortal = player.group.position.distanceTo(new THREE.Vector3(0, 0, -20));
        const zoneElem = document.getElementById('zone-val');
        if (distToPortal < 5) {
          zoneElem.innerText = "IŞINLANMA PORTALI";
          zoneElem.style.color = "#00ffff";
        } else {
          zoneElem.innerText = "MERKEZ PLAZA";
          zoneElem.style.color = "#ff0055";
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
</html>
