<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Park - Multiplayer & Parkour World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #020208; font-family: 'Courier New', monospace; user-select: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 5;
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .top-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .stats { color: #00ffff; font-size: 12px; font-weight: bold; text-shadow: 0 0 8px #00ffff; background: rgba(5,15,10,0.85); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(0,255,100,0.4); }
    
    .room-code-container { display: inline-flex; align-items: center; gap: 6px; pointer-events: auto; margin-top: 3px; }
    .copy-btn {
      background: #ff0055; color: #fff; border: none; padding: 3px 8px;
      font-family: inherit; font-size: 10px; font-weight: bold; cursor: pointer;
      border-radius: 4px; transition: all 0.2s; text-shadow: none;
    }

    #game-hud-panel {
      display: none; background: rgba(15, 0, 30, 0.85); border: 1px solid #ff0055;
      padding: 6px 12px; border-radius: 6px; margin-top: 5px; color: #fff; font-size: 12px;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
    }

    #interaction-prompt {
      position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 255, 102, 0.9); color: #000; padding: 8px 16px;
      font-weight: bold; font-size: 14px; border-radius: 20px;
      box-shadow: 0 0 15px #00ff66; display: none; pointer-events: none;
      z-index: 8;
    }

    #fullscreen-btn {
      display: none; pointer-events: auto; background: rgba(10, 20, 10, 0.9); color: #00ff66;
      border: 2px solid #00ff66; font-size: 18px; padding: 8px 14px;
      border-radius: 8px; cursor: pointer; box-shadow: 0 0 12px rgba(0, 255, 100, 0.6);
      z-index: 999; touch-action: manipulation;
    }

    #emote-bar { display: flex; gap: 6px; pointer-events: auto; margin-top: 5px; }
    .emote-btn {
      background: rgba(10, 25, 15, 0.85); color: #00ff66; border: 1px solid #00ff66;
      padding: 4px 8px; font-family: inherit; font-size: 11px;
      cursor: pointer; font-weight: bold; border-radius: 4px;
    }

    #chat-container {
      width: 240px; pointer-events: auto;
      background: rgba(10, 20, 15, 0.85); border: 1px solid #00ff66;
      border-radius: 6px; padding: 6px;
      box-shadow: 0 0 10px rgba(0, 255, 100, 0.2);
      margin-bottom: 5px;
    }
    #chat-messages {
      height: 75px; overflow-y: auto; color: #fff; font-size: 11px;
      margin-bottom: 4px; display: flex; flex-direction: column; gap: 3px;
    }
    #chat-input {
      width: 100%; background: #000; border: 1px solid #ff0055;
      color: #00ff66; padding: 5px; font-family: inherit; font-size: 11px; outline: none;
    }

    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 8, 4, 0.94); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 10;
      padding: 20px; pointer-events: auto;
    }
    h1 { font-size: 28px; color: #00ff66; text-shadow: 0 0 15px #00ff66; margin-bottom: 8px; text-align: center; }
    p { font-size: 12px; color: #00ffff; margin-bottom: 20px; text-align: center; line-height: 1.4; }
    
    .p2p-box {
      background: rgba(15, 30, 20, 0.9); border: 1px solid #00ff66;
      padding: 18px; border-radius: 12px; display: flex; flex-direction: column;
      gap: 10px; width: 100%; max-width: 320px; z-index: 20;
    }
    .p2p-input {
      background: #000; border: 1px solid #ff0055; color: #00ffff;
      padding: 10px; font-family: inherit; text-align: center; font-size: 13px; outline: none; border-radius: 6px;
    }
    .btn {
      padding: 12px; font-size: 13px; background: #ff0055; color: #fff;
      border: none; cursor: pointer; font-family: inherit; font-weight: bold;
      border-radius: 6px; user-select: none;
    }
    .btn-secondary { background: #00ff66; color: #000; }

    #touch-controls {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 6; display: none;
    }
    #joystick-zone {
      position: absolute; bottom: 25px; left: 25px;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(0, 255, 100, 0.15); border: 2px solid rgba(0, 255, 100, 0.5);
      pointer-events: auto; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px;
      width: 40px; height: 40px; border-radius: 50%;
      background: #ff0055; box-shadow: 0 0 12px #ff0055;
    }
    #touch-camera-zone {
      position: absolute; top: 0; right: 0; width: 55%; height: 80%;
      pointer-events: auto; touch-action: none;
    }
    .action-btn-touch {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      color: #fff; font-weight: bold; font-size: 11px;
      display: flex; justify-content: center; align-items: center;
      pointer-events: auto; border: 2px solid #fff;
    }
    #jump-btn { bottom: 35px; right: 25px; background: rgba(255, 0, 85, 0.85); box-shadow: 0 0 12px #ff0055; }
    #interact-btn { bottom: 105px; right: 25px; background: rgba(0, 255, 102, 0.85); color: #000; display: none; }
    #push-btn { bottom: 35px; right: 95px; background: rgba(255, 200, 0, 0.85); color: #000; display: none; }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>CYBER PARK METAVERSE</h1>
    <p>Multiplayer Sosyal Alan & Parkur Macerası</p>

    <div class="p2p-box">
      <button id="btn-solo" class="btn" style="background:#00ff66; color:#000;">TEK BAŞINA OYNA</button>
      <div style="text-align: center; color: #888; font-size: 10px;">--- VEYA ÇOK OYUNCULU ---</div>
      <input type="text" id="join-id-input" class="p2p-input" placeholder="ODA KODU GİRİN" />
      <button id="btn-join" class="btn btn-secondary">KOD İLE KATIL / ODA KUR</button>
    </div>
  </div>

  <div id="touch-controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="touch-camera-zone"></div>
    <div id="jump-btn" class="action-btn-touch">ZIPLA</div>
    <div id="interact-btn" class="action-btn-touch">E</div>
    <div id="push-btn" class="action-btn-touch">F</div>
  </div>

  <div id="interaction-prompt">E - Otur</div>

  <div id="hud">
    <div class="top-bar">
      <div class="top-left">
        <div class="stats">
          <div>BÖLGE: <span id="zone-val" style="color:#00ff66;">CYBER PARK</span> | BAGLANTI: <span id="peer-status" style="color:#00ffff;">OFFLINE</span></div>
          <div class="room-code-container">
            <span>ODA:</span>
            <span id="my-peer-id" style="color:#ffff00;">-</span>
            <button id="copy-btn" class="copy-btn" onclick="copyRoomCode()">KOPYALA</button>
          </div>
        </div>

        <div id="game-hud-panel">
          🏃 NEON PARKOUR | KONTROL NOKTASI: <span id="checkpoint-val" style="color:#00ffff; font-weight:bold;">BAŞLANGIÇ</span>
        </div>

        <div id="emote-bar">
          <button class="emote-btn" onclick="triggerEmote('wave')">👋 Salla</button>
          <button class="emote-btn" onclick="triggerEmote('dance')">🕺 Dans</button>
        </div>
      </div>

      <button id="fullscreen-btn">⛶</button>
    </div>

    <div id="chat-container">
      <div id="chat-messages">
        <div><span style="color:#00ff66;">[Sistem]:</span> Cyber Park'a Hoşgeldiniz!</div>
      </div>
      <input type="text" id="chat-input" placeholder="Mesaj..." />
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    let scene, camera, renderer;
    let player, playerLimbs = {}, cameraPivot;
    let isPlaying = false, isChatting = false, isMobile = false;

    let currentMap = "lobby";
    let lobbyGroup, gameGroup;
    let parkourPortalMesh;

    let physicsBoxes = []; 
    let currentCheckpointPos = new THREE.Vector3(0, 0.05, 0);
    let lastCheckpointName = "BAŞLANGIÇ";

    // Oturma ve Salıncak Değişkenleri
    let isSeated = false;
    let seatedTargetPos = new THREE.Vector3();
    let seatedTargetRot = 0;
    let currentSeatObject = null;
    let activeInteraction = null;
    let canPushSwing = false;

    // Salıncak Fizik
    let swingPivotGroup, swingSeatMesh;
    let swingAngle = 0;
    let swingVelocity = 0;

    // P2P Değişkenleri
    let peer = null, connections = {}, remotePlayers = {}, myPeerId = "";

    // Kontroller
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let joystickVector = { x: 0, y: 0 };
    let velocity = new THREE.Vector3();
    let canJump = false, animTime = 0;
    let cameraYaw = 0, cameraPitch = 0.25;
    const cameraDistance = 6.5;

    function detectDevice() {
      isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth < 768;
      if (isMobile) {
        document.getElementById('touch-controls').style.display = 'block';
        document.getElementById('fullscreen-btn').style.display = 'block';
      }
    }

    function init() {
      detectDevice();
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020a05);
      scene.fog = new THREE.FogExp2(0x05150d, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x335544, 1.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ff66, 1.2);
      dirLight.position.set(30, 60, 20);
      scene.add(dirLight);

      lobbyGroup = new THREE.Group();
      gameGroup = new THREE.Group();
      scene.add(lobbyGroup);
      scene.add(gameGroup);

      buildCyberParkLobby();
      buildParkourGameMap();
      gameGroup.visible = false;

      player = createHumanoidAvatar(0xff0055, 0x00ffff);
      player.group.position.set(0, 0.5, 0); 
      scene.add(player.group);
      playerLimbs = player.limbs;

      cameraPivot = new THREE.Object3D();
      scene.add(cameraPivot);

      setupControls();
      setupTouchEvents();
      setupChat();

      document.getElementById('btn-solo').onclick = () => startGame();
      document.getElementById('btn-join').onclick = () => initPeerAndJoin();

      window.addEventListener('resize', onWindowResize);
    }

    function addCollider(mesh) {
      mesh.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(mesh);
      physicsBoxes.push({ box: box, mesh: mesh });
    }

    function rebuildColliders(group) {
      physicsBoxes = [];
      group.traverse((child) => {
        if (child.isMesh && child.userData && child.userData.isCollider) {
          addCollider(child);
        }
      });
    }

    // --- CYBER PARK LOBİSİ ---
    function buildCyberParkLobby() {
      // Çim Zemin
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(180, 180),
        new THREE.MeshStandardMaterial({ color: 0x0b2612, roughness: 0.8 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.userData = { isCollider: true };
      lobbyGroup.add(floor);

      // Yollar
      const mainPath = new THREE.Mesh(new THREE.PlaneGeometry(16, 180), new THREE.MeshStandardMaterial({ color: 0x1f2e24 }));
      mainPath.rotation.x = -Math.PI / 2; mainPath.position.y = 0.01;
      lobbyGroup.add(mainPath);

      // Havuz
      const pond = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 0.4, 32), new THREE.MeshStandardMaterial({ color: 0x00ffff, roughness: 0.1, transparent: true, opacity: 0.8 }));
      pond.position.set(0, 0.2, 0);
      lobbyGroup.add(pond);

      // --- İSTENENLER: ÇİFT KİŞİLİK BANK & SALINCAK ---
      buildDoubleBench(5, 0, 8, 0);
      buildInteractiveSwing(-8, 0, 8, 0);

      // Portal (Parkur Geçişi)
      const portalFrameGeo = new THREE.TorusGeometry(4, 0.3, 16, 100);
      parkourPortalMesh = new THREE.Mesh(portalFrameGeo, new THREE.MeshBasicMaterial({ color: 0xff0055 }));
      parkourPortalMesh.position.set(0, 4.5, -30);
      lobbyGroup.add(parkourPortalMesh);
    }

    function buildDoubleBench(x, y, z, rotY) {
      const benchGroup = new THREE.Group();
      benchGroup.position.set(x, y, z);
      benchGroup.rotation.y = rotY;

      const benchMat = new THREE.MeshStandardMaterial({ color: 0x1a2e22, roughness: 0.4 });
      const neonMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 0.4 });

      const seat = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.2, 1.0), benchMat);
      seat.position.set(0, 0.45, 0);
      seat.userData = { isCollider: true };
      benchGroup.add(seat);

      const back = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.0, 0.15), benchMat);
      back.position.set(0, 1.0, -0.45);
      benchGroup.add(back);

      const neonStrip = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.08, 0.1), neonMat);
      neonStrip.position.set(0, 0.46, 0.5);
      benchGroup.add(neonStrip);

      const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.45, 0.9), benchMat);
      leg1.position.set(-1.4, 0.225, 0);
      benchGroup.add(leg1);

      const leg2 = leg1.clone();
      leg2.position.set(1.4, 0.225, 0);
      benchGroup.add(leg2);

      lobbyGroup.add(benchGroup);
    }

    function buildInteractiveSwing(x, y, z, rotY) {
      const swingFrameGroup = new THREE.Group();
      swingFrameGroup.position.set(x, y, z);
      swingFrameGroup.rotation.y = rotY;

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.8, roughness: 0.2 });
      const neonMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });

      const postLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.5), frameMat);
      postLeft.position.set(-1.8, 2.25, 0);
      postLeft.rotation.z = -0.15;
      swingFrameGroup.add(postLeft);

      const postRight = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.5), frameMat);
      postRight.position.set(1.8, 2.25, 0);
      postRight.rotation.z = 0.15;
      swingFrameGroup.add(postRight);

      const topBar = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3.8), neonMat);
      topBar.rotation.z = Math.PI / 2;
      topBar.position.set(0, 4.4, 0);
      swingFrameGroup.add(topBar);

      swingPivotGroup = new THREE.Group();
      swingPivotGroup.position.set(0, 4.3, 0);

      const ropeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const ropeL = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 3.4), ropeMat);
      ropeL.position.set(-0.9, -1.7, 0);
      swingPivotGroup.add(ropeL);

      const ropeR = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 3.4), ropeMat);
      ropeR.position.set(0.9, -1.7, 0);
      swingPivotGroup.add(ropeR);

      swingSeatMesh = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.12, 0.8), new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 }));
      swingSeatMesh.position.set(0, -3.4, 0);
      swingSeatMesh.userData = { isCollider: true };
      swingPivotGroup.add(swingSeatMesh);

      swingFrameGroup.add(swingPivotGroup);
      lobbyGroup.add(swingFrameGroup);
    }

    function buildParkourGameMap() {
      const geo = new THREE.BoxGeometry(10, 1, 10);
      const mat = new THREE.MeshStandardMaterial({ color: 0x111122 });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(150, 0, 0);
      m.userData = { isCollider: true };
      gameGroup.add(m);
    }

    function switchMap(targetMap) {
      currentMap = targetMap;
      const zoneVal = document.getElementById('zone-val');
      const gameHud = document.getElementById('game-hud-panel');

      if (targetMap === "parkour") {
        lobbyGroup.visible = false; gameGroup.visible = true;
        rebuildColliders(gameGroup);
        player.group.position.set(150, 1.05, 0);
        zoneVal.innerText = "NEON PARKOUR";
        zoneVal.style.color = "#ff0055";
        gameHud.style.display = "block";
      } else {
        gameGroup.visible = false; lobbyGroup.visible = true;
        rebuildColliders(lobbyGroup);
        player.group.position.set(0, 0.5, 0);
        zoneVal.innerText = "CYBER PARK";
        zoneVal.style.color = "#00ff66";
        gameHud.style.display = "none";
      }
    }

    function createHumanoidAvatar(suitColor, visorColor) {
      const group = new THREE.Group();
      const limbs = {};

      const suitMat = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.3 });
      const visorMat = new THREE.MeshBasicMaterial({ color: visorColor });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.85), suitMat);
      torso.position.y = 1.225; 
      group.add(torso);
      limbs.torso = torso;

      const headGroup = new THREE.Group();
      headGroup.position.y = 1.8;
      headGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), suitMat));
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.08, 0.15), visorMat);
      visor.position.set(0, 0.02, 0.12);
      headGroup.add(visor);
      group.add(headGroup);
      limbs.head = headGroup;

      function createLimb(xOffset, yPos, length, radius) {
        const pivot = new THREE.Group();
        pivot.position.set(xOffset, yPos, 0);
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 0.85, length), suitMat);
        mesh.position.y = -length / 2;
        pivot.add(mesh);
        group.add(pivot);
        return pivot;
      }

      limbs.leftArm = createLimb(-0.38, 1.55, 0.65, 0.07);
      limbs.rightArm = createLimb(0.38, 1.55, 0.65, 0.07);
      limbs.leftLeg = createLimb(-0.16, 0.8, 0.8, 0.09);
      limbs.rightLeg = createLimb(0.16, 0.8, 0.8, 0.09);

      return { group, limbs };
    }

    function checkInteractions() {
      if (currentMap !== "lobby") return;

      const pPos = player.group.position;
      const prompt = document.getElementById('interaction-prompt');
      const interactBtn = document.getElementById('interact-btn');
      const pushBtn = document.getElementById('push-btn');

      if (isSeated) {
        prompt.style.display = 'block';
        prompt.innerText = "E - Ayağa Kalk";
        interactBtn.style.display = 'flex';
        interactBtn.innerText = "KALK";
        pushBtn.style.display = 'none';
        return;
      }

      // Bank Yakınlığı
      const benchDist = pPos.distanceTo(new THREE.Vector3(5, 0.5, 8));
      if (benchDist < 2.2) {
        prompt.style.display = 'block';
        prompt.innerText = "E - Banka Otur";
        interactBtn.style.display = 'flex';
        interactBtn.innerText = "OTUR";
        activeInteraction = (pPos.x < 5) ? 'bench_left' : 'bench_right';
        return;
      }

      // Salıncak Yakınlığı
      const swingPos = new THREE.Vector3(-8, 0.5, 8);
      const swingDist = pPos.distanceTo(swingPos);

      if (swingDist < 2.5) {
        prompt.style.display = 'block';
        prompt.innerText = "E - Salıncağa Otur | F - Salıncağı Salla";
        interactBtn.style.display = 'flex';
        interactBtn.innerText = "SALLAN";
        pushBtn.style.display = 'flex';
        pushBtn.innerText = "SALLA";
        activeInteraction = 'swing';
        canPushSwing = true;
        return;
      }

      // Portal Kontrolü
      const portalDist = pPos.distanceTo(parkourPortalMesh.position);
      if (portalDist < 4.0) {
        prompt.style.display = 'block';
        prompt.innerText = "E - Parkura Gir";
        interactBtn.style.display = 'flex';
        interactBtn.innerText = "PORTAL";
        activeInteraction = 'portal';
        return;
      }

      activeInteraction = null;
      canPushSwing = false;
      prompt.style.display = 'none';
      interactBtn.style.display = 'none';
      pushBtn.style.display = 'none';
    }

    function handleInteraction() {
      if (isSeated) {
        isSeated = false;
        player.group.position.y += 0.5;
        player.group.position.z += 0.8;
        return;
      }

      if (activeInteraction === 'bench_left') {
        isSeated = true;
        seatedTargetPos.set(4.2, 0.55, 8.1);
        seatedTargetRot = 0;
        currentSeatObject = 'bench';
      } else if (activeInteraction === 'bench_right') {
        isSeated = true;
        seatedTargetPos.set(5.8, 0.55, 8.1);
        seatedTargetRot = 0;
        currentSeatObject = 'bench';
      } else if (activeInteraction === 'swing') {
        isSeated = true;
        currentSeatObject = 'swing';
      } else if (activeInteraction === 'portal') {
        switchMap(currentMap === "lobby" ? "parkour" : "lobby");
      }
    }

    function pushSwingAction() {
      if (canPushSwing) {
        swingVelocity += 0.15;
        broadcast({ type: 'push_swing', force: 0.15 });
      }
    }

    function updateSwingPhysics(delta) {
      const gravity = 6.0;
      const damping = 0.988;

      const accel = -gravity * Math.sin(swingAngle);
      swingVelocity += accel * delta;
      swingAngle += swingVelocity * delta;
      swingVelocity *= damping;

      if (swingPivotGroup) {
        swingPivotGroup.rotation.x = swingAngle;
      }

      if (isSeated && currentSeatObject === 'swing') {
        const worldSeatPos = new THREE.Vector3();
        swingSeatMesh.getWorldPosition(worldSeatPos);
        player.group.position.copy(worldSeatPos);
        player.group.position.y += 0.35;
        player.group.rotation.y = 0;
      }
    }

    function setupControls() {
      document.addEventListener('keydown', (e) => {
        if (isChatting) return;
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'KeyE': handleInteraction(); break;
          case 'KeyF': pushSwingAction(); break;
          case 'Space': if (canJump && !isSeated) { velocity.y = 9.5; canJump = false; } break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });

      document.getElementById('interact-btn').onclick = handleInteraction;
      document.getElementById('push-btn').onclick = pushSwingAction;
    }

    function animateAvatarLimbs(limbs, isMoving, delta) {
      animTime += delta * 8;

      if (isSeated) {
        limbs.leftLeg.rotation.x = -Math.PI / 2 + 0.2;
        limbs.rightLeg.rotation.x = -Math.PI / 2 + 0.2;
        limbs.leftArm.rotation.x = -0.2;
        limbs.rightArm.rotation.x = -0.2;
        return;
      }

      limbs.leftLeg.rotation.x = isMoving ? Math.sin(animTime) * 0.6 : 0;
      limbs.rightLeg.rotation.x = isMoving ? -Math.sin(animTime) * 0.6 : 0;
      limbs.leftArm.rotation.x = isMoving ? -Math.sin(animTime) * 0.5 : 0;
      limbs.rightArm.rotation.x = isMoving ? Math.sin(animTime) * 0.5 : 0;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      updateSwingPhysics(delta);

      if (isPlaying) {
        checkInteractions();

        if (!isSeated) {
          velocity.x -= velocity.x * 10.0 * delta;
          velocity.z -= velocity.z * 10.0 * delta;
          velocity.y -= 26.0 * delta;

          const moveDir = new THREE.Vector3();
          if (isMobile && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
            moveDir.x = joystickVector.x; moveDir.z = joystickVector.y;
          } else {
            if (moveForward) moveDir.z -= 1;
            if (moveBackward) moveDir.z += 1;
            if (moveLeft) moveDir.x -= 1;
            if (moveRight) moveDir.x += 1;
          }
          if (moveDir.length() > 0) moveDir.normalize();

          const isMoving = moveDir.length() > 0.1;

          if (isMoving) {
            const angle = cameraYaw + Math.atan2(moveDir.x, moveDir.z);
            velocity.x = Math.sin(angle) * 11;
            velocity.z = Math.cos(angle) * 11;
            player.group.rotation.y = angle;
          }

          const targetPos = player.group.position.clone();
          targetPos.x += velocity.x * delta;
          targetPos.z += velocity.z * delta;
          targetPos.y += velocity.y * delta;

          if (targetPos.y <= 0.5) { targetPos.y = 0.5; velocity.y = 0; canJump = true; }
          player.group.position.copy(targetPos);

          animateAvatarLimbs(playerLimbs, isMoving, delta);

          broadcast({
            pos: player.group.position,
            rot: player.group.rotation.y,
            map: currentMap
          });
        } else if (currentSeatObject === 'bench') {
          player.group.position.copy(seatedTargetPos);
          player.group.rotation.y = seatedTargetRot;
          animateAvatarLimbs(playerLimbs, false, delta);
        }

        cameraPivot.position.copy(player.group.position);
        cameraPivot.position.y += 1.2;

        camera.position.x = cameraPivot.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        camera.position.z = cameraPivot.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);
        camera.position.y = cameraPivot.position.y + cameraDistance * Math.sin(cameraPitch);
        camera.lookAt(cameraPivot.position);
      }

      renderer.render(scene, camera);
    }

    let clock = new THREE.Clock();

    function setupTouchEvents() {
      const joystickZone = document.getElementById('joystick-zone');
      const joystickKnob = document.getElementById('joystick-knob');
      const cameraZone = document.getElementById('touch-camera-zone');

      let joystickTouchId = null, cameraTouchId = null;
      let lastTouchX = 0, lastTouchY = 0;

      joystickZone.addEventListener('touchstart', (e) => {
        if (joystickTouchId !== null) return;
        const touch = e.changedTouches[0];
        joystickTouchId = touch.identifier;
        updateJoystick(touch);
      });

      joystickZone.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) updateJoystick(touch);
        }
      });

      const resetJoystick = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickVector = { x: 0, y: 0 };
          }
        }
      };

      joystickZone.addEventListener('touchend', resetJoystick);
      joystickZone.addEventListener('touchcancel', resetJoystick);

      function updateJoystick(touch) {
        const rect = joystickZone.getBoundingClientRect();
        let dx = touch.clientX - (rect.left + 55);
        let dy = touch.clientY - (rect.top + 55);
        let dist = Math.hypot(dx, dy);

        if (dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickVector.x = dx / 35; joystickVector.y = dy / 35;
      }

      cameraZone.addEventListener('touchstart', (e) => {
        if (cameraTouchId !== null) return;
        const touch = e.changedTouches[0];
        cameraTouchId = touch.identifier;
        lastTouchX = touch.clientX; lastTouchY = touch.clientY;
      });

      cameraZone.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === cameraTouchId) {
            cameraYaw -= (touch.clientX - lastTouchX) * 0.005;
            cameraPitch -= (touch.clientY - lastTouchY) * 0.005;
            cameraPitch = Math.max(-0.2, Math.min(1.0, cameraPitch));
            lastTouchX = touch.clientX; lastTouchY = touch.clientY;
          }
        }
      });

      const resetCamera = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === cameraTouchId) cameraTouchId = null;
        }
      };

      cameraZone.addEventListener('touchend', resetCamera);
      cameraZone.addEventListener('touchcancel', resetCamera);

      document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (canJump && !isSeated) { velocity.y = 9.5; canJump = false; }
      });
    }

    function setupChat() {
      const input = document.getElementById('chat-input');
      input.addEventListener('focus', () => { isChatting = true; });
      input.addEventListener('blur', () => { isChatting = false; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim() !== '') {
          addChatMessage('Sen', input.value.trim());
          broadcast({ type: 'chat', msg: input.value.trim() });
          input.value = ''; input.blur();
        }
      });
    }

    function addChatMessage(user, msg) {
      const messages = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<span style="color:#00ff66;">[${user}]:</span> ${msg}`;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    // P2P / Çok Oyunculu Altyapı
    function initPeerAndJoin() {
      const joinId = document.getElementById('join-id-input').value.trim();
      peer = new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById('my-peer-id').innerText = id;
        document.getElementById('peer-status').innerText = "ONLINE";
        document.getElementById('peer-status').style.color = "#00ff66";

        if (joinId !== "") {
          connectToPeer(joinId);
        }
        startGame();
      });

      peer.on('connection', (conn) => {
        setupConnection(conn);
      });
    }

    function connectToPeer(id) {
      const conn = peer.connect(id);
      setupConnection(conn);
    }

    function setupConnection(conn) {
      connections[conn.peer] = conn;

      conn.on('data', (data) => {
        handlePeerData(conn.peer, data);
      });

      conn.on('close', () => {
        if (remotePlayers[conn.peer]) {
          scene.remove(remotePlayers[conn.peer].group);
          delete remotePlayers[conn.peer];
        }
        delete connections[conn.peer];
      });
    }

    function broadcast(data) {
      for (let id in connections) {
        connections[id].send(data);
      }
    }

    function handlePeerData(peerId, data) {
      if (data.type === 'chat') {
        addChatMessage(peerId.substring(0, 4), data.msg);
        return;
      }
      if (data.type === 'push_swing') {
        swingVelocity += data.force;
        return;
      }

      if (!remotePlayers[peerId]) {
        const remoteAvatar = createHumanoidAvatar(0x00ffff, 0xff0055);
        scene.add(remoteAvatar.group);
        remotePlayers[peerId] = remoteAvatar;
      }

      const rp = remotePlayers[peerId];
      rp.group.position.copy(data.pos);
      rp.group.rotation.y = data.rot;
      rp.group.visible = (data.map === currentMap);
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(myPeerId);
      document.getElementById('copy-btn').innerText = "KOPYALANDI!";
      setTimeout(() => { document.getElementById('copy-btn').innerText = "KOPYALA"; }, 2000);
    }

    function triggerEmote(type) {
      addChatMessage('Sen', type === 'wave' ? '👋 El salladı' : '🕺 Dans ediyor!');
      broadcast({ type: 'chat', msg: type === 'wave' ? '👋 El salladı' : '🕺 Dans ediyor!' });
    }

    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      isPlaying = true;
      switchMap("lobby");
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
