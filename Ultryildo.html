<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Retro Cyberpunk Metaverse 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    /* HUD & UI */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 5;
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .stats { color: #00ffff; font-size: 20px; font-weight: bold; text-shadow: 0 0 8px #00ffff; }
    
    /* Chat Box */
    #chat-container {
      position: absolute; bottom: 20px; left: 20px; width: 350px;
      background: rgba(10, 10, 20, 0.85); border: 1px solid #00ffff;
      border-radius: 8px; padding: 10px; pointer-events: auto;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
    }
    #chat-messages {
      height: 120px; overflow-y: auto; color: #fff; font-size: 14px;
      margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px;
    }
    #chat-input {
      width: 100%; background: #000; border: 1px solid #ff0055;
      color: #00ffff; padding: 8px; font-family: inherit; font-size: 14px;
      outline: none;
    }

    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 10;
      cursor: pointer;
    }
    h1 { font-size: 50px; color: #ff0055; text-shadow: 0 0 15px #ff0055; margin-bottom: 10px; text-align: center; }
    p { font-size: 16px; color: #aaa; margin-bottom: 20px; text-align: center; line-height: 1.5; }
    .btn { padding: 12px 30px; font-size: 20px; background: #ff0055; color: #fff; border: none; cursor: pointer; font-family: inherit; font-weight: bold; }
    .btn:hover { background: #ff3377; box-shadow: 0 0 15px #ff0055; }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>CYBER METAVERSE 3D</h1>
    <p>3. ŞAHIS DÜNYAYA HOŞ GELDİNİZ<br>WASD: Hareket | Fare: Kamerayı Çevir | Boşluk: Zıpla | T veya Enter: Chat</p>
    <button class="btn" id="start-btn">METAVERSE'E GİRİŞ YAP</button>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="stats">
        <div>BÖLGE: <span id="zone-val" style="color:#ff0055;">MERKEZ PLAZA</span></div>
        <div>ONLINE AVATARLAR: <span>12</span></div>
      </div>
    </div>

    <div id="chat-container">
      <div id="chat-messages">
        <div><span style="color:#ff0055;">[Sistem]:</span> Cyber Metaverse'e hoş geldiniz!</div>
      </div>
      <input type="text" id="chat-input" placeholder="Mesaj yazın (Enter)..." />
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <script>
    let scene, camera, renderer;
    let player, playerBody, cameraPivot;
    let isPlaying = false;
    let isChatting = false;

    // Kontroller
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let canJump = false;

    // Kamera Kontrolleri
    let cameraYaw = 0;
    let cameraPitch = 0.3;
    const cameraDistance = 6;

    function init() {
      const container = document.getElementById('canvas-container');

      // Sahne Kurulumu (ULTRAKILL Stilinde Karanlık/Neon)
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020205);
      scene.fog = new THREE.FogExp2(0x020205, 0.02);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Işıklar
      const ambientLight = new THREE.AmbientLight(0x221133);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // Metaverse Alanları ve Oyuncu Oluşturma
      createMetaverseWorld();
      createPlayer();

      setupControls();
      setupChat();

      window.addEventListener('resize', onWindowResize);
    }

    // --- METAVERSE DÜNYASI VE YAPILARI ---
    function createMetaverseWorld() {
      // Retro Izgara Zemin (100x100)
      const floorGeo = new THREE.PlaneGeometry(120, 120, 30, 30);
      const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x050510, 
        wireframe: true,
        emissive: 0x110022 
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // 1. Merkez Portal (Işınlanma Alanı)
      const portalGeo = new THREE.TorusGeometry(3, 0.2, 16, 100);
      const portalMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
      const portal = new THREE.Mesh(portalGeo, portalMat);
      portal.position.set(0, 3.5, -20);
      scene.add(portal);

      const portalLight = new THREE.PointLight(0x00ffff, 3, 15);
      portalLight.position.set(0, 3.5, -20);
      scene.add(portalLight);

      // 2. Sahne / Etkinlik Alanı (Podyum)
      const stageGeo = new THREE.CylinderGeometry(8, 10, 1, 32);
      const stageMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x330011 });
      const stage = new THREE.Mesh(stageGeo, stageMat);
      stage.position.set(25, 0.5, 10);
      scene.add(stage);

      // 3. Statik Diğer Avatar/NPC'ler (Metaverse Hissiyatı)
      createNPC(-10, 10, 0xffcc00);
      createNPC(15, -15, 0x00ff66);
    }

    function createNPC(x, z, color) {
      const npcGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(0.8, 1.8, 0.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: color });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.9;

      const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
      const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.1;

      npcGroup.add(body);
      npcGroup.add(head);
      npcGroup.position.set(x, 0, z);
      scene.add(npcGroup);
    }

    // --- 3. ŞAHIS OYUNCU (AVATAR) OLUŞTURMA ---
    function createPlayer() {
      player = new THREE.Group();

      // Gövde
      const bodyGeo = new THREE.BoxGeometry(0.8, 1.6, 0.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2 });
      playerBody = new THREE.Mesh(bodyGeo, bodyMat);
      playerBody.position.y = 0.8;
      player.add(playerBody);

      // Baş (Kask)
      const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const headMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.85;
      player.add(head);

      scene.add(player);

      // Kamera Pivotu (Kamerayı karaktere bağlayan sanal kol)
      cameraPivot = new THREE.Object3D();
      scene.add(cameraPivot);
    }

    // --- KONTROLLER VE FARE TAKİBİ ---
    function setupControls() {
      const startScreen = document.getElementById('start-screen');
      startScreen.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isPlaying = true;
          startScreen.style.display = 'none';
        } else if (!isChatting) {
          isPlaying = false;
          startScreen.style.display = 'flex';
        }
      });

      // 3. Şahıs Kamera Döndürme
      document.addEventListener('mousemove', (e) => {
        if (!isPlaying || isChatting) return;

        cameraYaw -= e.movementX * 0.003;
        cameraPitch -= e.movementY * 0.003;

        // Dikey bakış açısını sınırla (Yere veya tavana gömülmemesi için)
        cameraPitch = Math.max(-0.2, Math.min(1.2, cameraPitch));
      });

      // Tuş Basışları
      document.addEventListener('keydown', (e) => {
        if (isChatting) return;

        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': 
            if (canJump) { velocity.y = 10; canJump = false; }
            break;
          case 'KeyT':
            e.preventDefault();
            focusChat();
            break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });
    }

    // --- SOHBET (CHAT) SİSTEMİ ---
    function setupChat() {
      const input = document.getElementById('chat-input');
      
      input.addEventListener('focus', () => {
        isChatting = true;
        document.exitPointerLock();
      });

      input.addEventListener('blur', () => {
        isChatting = false;
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim() !== '') {
          addChatMessage('Sen', input.value.trim());
          input.value = '';
          input.blur();
          document.body.requestPointerLock();
        }
      });
    }

    function focusChat() {
      const input = document.getElementById('chat-input');
      input.focus();
    }

    function addChatMessage(user, msg) {
      const messages = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<span style="color:#00ffff;">[${user}]:</span> ${msg}`;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    // --- OYUN DÖNGÜSÜ VE FİZİK ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (isPlaying) {
        // 1. Hareket Hesaplaması
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 25.0 * delta; // Yerçekimi

        // Kameranın yönüne göre hareket açılarını al
        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.z -= 1;
        if (moveBackward) moveDir.z += 1;
        if (moveLeft) moveDir.x -= 1;
        if (moveRight) moveDir.x += 1;
        moveDir.normalize();

        if (moveForward || moveBackward || moveLeft || moveRight) {
          // Kameranın y eksenindeki açısını hareket yönüne uygula
          const angle = cameraYaw + Math.atan2(moveDir.x, moveDir.z);
          
          velocity.x = Math.sin(angle) * 15;
          velocity.z = Math.cos(angle) * 15;

          // Karakteri gittiği yöne döndür
          player.rotation.y = angle + Math.PI;
        }

        player.position.x += velocity.x * delta;
        player.position.z += velocity.z * delta;
        player.position.y += velocity.y * delta;

        // Zemin Kontrolü
        if (player.position.y < 0) {
          velocity.y = 0;
          player.position.y = 0;
          canJump = true;
        }

        // 2. 3. Şahıs Kamera Takibi (Third-Person Camera Update)
        cameraPivot.position.copy(player.position);
        cameraPivot.position.y += 1.6; // Karakterin baş hizası

        // Kamerayı pivot etrafında döndür ve konumlandır
        camera.position.x = cameraPivot.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        camera.position.z = cameraPivot.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);
        camera.position.y = cameraPivot.position.y + cameraDistance * Math.sin(cameraPitch);

        camera.lookAt(cameraPivot.position);

        // 3. Bölge Kontrolü (Portal / Plaza algılama)
        const distToPortal = player.position.distanceTo(new THREE.Vector3(0, 0, -20));
        const zoneElem = document.getElementById('zone-val');
        if (distToPortal < 5) {
          zoneElem.innerText = "IŞINLANMA PORTALI";
          zoneElem.style.color = "#00ffff";
        } else {
          zoneElem.innerText = "MERKEZ PLAZA";
          zoneElem.style.color = "#ff0055";
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
</html>
