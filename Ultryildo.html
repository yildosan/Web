<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bank ve Fizikli Oturma Simülasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #ui span {
            background: #ffcc00;
            color: #111;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            border: 1px solid rgba(0,0,0,0.4);
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            font-size: 13px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #ffcc00;
            pointer-events: none;
            line-height: 1.5;
        }
        #info-panel h3 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    
    <div id="info-panel">
        <h3>Etkileşimli 3D Bank Sahnesi</h3>
        • <b>WASD / Ok Tuşları:</b> Hareket Et<br>
        • <b>Mouse:</b> Etrafa Bak<br>
        • <b>E Tuşu:</b> Banka Otur / Kalk
    </div>

    <div id="ui">Banka yaklaşın ve <span>E</span> tuşuna basın</div>

    <!-- Üçüncü parti kütüphaneler (Three.js, Cannon.js, GSAP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // --- 1. SAHNE, FİZİK VE TEMEL BİLEŞENLER ---
        const container = document.getElementById('canvas-container');
        const uiElement = document.getElementById('ui');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Cannon.js Fizik Dünyası
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        // --- 2. IŞIKLAR VE ÇEVRE ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
        dirLight.position.set(15, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Zemin
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x1e293b, 
            roughness: 0.8,
            metalness: 0.2
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const floorBody = new CANNON.Body({
            mass: 0,
            shape: new CANNON.Plane()
        });
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        // --- 3. DETAYLI 3D BANK MODELİ OLUŞTURMA ---
        function createDetailedBench(x, y, z, rotationY = 0) {
            const benchGroup = new THREE.Group();
            
            // Materyaller
            const woodMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8b5a2b, 
                roughness: 0.5,
                metalness: 0.1 
            });
            const ironMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x222222, 
                roughness: 0.3,
                metalness: 0.8 
            });

            // Oturma tahtaları (4 adet çıta)
            for (let i = 0; i < 4; i++) {
                const slatGeo = new THREE.BoxGeometry(2.0, 0.06, 0.11);
                const slat = new THREE.Mesh(slatGeo, woodMaterial);
                slat.position.set(0, 0.45 + (i * 0.13), -0.05 + (i * 0.12));
                slat.castShadow = true;
                slat.receiveShadow = true;
                benchGroup.add(slat);
            }

            // Sırtlık tahtaları (3 adet çıta)
            for (let i = 0; i < 3; i++) {
                const backSlatGeo = new THREE.BoxGeometry(2.0, 0.08, 0.05);
                const backSlat = new THREE.Mesh(backSlatGeo, woodMaterial);
                backSlat.position.set(0, 0.75 + (i * 0.12), -0.32);
                backSlat.rotation.x = -0.15;
                backSlat.castShadow = true;
                backSlat.receiveShadow = true;
                benchGroup.add(backSlat);
            }

            // Demir Ayaklar ve Yan Profiller
            const legGeo = new THREE.BoxGeometry(0.08, 0.45, 0.65);
            const leftLeg = new THREE.Mesh(legGeo, ironMaterial);
            leftLeg.position.set(-0.9, 0.22, -0.05);
            leftLeg.castShadow = true;
            benchGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, ironMaterial);
            rightLeg.position.set(0.9, 0.22, -0.05);
            rightLeg.castShadow = true;
            benchGroup.add(rightLeg);

            benchGroup.position.set(x, y, z);
            benchGroup.rotation.y = rotationY;
            scene.add(benchGroup);

            // Fiziksel Çarpışma Kutusu (Cannon.js)
            const benchShape = new CANNON.Box(new CANNON.Vec3(1.0, 0.45, 0.4));
            const benchBody = new CANNON.Body({
                mass: 0, // Statik
                position: new CANNON.Vec3(x, y + 0.45, z)
            });
            // Bank rotasyonunu fizik gövdesine uygular
            benchBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotationY);
            benchBody.addShape(benchShape);
            world.addBody(benchBody);

            return {
                group: benchGroup,
                position: new THREE.Vector3(x, y, z),
                rotationY: rotationY,
                sitTarget: new THREE.Vector3(x, y + 0.45, z).add(new THREE.Vector3(0, 0, 0.3).applyAxisAngle(new THREE.Vector3(0,1,0), rotationY))
            };
        }

        // Sahneye birkaç bank ekleyelim
        const benches = [
            createDetailedBench(0, 0, -4, 0),
            createDetailedBench(4, 0, 0, -Math.PI / 2),
            createDetailedBench(-4, 0, 2, Math.PI / 4)
        ];

        // --- 4. KARAKTER MODELİ VE KONTROL SİSTEMİ ---
        const characterGroup = new THREE.Group();
        
        // Basit kapsül/figür karakter temsili
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 });
        const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.5 });
        
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.9, 16), bodyMat);
        torso.position.y = 0.95;
        torso.castShadow = true;
        characterGroup.add(torso);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), headMat);
        head.position.y = 1.55;
        head.castShadow = true;
        characterGroup.add(head);

        scene.add(characterGroup);

        // Karakter Fizik Gövdesi (Kapsül benzeri küre/silindir kombinasyonu)
        const charShape = new CANNON.Cylinder(0.3, 0.3, 1.4, 8);
        const charBody = new CANNON.Body({
            mass: 70,
            position: new CANNON.Vec3(0, 1, 3),
            fixedRotation: true // Devrilmeyi önle
        });
        charBody.addShape(charShape);
        world.addBody(charBody);

        // --- 5. ETKİLEŞİM VE ANİMASYON MANTIĞI ---
        let gameState = {
            isSitting: false,
            activeBench: null,
            transitioning: false
        };

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') keys.w = true;
            if (e.key.toLowerCase() === 'a') keys.a = true;
            if (e.key.toLowerCase() === 's') keys.s = true;
            if (e.key.toLowerCase() === 'd') keys.d = true;
            
            if (e.key.toLowerCase() === 'e') {
                handleInteraction();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'w') keys.w = false;
            if (e.key.toLowerCase() === 'a') keys.a = false;
            if (e.key.toLowerCase() === 's') keys.s = false;
            if (e.key.toLowerCase() === 'd') keys.d = false;
        });

        // Mouse Kontrolleri (FPS / Kamera Açısı)
        let isPointerLocked = false;
        let pitch = 0;
        let yaw = 0;

        container.addEventListener('click', () => {
            container.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === container;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked || gameState.isSitting) return;
            const sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        });

        // En yakın bankı bulma fonksiyonu
        function getNearestBench() {
            let nearest = null;
            let minDist = 2.2; // Etkileşim mesafesi
            benches.forEach(bench => {
                const dist = characterGroup.position.distanceTo(bench.position);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = bench;
                }
            });
            return nearest;
        }

        // Oturma / Kalkma Fonksiyonu (GSAP Animasyonları ile)
        function handleInteraction() {
            if (gameState.transitioning) return;

            if (!gameState.isSitting) {
                const targetBench = getNearestBench();
                if (targetBench) {
                    gameState.transitioning = true;
                    gameState.activeBench = targetBench;
                    
                    // Fizik motorunu devre dışı bırakıp karakteri sabitleyelim
                    charBody.velocity.set(0, 0, 0);
                    charBody.mass = 0; 
                    world.remove(charBody);

                    // GSAP ile kusursuz yumuşak oturma animasyonu
                    gsap.to(characterGroup.position, {
                        x: targetBench.sitTarget.x,
                        y: targetBench.sitTarget.y - 0.2, // Oturma derinliği
                        z: targetBench.sitTarget.z,
                        duration: 0.8,
                        ease: "power2.out"
                    });

                    gsap.to(characterGroup.rotation, {
                        x: 0,
                        y: targetBench.rotationY,
                        z: 0,
                        duration: 0.8,
                        onComplete: () => {
                            gameState.isSitting = true;
                            gameState.transitioning = false;
                            uiElement.innerHTML = "Ayağa kalkmak için <span>E</span> tuşuna basın";
                        }
                    });
                }
            } else {
                // Kalkma İşlemi
                gameState.transitioning = true;
                
                const standUpPos = gameState.activeBench.sitTarget.clone().add(new THREE.Vector3(0, 0.5, 0.8).applyAxisAngle(new THREE.Vector3(0,1,0), gameState.activeBench.rotationY));

                gsap.to(characterGroup.position, {
                    x: standUpPos.x,
                    y: standUpPos.y,
                    z: standUpPos.z,
                    duration: 0.6,
                    ease: "power2.inOut",
                    onComplete: () => {
                        // Fizik dünyasını tekrar aktif et
                        charBody.position.set(standUpPos.x, standUpPos.y, standUpPos.z);
                        charBody.mass = 70;
                        world.addBody(charBody);

                        gameState.isSitting = false;
                        gameState.activeBench = null;
                        gameState.transitioning = false;
                        uiElement.innerHTML = "Banka yaklaşın ve <span>E</span> tuşuna basın";
                    }
                });
            }
        }

        // --- 6. OYUN DÖNGÜSÜ (LOOP) ---
        const clock = new THREE.Clock();
        const moveSpeed = 5.0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (!gameState.isSitting && !gameState.transitioning) {
                // Klavye yön tuşlarına göre hareket vektörü hesaplama
                const moveDir = new THREE.Vector3();
                if (keys.w) moveDir.z -= 1;
                if (keys.s) moveDir.z += 1;
                if (keys.a) moveDir.x -= 1;
                if (keys.d) moveDir.x += 1;
                
                moveDir.normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                // Fiziksel hız güncellemesi
                charBody.velocity.x = moveDir.x * moveSpeed;
                charBody.velocity.z = moveDir.z * moveSpeed;

                // Fizik dünyasını ilerlet
                world.step(1 / 60, delta, 3);

                // Mesh pozisyonunu fizik gövdesine eşitle
                characterGroup.position.copy(charBody.position);
                characterGroup.position.y -= 0.75; // Merkez hizalaması için

                if (moveDir.lengthSq() > 0) {
                    // Karakteri hareket yönüne döndür
                    const targetAngle = Math.atan2(moveDir.x, moveDir.z);
                    characterGroup.rotation.y = targetAngle;
                }

                // Yakında bank var mı kontrol et ve UI güncelle
                const nearby = getNearestBench();
                if (nearby) {
                    uiElement.style.opacity = "1";
                    uiElement.innerHTML = "Banka oturmak için <span>E</span> tuşuna basın";
                } else {
                    uiElement.style.opacity = "0.8";
                    uiElement.innerHTML = "WASD ile hareket edin";
                }
            } else if (gameState.isSitting) {
                // Otururken fizik motoru çalışmaz, sabit kalır
                world.step(1 / 60, delta, 3);
            }

            // Kamera Takip Mekanizması (3. Şahıs / Orbit Karması)
            const idealOffset = new THREE.Vector3(
                Math.sin(yaw) * 4.5,
                2.2 - pitch * 3,
                Math.cos(yaw) * 4.5
            );
            const targetCameraPos = characterGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)).add(idealOffset);
            
            camera.position.lerp(targetCameraPos, 0.1);
            
            const lookTarget = characterGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        animate();

        // Pencere Boyutu Ayarlaması
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
