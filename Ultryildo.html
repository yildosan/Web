<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyberpunk Metaverse 3D - Mobile Fixed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Courier New', monospace; user-select: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 5;
    }
    
    .top-bar { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .stats { color: #00ffff; font-size: 12px; font-weight: bold; text-shadow: 0 0 8px #00ffff; }
    
    .room-code-container {
      display: inline-flex; align-items: center; gap: 6px; pointer-events: auto; margin-top: 2px;
    }
    .copy-btn {
      background: #ff0055; color: #fff; border: none; padding: 3px 6px;
      font-family: inherit; font-size: 10px; font-weight: bold; cursor: pointer;
      border-radius: 4px; transition: all 0.2s; text-shadow: none;
    }

    #emote-bar {
      display: flex; gap: 6px; pointer-events: auto; margin-top: 5px;
    }
    .emote-btn {
      background: rgba(10, 10, 20, 0.85); color: #00ffff; border: 1px solid #00ffff;
      padding: 4px 8px; font-family: inherit; font-size: 11px;
      cursor: pointer; font-weight: bold; border-radius: 4px;
    }

    #chat-container {
      width: 220px; pointer-events: auto;
      background: rgba(10, 10, 20, 0.85); border: 1px solid #00ffff;
      border-radius: 6px; padding: 6px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
      margin-bottom: 5px;
    }
    #chat-messages {
      height: 65px; overflow-y: auto; color: #fff; font-size: 10px;
      margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px;
    }
    #chat-input {
      width: 100%; background: #000; border: 1px solid #ff0055;
      color: #00ffff; padding: 4px; font-family: inherit; font-size: 11px;
      outline: none;
    }

    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 10;
      padding: 20px;
    }
    h1 { font-size: 26px; color: #ff0055; text-shadow: 0 0 15px #ff0055; margin-bottom: 8px; text-align: center; }
    p { font-size: 11px; color: #aaa; margin-bottom: 15px; text-align: center; line-height: 1.4; }
    
    .p2p-box {
      background: rgba(20, 20, 35, 0.9); border: 1px solid #00ffff;
      padding: 15px; border-radius: 10px; display: flex; flex-direction: column;
      gap: 10px; width: 100%; max-width: 300px;
    }
    .p2p-input {
      background: #000; border: 1px solid #ff0055; color: #00ffff;
      padding: 8px; font-family: inherit; text-align: center; font-size: 13px; outline: none;
    }
    .btn {
      padding: 10px; font-size: 13px; background: #ff0055; color: #fff;
      border: none; cursor: pointer; font-family: inherit; font-weight: bold;
    }
    .btn-secondary { background: #00ffff; color: #000; }

    /* MOBİL KONTROLLER (ÇAKIŞMALAR ENGELLENDİ) */
    #touch-controls {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 6; display: none;
    }
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(0, 255, 255, 0.15); border: 2px solid rgba(0, 255, 255, 0.5);
      pointer-events: auto; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 30px; left: 30px;
      width: 40px; height: 40px; border-radius: 50%;
      background: #ff0055; box-shadow: 0 0 10px #ff0055;
    }
    #touch-camera-zone {
      position: absolute; top: 0; right: 0; width: 55%; height: 80%;
      pointer-events: auto; touch-action: none;
    }
    #jump-btn {
      position: absolute; bottom: 30px; right: 20px;
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255, 0, 85, 0.85); border: 2px solid #fff;
      color: #fff; font-weight: bold; font-size: 11px;
      display: flex; justify-content: center; align-items: center;
      pointer-events: auto; box-shadow: 0 0 10px #ff0055;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>CYBER METAVERSE</h1>
    <p>
      <b>PC:</b> WASD + Fare | <b>Mobil:</b> Dokunmatik Kontrol<br>
      <b>Chat:</b> Sol Alt Kutu
    </p>

    <div class="p2p-box">
      <button class="btn" onclick="hostGame()">1. ODA KUR (HOST)</button>
      <div style="text-align: center; color: #666; font-size: 10px;">--- VEYA ---</div>
      <input type="text" id="join-id-input" class="p2p-input" placeholder="ODA KODUNU GİRİN" />
      <button class="btn btn-secondary" onclick="joinGame()">2. ODAYA KATIL</button>
    </div>
  </div>

  <div id="touch-controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="touch-camera-zone"></div>
    <div id="jump-btn">ZIPLA</div>
  </div>

  <div id="hud">
    <div class="top-bar">
      <div class="stats">
        <div>BÖLGE: <span id="zone-val" style="color:#ff0055;">PLAZA</span> | BAGLANTI: <span id="peer-status" style="color:#00ffff;">HAZIR</span></div>
        <div class="room-code-container">
          <span>ODA:</span>
          <span id="my-peer-id" style="color:#ffff00;">-</span>
          <button id="copy-btn" class="copy-btn" onclick="copyRoomCode()">KOPYALA</button>
        </div>
      </div>

      <div id="emote-bar">
        <button class="emote-btn" onclick="triggerEmote('wave')">👋 Salla</button>
        <button class="emote-btn" onclick="triggerEmote('dance')">🕺 Dans</button>
        <button class="emote-btn" onclick="triggerEmote('nod')">🔴 Onay</button>
      </div>
    </div>

    <div id="chat-container">
      <div id="chat-messages">
        <div><span style="color:#ff0055;">[Sistem]:</span> Mobil Arayüz Düzeltildi!</div>
      </div>
      <input type="text" id="chat-input" placeholder="Mesaj..." />
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    let scene, camera, renderer;
    let player, playerLimbs = {}, cameraPivot;
    let isPlaying = false;
    let isChatting = false;
    let isMobile = false;

    let peer = null;
    let connections = {};
    let remotePlayers = {};
    let myPeerId = "";

    let currentEmote = null;
    let emoteTimer = 0;

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let joystickVector = { x: 0, y: 0 };
    let velocity = new THREE.Vector3();
    let canJump = false;
    let animTime = 0;

    let cameraYaw = 0;
    let cameraPitch = 0.2;
    const cameraDistance = 6.0;

    function detectDevice() {
      isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth < 768;
      if (isMobile) {
        document.getElementById('touch-controls').style.display = 'block';
      }
    }

    function init() {
      detectDevice();
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020205);
      scene.fog = new THREE.FogExp2(0x020205, 0.02);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x554466);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffff, 1.0);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      createMetaverseWorld();
      
      player = createHumanoidAvatar(0xff0055, 0x00ffff);
      scene.add(player.group);
      playerLimbs = player.limbs;

      cameraPivot = new THREE.Object3D();
      scene.add(cameraPivot);

      setupControls();
      setupTouchEvents();
      setupChat();

      window.addEventListener('resize', onWindowResize);
    }

    function initPeer(customId = null) {
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById('my-peer-id').innerText = id;
        document.getElementById('peer-status').innerText = "ONLINE";
        addChatMessage('Sistem', `Oda Kodu: ${id}`);
      });

      peer.on('connection', (conn) => setupConnection(conn));
      peer.on('error', (err) => console.error("P2P Hata:", err));
    }

    function copyRoomCode() {
      if (!myPeerId || myPeerId === "-") return;
      navigator.clipboard.writeText(myPeerId).then(() => {
        const btn = document.getElementById('copy-btn');
        const origText = btn.innerText;
        btn.innerText = "KOPYALANDI!";
        btn.style.background = "#00ffff";
        btn.style.color = "#000";
        setTimeout(() => {
          btn.innerText = origText;
          btn.style.background = "#ff0055";
          btn.style.color = "#fff";
        }, 2000);
      });
    }

    function hostGame() {
      initPeer();
      startGame();
    }

    function joinGame() {
      const hostId = document.getElementById('join-id-input').value.trim();
      if (!hostId) return alert("Geçerli Oda Kodu girin!");
      initPeer();
      peer.on('open', () => {
        setupConnection(peer.connect(hostId));
        startGame();
      });
    }

    function setupConnection(conn) {
      connections[conn.peer] = conn;
      conn.on('open', () => {
        addChatMessage('Sistem', `Oyuncu bağlandı! [${conn.peer.substring(0, 4)}]`);
        if (!remotePlayers[conn.peer]) {
          const remoteAvatar = createHumanoidAvatar(0x00ff66, 0xffff00);
          scene.add(remoteAvatar.group);
          remotePlayers[conn.peer] = remoteAvatar;
        }
      });

      conn.on('data', (data) => handleNetworkData(conn.peer, data));
      conn.on('close', () => {
        addChatMessage('Sistem', `Oyuncu ayrıldı.`);
        if (remotePlayers[conn.peer]) {
          scene.remove(remotePlayers[conn.peer].group);
          delete remotePlayers[conn.peer];
        }
        delete connections[conn.peer];
      });
    }

    function broadcast(data) {
      Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    function handleNetworkData(peerId, data) {
      const remote = remotePlayers[peerId];
      if (!remote) return;

      if (data.type === 'transform') {
        remote.group.position.set(data.x, data.y, data.z);
        remote.group.rotation.y = data.rotY;
        animateAvatarLimbs(remote.limbs, data.isMoving, data.delta, data.emote);
      }
      else if (data.type === 'chat') {
        addChatMessage(peerId.substring(0, 4), data.text);
        createSpeechBubble(remote.group, data.text);
      }
    }

    function startGame() {
      document.getElementById('start-screen').style.display = 'none';
      isPlaying = true;
      if (!isMobile) {
        document.body.requestPointerLock();
      }
    }

    function createHumanoidAvatar(suitColor, visorColor) {
      const group = new THREE.Group();
      const limbs = {};

      const suitMat = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.3, metalness: 0.2 });
      const jointMat = new THREE.MeshStandardMaterial({ color: 0x151518, roughness: 0.7 });
      const visorMat = new THREE.MeshBasicMaterial({ color: visorColor });

      const torsoGeo = new THREE.CylinderGeometry(0.3, 0.2, 0.85, 12);
      const torso = new THREE.Mesh(torsoGeo, suitMat);
      torso.position.y = 1.15;
      group.add(torso);
      limbs.torso = torso;

      const headGroup = new THREE.Group();
      headGroup.position.y = 1.75;
      
      const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
      const head = new THREE.Mesh(headGeo, suitMat);
      headGroup.add(head);

      const visorGeo = new THREE.BoxGeometry(0.24, 0.08, 0.15);
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 0.02, 0.12);
      headGroup.add(visor);
      
      group.add(headGroup);
      limbs.head = headGroup;

      function createLimb(xOffset, yPos, length, radius) {
        const pivot = new THREE.Group();
        pivot.position.set(xOffset, yPos, 0);

        const meshGeo = new THREE.CylinderGeometry(radius, radius * 0.85, length, 8);
        const mesh = new THREE.Mesh(meshGeo, suitMat);
        mesh.position.y = -length / 2;
        pivot.add(mesh);

        const jointGeo = new THREE.SphereGeometry(radius * 1.1, 8, 8);
        const joint = new THREE.Mesh(jointGeo, jointMat);
        pivot.add(joint);

        group.add(pivot);
        return pivot;
      }

      limbs.leftArm = createLimb(-0.38, 1.45, 0.65, 0.07);
      limbs.rightArm = createLimb(0.38, 1.45, 0.65, 0.07);
      limbs.leftLeg = createLimb(-0.16, 0.75, 0.75, 0.09);
      limbs.rightLeg = createLimb(0.16, 0.75, 0.75, 0.09);

      return { group, limbs };
    }

    function createMetaverseWorld() {
      const floorGeo = new THREE.PlaneGeometry(120, 120, 30, 30);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x050510, wireframe: true, emissive: 0x110022 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const portalGeo = new THREE.TorusGeometry(3, 0.2, 16, 100);
      const portalMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
      const portal = new THREE.Mesh(portalGeo, portalMat);
      portal.position.set(0, 3.5, -20);
      scene.add(portal);

      const stageGeo = new THREE.CylinderGeometry(8, 10, 1, 32);
      const stageMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x330011 });
      const stage = new THREE.Mesh(stageGeo, stageMat);
      stage.position.set(25, 0.5, 10);
      scene.add(stage);
    }

    function createSpeechBubble(targetGroup, text) {
      const oldSprite = targetGroup.getObjectByName("speechBubble");
      if (oldSprite) targetGroup.remove(oldSprite);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 128;

      ctx.fillStyle = 'rgba(10, 10, 25, 0.9)';
      ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 6;
      
      const x = 10, y = 10, w = 492, h = 108, r = 20;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'Bold 28px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      
      let displayText = text.length > 28 ? text.substring(0, 25) + '...' : text;
      ctx.fillText(displayText, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.name = "speechBubble";

      sprite.scale.set(2.4, 0.6, 1);
      sprite.position.set(0, 2.4, 0);

      targetGroup.add(sprite);

      setTimeout(() => {
        if (sprite.parent) sprite.parent.remove(sprite);
      }, 4000);
    }

    function triggerEmote(type) {
      if (!isPlaying) return;
      currentEmote = type;
      emoteTimer = 3.0;
    }

    function setupControls() {
      const startScreen = document.getElementById('start-screen');

      document.addEventListener('pointerlockchange', () => {
        if (!isMobile) {
          if (document.pointerLockElement === document.body) {
            isPlaying = true;
            startScreen.style.display = 'none';
          } else if (!isChatting && peer) {
            isPlaying = false;
            startScreen.style.display = 'flex';
          }
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!isPlaying || isChatting || isMobile) return;
        cameraYaw -= e.movementX * 0.003;
        cameraPitch -= e.movementY * 0.003;
        cameraPitch = Math.max(-0.2, Math.min(1.0, cameraPitch));
      });

      document.addEventListener('keydown', (e) => {
        if (isChatting) return;
        
        switch (e.code) {
          case 'KeyW': moveForward = true; break;
          case 'KeyS': moveBackward = true; break;
          case 'KeyA': moveLeft = true; break;
          case 'KeyD': moveRight = true; break;
          case 'Space': if (canJump) { velocity.y = 8.5; canJump = false; } break;
          case 'Digit1': triggerEmote('wave'); break;
          case 'Digit2': triggerEmote('dance'); break;
          case 'Digit3': triggerEmote('nod'); break;
          case 'KeyT': e.preventDefault(); focusChat(); break;
        }

        if (['KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
          currentEmote = null;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveForward = false; break;
          case 'KeyS': moveBackward = false; break;
          case 'KeyA': moveLeft = false; break;
          case 'KeyD': moveRight = false; break;
        }
      });
    }

    function setupTouchEvents() {
      const joystickZone = document.getElementById('joystick-zone');
      const joystickKnob = document.getElementById('joystick-knob');
      const cameraZone = document.getElementById('touch-camera-zone');
      const jumpBtn = document.getElementById('jump-btn');

      let joystickTouchId = null;
      let cameraTouchId = null;
      let lastTouchX = 0, lastTouchY = 0;

      const center = { x: 50, y: 50 };
      const maxRadius = 35;

      joystickZone.addEventListener('touchstart', (e) => {
        if (joystickTouchId !== null) return;
        const touch = e.changedTouches[0];
        joystickTouchId = touch.identifier;
        updateJoystick(touch);
      });

      joystickZone.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            updateJoystick(touch);
          }
        }
      });

      const resetJoystick = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickVector = { x: 0, y: 0 };
          }
        }
      };

      joystickZone.addEventListener('touchend', resetJoystick);
      joystickZone.addEventListener('touchcancel', resetJoystick);

      function updateJoystick(touch) {
        const rect = joystickZone.getBoundingClientRect();
        let dx = touch.clientX - (rect.left + center.x);
        let dy = touch.clientY - (rect.top + center.y);
        let dist = Math.hypot(dx, dy);

        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickVector.x = dx / maxRadius;
        joystickVector.y = dy / maxRadius;
        currentEmote = null;
      }

      cameraZone.addEventListener('touchstart', (e) => {
        if (cameraTouchId !== null) return;
        const touch = e.changedTouches[0];
        cameraTouchId = touch.identifier;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      });

      cameraZone.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === cameraTouchId) {
            let dx = touch.clientX - lastTouchX;
            let dy = touch.clientY - lastTouchY;

            cameraYaw -= dx * 0.005;
            cameraPitch -= dy * 0.005;
            cameraPitch = Math.max(-0.2, Math.min(1.0, cameraPitch));

            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
          }
        }
      });

      const resetCamera = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === cameraTouchId) {
            cameraTouchId = null;
          }
        }
      };

      cameraZone.addEventListener('touchend', resetCamera);
      cameraZone.addEventListener('touchcancel', resetCamera);

      jumpBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (canJump) {
          velocity.y = 8.5;
          canJump = false;
        }
      });
    }

    function setupChat() {
      const input = document.getElementById('chat-input');
      input.addEventListener('focus', () => { 
        isChatting = true; 
        if (!isMobile) document.exitPointerLock(); 
      });
      input.addEventListener('blur', () => { isChatting = false; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim() !== '') {
          const msg = input.value.trim();
          addChatMessage('Sen', msg);
          createSpeechBubble(player.group, msg);
          broadcast({ type: 'chat', text: msg });

          input.value = '';
          input.blur();
          if (!isMobile) document.body.requestPointerLock();
        }
      });
    }

    function focusChat() { document.getElementById('chat-input').focus(); }

    function addChatMessage(user, msg) {
      const messages = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<span style="color:#00ffff;">[${user}]:</span> ${msg}`;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function animateAvatarLimbs(limbs, isMoving, delta, emoteOverride = null) {
      animTime += delta * (isMoving ? 12 : 3);
      const activeEmote = emoteOverride !== undefined ? emoteOverride : currentEmote;

      limbs.head.rotation.set(0, 0, 0);
      limbs.leftArm.rotation.set(0, 0, 0);
      limbs.rightArm.rotation.set(0, 0, 0);
      limbs.leftLeg.rotation.set(0, 0, 0);
      limbs.rightLeg.rotation.set(0, 0, 0);

      if (activeEmote && !isMoving) {
        if (activeEmote === 'wave') {
          limbs.rightArm.rotation.x = -Math.PI + 0.3;
          limbs.rightArm.rotation.z = Math.sin(animTime * 2) * 0.4;
        } 
        else if (activeEmote === 'dance') {
          limbs.leftArm.rotation.x = Math.sin(animTime * 2) * 1.2;
          limbs.rightArm.rotation.x = -Math.sin(animTime * 2) * 1.2;
          limbs.leftLeg.rotation.x = Math.cos(animTime * 2) * 0.5;
          limbs.rightLeg.rotation.x = -Math.cos(animTime * 2) * 0.5;
          limbs.torso.position.y = 1.15 + Math.sin(animTime * 4) * 0.1;
          limbs.head.rotation.z = Math.sin(animTime * 2) * 0.2;
        } 
        else if (activeEmote === 'nod') {
          limbs.head.rotation.x = Math.sin(animTime * 3) * 0.3;
        }
        return;
      }

      if (isMoving) {
        limbs.leftLeg.rotation.x = Math.sin(animTime) * 0.6;
        limbs.rightLeg.rotation.x = -Math.sin(animTime) * 0.6;
        limbs.leftArm.rotation.x = -Math.sin(animTime) * 0.5;
        limbs.rightArm.rotation.x = Math.sin(animTime) * 0.5;
        limbs.torso.position.y = 1.15 + Math.abs(Math.sin(animTime * 2)) * 0.04;
      } else {
        limbs.leftArm.rotation.x = Math.sin(animTime) * 0.05;
        limbs.rightArm.rotation.x = -Math.sin(animTime) * 0.05;
        limbs.torso.position.y = 1.15 + Math.sin(animTime * 0.5) * 0.02;
      }
    }

    let clock = new THREE.Clock();
    let networkTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      if (isPlaying) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 25.0 * delta;

        const moveDir = new THREE.Vector3();

        if (isMobile && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
          moveDir.x = joystickVector.x;
          moveDir.z = joystickVector.y;
        } else {
          if (moveForward) moveDir.z -= 1;
          if (moveBackward) moveDir.z += 1;
          if (moveLeft) moveDir.x -= 1;
          if (moveRight) moveDir.x += 1;
        }
        
        if (moveDir.length() > 0) moveDir.normalize();

        const isMoving = moveDir.length() > 0.1;

        if (isMoving) {
          const angle = cameraYaw + Math.atan2(moveDir.x, moveDir.z);
          velocity.x = Math.sin(angle) * 11;
          velocity.z = Math.cos(angle) * 11;
          player.group.rotation.y = angle;
        }

        player.group.position.x += velocity.x * delta;
        player.group.position.z += velocity.z * delta;
        player.group.position.y += velocity.y * delta;

        if (player.group.position.y < 0) {
          velocity.y = 0;
          player.group.position.y = 0;
          canJump = true;
        }

        if (currentEmote) {
          emoteTimer -= delta;
          if (emoteTimer <= 0) currentEmote = null;
        }

        animateAvatarLimbs(playerLimbs, isMoving, delta, currentEmote);

        networkTimer += delta;
        if (networkTimer > 0.033) {
          networkTimer = 0;
          broadcast({
            type: 'transform',
            x: player.group.position.x,
            y: player.group.position.y,
            z: player.group.position.z,
            rotY: player.group.rotation.y,
            isMoving: isMoving,
            emote: currentEmote,
            delta: delta
          });
        }

        cameraPivot.position.copy(player.group.position);
        cameraPivot.position.y += 1.3;

        camera.position.x = cameraPivot.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        camera.position.z = cameraPivot.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);
        camera.position.y = cameraPivot.position.y + cameraDistance * Math.sin(cameraPitch);

        camera.lookAt(cameraPivot.position);

        const distToPortal = player.group.position.distanceTo(new THREE.Vector3(0, 0, -20));
        const zoneElem = document.getElementById('zone-val');
        if (distToPortal < 5) {
          zoneElem.innerText = "PORTAL";
          zoneElem.style.color = "#00ffff";
        } else {
          zoneElem.innerText = "PLAZA";
          zoneElem.style.color = "#ff0055";
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
</html>
