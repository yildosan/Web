<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cubeCode - Kabartmalı Mobil Prototip</title>
    <!-- QR Kod Üretici Kütüphane -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* Mobilde sayfanın kaymasını engeller */
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #58a6ff;
            letter-spacing: 1px;
            text-align: center;
        }
        p {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 15px;
        }

        /* 3D Sahne Alanı */
        .scene {
            width: 240px;
            height: 240px;
            perspective: 1000px;
            cursor: grab;
            margin-bottom: 30px;
        }
        .scene:active {
            cursor: grabbing;
        }

        /* Küp */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-120px);
            transition: transform 0.05s ease-out;
        }

        /* Kabartmalı Ana Yüzey */
        .cube-face {
            position: absolute;
            width: 240px;
            height: 240px;
            background: linear-gradient(135deg, #21262d, #161b22);
            border: 4px solid #30363d;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Kabartma ve Derinlik Efekti (Box-shadow ile dışarı taşma hissi) */
            box-shadow: 
                inset 0 4px 8px rgba(255,255,255,0.08), 
                inset 0 -6px 12px rgba(0,0,0,0.6),
                0 15px 35px rgba(0,0,0,0.7);
            backface-visibility: hidden;
            padding: 12px;
        }

        .cube-face h3 {
            font-size: 0.8rem;
            color: #58a6ff;
            margin-bottom: 8px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* QR Kodun Yerleştiği Kabartmalı Panel (Çukurdan dışarı kabaran plaka hissi) */
        .qr-wrapper {
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            /* QR kodun kendi kabartma efekti */
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.8),
                0 0 0 3px #1f6feb; /* cubeCode imza rengi çerçeve */
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(10px); /* QR alanı yüzeyden dışarı doğru kabarık durur */
        }

        .qr-container {
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Küp Yüzey Konumlandırmaları (Yarım boyut 120px) */
        .front  { transform: rotateY(0deg) translateZ(120px); }
        .back   { transform: rotateY(180deg) translateZ(120px); }
        .right  { transform: rotateY(90deg) translateZ(120px); }
        .left   { transform: rotateY(-90deg) translateZ(120px); }
        .top    { transform: rotateX(90deg) translateZ(120px); }
        .bottom { transform: rotateX(-90deg) translateZ(120px); }

        .info-panel {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #8b949e;
        }
        span { color: #58a6ff; font-weight: 600; }
    </style>
</head>
<body>

    <h1>cubeCode Prototipi</h1>
    <p>Ekranı parmağınla (veya mouse ile) sürükleyerek 3D küpü çevirebilirsin.</p>

    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <!-- 1. Yüzey -->
            <div class="cube-face front">
                <h3>Yüzey 1: Ürün Bilgisi</h3>
                <div class="qr-wrapper">
                    <div class="qr-container" id="qr-front"></div>
                </div>
            </div>
            <!-- 2. Yüzey -->
            <div class="cube-face back">
                <h3>Yüzey 2: Garanti Belgesi</h3>
                <div class="qr-wrapper">
                    <div class="qr-container" id="qr-back"></div>
                </div>
            </div>
            <!-- 3. Yüzey -->
            <div class="cube-face right">
                <h3>Yüzey 3: Kullanım Kılavuzu</h3>
                <div class="qr-wrapper">
                    <div class="qr-container" id="qr-right"></div>
                </div>
            </div>
            <!-- 4. Yüzey -->
            <div class="cube-face left">
                <h3>Yüzey 4: Sosyal Medya</h3>
                <div class="qr-wrapper">
                    <div class="qr-container" id="qr-left"></div>
                </div>
            </div>
            <!-- 5. Yüzey -->
            <div class="cube-face top">
                <h3>Yüzey 5: Kampanya</h3>
                <div class="qr-wrapper">
                    <div class="qr-container" id="qr-top"></div>
                </div>
            </div>
            <!-- 6. Yüzey -->
            <div class="cube-face bottom">
                <h3>Yüzey 6: Teknik Destek</h3>
                <div class="qr-wrapper">
                    <div class="qr-container" id="qr-bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="info-panel">
        Durum: <span>Mobil & Kabartma Modu Aktif</span>
    </div>

    <script>
        // Her yüzey için veriler
        const qrData = {
            front: "https://cubecode.io/urun",
            back: "https://cubecode.io/garanti",
            right: "https://cubecode.io/kilavuz",
            left: "https://cubecode.io/sosyal",
            top: "https://cubecode.io/kampanya",
            bottom: "https://cubecode.io/destek"
        };

        // QR Kodları üretme
        const qrSize = 130;
        new QRCode(document.getElementById("qr-front"), { text: qrData.front, width: qrSize, height: qrSize });
        new QRCode(document.getElementById("qr-back"), { text: qrData.back, width: qrSize, height: qrSize });
        new QRCode(document.getElementById("qr-right"), { text: qrData.right, width: qrSize, height: qrSize });
        new QRCode(document.getElementById("qr-left"), { text: qrData.left, width: qrSize, height: qrSize });
        new QRCode(document.getElementById("qr-top"), { text: qrData.top, width: qrSize, height: qrSize });
        new QRCode(document.getElementById("qr-bottom"), { text: qrData.bottom, width: qrSize, height: qrSize });

        // Döndürme mantığı (Mouse + Dokunmatik / Touch desteği)
        const scene = document.getElementById('scene');
        const cube = document.getElementById('cube');

        let isDragging = false;
        let startX, startY;
        let rotX = -20;
        let rotY = -30;
        const translateZVal = -120;

        function updateCubeTransform() {
            cube.style.transform = `translateZ(${translateZVal}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        updateCubeTransform();

        // Başlangıç (Mouse & Touch)
        function startDrag(clientX, clientY) {
            isDragging = true;
            startX = clientX;
            startY = clientY;
        }

        // Hareket (Mouse & Touch)
        function moveDrag(clientX, clientY) {
            if (!isDragging) return;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            rotY += deltaX * 0.6;
            rotX -= deltaY * 0.6;

            updateCubeTransform();

            startX = clientX;
            startY = clientY;
        }

        function endDrag() {
            isDragging = false;
        }

        // Event Listeners (Fare)
        scene.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        // Event Listeners (Mobil Dokunmatik)
        scene.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                moveDrag(e.touches.clientX, e.touches.clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', endDrag);
    </script>
</body>
</html>
